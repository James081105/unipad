[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unipad"
version = "0.1.0"
description = "Windows controller for running real iPadOS userland under QEMU AArch64 TCG (UniXNU), with DRM-free ARM64 Device IPA install/run support"
requires-python = ">=3.12"
dependencies = [
    # Zero hard runtime dependencies: the controller must run on a bare Windows host.
]

[project.optional-dependencies]
inventory = ["psutil>=5.9"]  # optional richer host inventory; stdlib fallback exists
# PyYAML is a dev dependency, not an optional one, and the reason is a
# measurement rather than a preference: tests/unit/test_workflow_contracts.py
# imports it at module level (line 22) to parse the workflow files, so on a
# runner without it the import kills *collection* of the whole unit stage.
# Measured 2026-10-25 -- every preflight run since that test was added failed
# with "ModuleNotFoundError: No module named 'yaml'" before executing a single
# test, while the same suite passes on a developer host that happens to have
# PyYAML installed.  Declaring it is the fix; the alternative (importing
# lazily and pytest.skip, as tests/acceptance/test_p0p1_gate_main.py:460 does)
# would turn that test into a check that never runs on CI, which is the exact
# failure mode its own docstring exists to prevent.
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
unipad = "unipad.controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running simulation tests",
    "acceptance: milestone gate simulation tests (no real hardware)",
]
