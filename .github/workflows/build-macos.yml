# UniPad pipeline #2: build-macos -- PRD 8.2 step 2 ("build-macos: 按固定版本运行最小构建；只执行所需阶段")
# plus PRD 8.1 (macOS build input/output contract) and PRD 8.3 (pinned versions,
# TCG/HVF separation, concurrency dedupe, job timeout, artifact retention, cache keys).
#
# Inputs are validated against config/sources.lock.json BEFORE any paid macOS
# minute is spent: a mismatch fails the job (PRD 8.4 "fail fast").
#
# PRD 8.2 step 4 / PRD 12: this job uploads ONLY allowlisted roles
# (firmware / bootloader / kernel / devicetree / auxiliary).  Full system
# images, IPSW/DMG/raw disk payloads and private data are excluded by default
# deny; the manifest records every excluded file so the exclusion is auditable.
#
# PINNING NOTE (PRD 8.3): `macos-latest` is deliberately NOT assumed to keep a
# stable architecture or Xcode.  After M0 the runner image and Xcode/SDK must be
# pinned here (e.g. runs-on: macos-14 plus an explicit Xcode selection); the
# resolved versions are already recorded in artifact-manifest.json so a pinning
# change is visible in the artifact contract.  Even on an arm64 runner, HVF
# nesting is NOT assumed to exist: the build must stand alone.
#
# Cost note (PRD 8.4): the job timeout is also the per-run macOS budget ceiling
# (~60 min of standard macOS overage is roughly 3.72 USD on a private repo), so
# the job is expected to finish or fail well before the ceiling.

name: build-macos

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Experiment/build identity, e.g. exp-2026-10-22-m2 (PRD 7.3). Also the concurrency dedupe key.'
        required: true
        type: string
      unixnu_commit:
        description: 'Pinned UniXNU commit (full or abbreviated sha) to build.'
        required: true
        type: string
      device_commit:
        description: 'Pinned device-repo (UniXNU-qemu) commit to build.'
        required: true
        type: string
      stage:
        description: 'Milestone/stage to build for, e.g. M2|M3|M4|M5... (PRD 6).'
        required: false
        default: 'M2'
        type: string
      system_build:
        description: 'System build identity, e.g. 21H161. Must be one of the pinned build_candidates when the lock is frozen.'
        required: false
        default: ''
        type: string
      payload_target:
        description: 'Payload target. tcg for the Intel Windows host; hvf only as a comparison experiment and never published as tcg.'
        required: false
        default: 'tcg'
        type: choice
        options:
          - tcg
          - hvf

# Least privilege: the build reads the repository and uploads an artifact.
# Release/issue permissions are not granted here (publish-artifacts owns that,
# narrowly, and only in its publish job).
permissions:
  contents: read

# PRD 8.3 "同一实验并发去重": one build per experiment id.  cancel-in-progress is
# false on purpose -- cancelling a paid macOS build would throw away minutes and
# evidence, so a duplicate run is queued instead.
concurrency:
  group: unipad-build-${{ inputs.experiment_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build-macos (${{ inputs.stage }}, target=${{ inputs.payload_target }})
    # TODO(M0, PRD 8.3): pin the runner image and Xcode/SDK after M0 verifies the
    # toolchain (e.g. runs-on: macos-14 with an explicit Xcode selection).  Do not
    # assume macos-latest keeps the same architecture; do not assume HVF nesting
    # exists on an arm64 runner.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # This repository declares NO submodules: there is no .gitmodules and
      # `git submodule status` is empty, so `submodules: recursive` fetches
      # nothing and reads as though the sources had been handled.  They have
      # not.  The two pinned upstreams are placed under vendor/ by the
      # acquisition step below, at the commits recorded in
      # config/sources.lock.json.  They are deliberately NOT .gitmodules
      # entries: that would make every pin exist twice, once as a gitlink in
      # the index and once in the lock -- exactly the divergence this project
      # has already been bitten by (call-chain 7.4, standards R-1).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record toolchain versions (feeds cache key and manifest)
        id: toolchain
        run: |
          set -euo pipefail
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          xcode="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
          clang="$(clang --version 2>/dev/null | head -n 1 || true)"
          py="$(python3 --version 2>&1 || true)"
          {
            echo "runner_os=$os"
            echo "runner_arch=$arch"
            echo "xcode_version=${xcode:-unknown}"
            echo "clang_version=${clang:-unknown}"
            echo "python_version=${py:-unknown}"
          } >> "$GITHUB_OUTPUT"
          echo "toolchain: os=$os arch=$arch xcode=${xcode:-unknown} clang=${clang:-unknown} python=${py:-unknown}"

      # PRD 8.1/8.3: validate the dispatch inputs against the pinned source lock
      # before spending macOS minutes.  A frozen lock that disagrees with the
      # requested commits is a hard failure; an unfrozen lock is reported loudly.
      - name: Validate inputs against sources.lock.json
        id: inputs
        env:
          LOCK_PATH: config/sources.lock.json
          REPORT_DIR: build
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          UNIXNU_COMMIT: ${{ inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ inputs.device_commit }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
        run: |
          mkdir -p build
          python3 - <<'PY'
          """Validate build inputs against config/sources.lock.json (PRD 8.1 inputs).

          Writes build/input-validation.json.  Exit 1 on any mismatch so the job
          fails before paid macOS minutes are consumed (PRD 8.4).
          """
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          LOCK = Path(os.environ.get("LOCK_PATH", "config/sources.lock.json"))
          OUT_DIR = Path(os.environ.get("REPORT_DIR", "build"))
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          MILESTONES = (
              "M0", "M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8", "M9",
              "M9a", "M9b", "M10", "M10a", "M11", "M12", "M13", "M14", "M15",
          )
          EXP_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")
          SHA_RE = re.compile(r"^[0-9a-fA-F]{7,40}$")
          BUILD_RE = re.compile(r"^[0-9A-Za-z][0-9A-Za-z.]{0,31}$")

          experiment_id = os.environ.get("EXPERIMENT_ID", "").strip()
          unixnu_commit = os.environ.get("UNIXNU_COMMIT", "").strip()
          device_commit = os.environ.get("DEVICE_COMMIT", "").strip()
          stage = os.environ.get("STAGE", "").strip()
          system_build = os.environ.get("SYSTEM_BUILD", "").strip()
          payload_target = os.environ.get("PAYLOAD_TARGET", "tcg").strip().lower()

          problems = []
          warnings = []
          if not EXP_RE.match(experiment_id):
              problems.append("experiment_id must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ (it is the concurrency key and artifact name)")
          if not SHA_RE.match(unixnu_commit):
              problems.append("unixnu_commit is not a git sha")
          if not SHA_RE.match(device_commit):
              problems.append("device_commit is not a git sha")
          if stage not in MILESTONES:
              problems.append(f"stage must be one of {','.join(MILESTONES)} (got '{stage}')")
          if payload_target not in ("tcg", "hvf"):
              problems.append("payload_target must be tcg or hvf")
          if payload_target == "hvf":
              warnings.append("payload_target=hvf: comparison build only. HVF payloads must never be fetched to the Intel Windows host or published as tcg (PRD 8.3).")

          lock = {}
          lock_sha = None
          frozen = False
          lock_loaded = False
          try:
              raw = LOCK.read_bytes()
              lock_sha = hashlib.sha256(raw).hexdigest()
              parsed = json.loads(raw.decode("utf-8"))
              if not isinstance(parsed, dict):
                  raise ValueError("lock root is not an object")
              lock = parsed
              lock_loaded = True
              frozen = bool(lock.get("frozen", False))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
              problems.append(f"cannot read config/sources.lock.json: {exc.__class__.__name__}")

          candidates = []
          if isinstance(lock.get("system_identity"), dict):
              candidates = lock["system_identity"].get("build_candidates") or []
          if system_build:
              if not BUILD_RE.match(system_build):
                  problems.append("system_build must match ^[0-9A-Za-z][0-9A-Za-z.]{0,31}$")
              if candidates and system_build not in candidates:
                  problems.append(f"system_build '{system_build}' is not one of the pinned build_candidates {candidates}")
          else:
              warnings.append("system_build is empty; the manifest records it as null (PRD 8.1 platform info)")

          if lock_loaded:
              if not isinstance(lock.get("unixnu"), dict) or not isinstance(lock.get("device_repo"), dict):
                  problems.append("sources.lock.json must contain 'unixnu' and 'device_repo' objects (PRD 8.1 inputs)")
              lock_unixnu = (lock.get("unixnu") or {}).get("commit") if isinstance(lock.get("unixnu"), dict) else None
              lock_device = (lock.get("device_repo") or {}).get("commit") if isinstance(lock.get("device_repo"), dict) else None
              if frozen:
                  if lock_unixnu and lock_unixnu.lower() != unixnu_commit.lower():
                      problems.append(f"unixnu_commit '{unixnu_commit}' != sources.lock.json unixnu.commit '{lock_unixnu}'")
                  if lock_device and lock_device.lower() != device_commit.lower():
                      problems.append(f"device_commit '{device_commit}' != sources.lock.json device_repo.commit '{lock_device}'")
                  if not lock_unixnu or not lock_device:
                      problems.append("sources.lock.json is frozen but a repository commit is null")
              else:
                  warnings.append("sources.lock.json is NOT FROZEN: the dispatch inputs are the freeze candidates and are recorded verbatim in artifact-manifest.json")
          elif not any("sources.lock.json" in problem for problem in problems):
              problems.append("sources.lock.json is empty or has no repository pins (PRD 8.1 inputs)")

          head = ""
          try:
              head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=False).stdout.strip()
          except OSError:
              head = ""

          report = {
              "schema_version": 1,
              "check": "build-inputs",
              "experiment_id": experiment_id,
              "stage": stage,
              "payload_target": payload_target,
              "unixnu_commit": unixnu_commit,
              "device_commit": device_commit,
              "system_build": system_build or None,
              "lock": {
                  "path": LOCK.as_posix(),
                  "sha256": lock_sha,
                  "frozen": frozen,
                  "build_candidates": candidates,
              },
              "checked_out_head": head or None,
              "problems": problems,
              "warnings": warnings,
              "status": "fail" if problems else "pass",
          }
          (OUT_DIR / "input-validation.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for warning in warnings:
              print(f"::warning::{warning}")
          for problem in problems:
              print(f"::error::{problem}")
          print(f"input validation status: {report['status']}")
          sys.exit(1 if problems else 0)
          PY

      # PRD 8.3: the cache key carries the source commits, the stage, the system
      # build, the lock hash, the build-script hash and the toolchain versions.
      # No restore-keys: a stale toolchain/bootstrap cache must never be able to
      # make an old input set "succeed" (PRD 11, 构建不可复现), and a signing
      # key/policy change is part of the lock hash.
      - name: 'Restore build toolchain cache (key: source + config + tool versions)'
        uses: actions/cache@v4
        with:
          path: ~/.cache/unipad-macos-build
          key: unipad-macos-build-${{ runner.os }}-${{ steps.toolchain.outputs.xcode_version }}-${{ inputs.unixnu_commit }}-${{ inputs.device_commit }}-${{ inputs.stage }}-${{ inputs.system_build }}-${{ hashFiles('config/sources.lock.json', 'scripts/macos/**') }}

      - name: Compute artifact name (sanitized experiment id)
        id: naming
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$EXPERIMENT_ID" | tr -c 'A-Za-z0-9._-' '_')"
          name="unipad-build-${safe}-${RUN_ID}"
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
          echo "artifact name: $name"

      # PRD 8.1 inputs: obtain the sources BEFORE the build, and prove they are
      # the ones the lock promised.  Three phases, all inside one step so that
      # "read the lock", "fetch" and "compare" cannot drift apart:
      #
      #   1. acquire    -- the two checkouts the upstream driver cannot fetch
      #                    for itself, at the commits in sources.lock.json.
      #   2. assemble   -- the driver fetches everything else: the module
      #                    submodules (DarwinBoot, the Native* drivers, the
      #                    kits) and the feeds.toml references (xnu,
      #                    libplatform, libdispatch, AvailabilityVersions,
      #                    edk2, libpthread, corecrypto-2023, IOStorageFamily,
      #                    dyld).  The workflow does not hand-roll this: a
      #                    second implementation of the fetcher is the exact
      #                    divergence class this project keeps hitting.
      #   3. cross-check-- `unixnu status` and the driver's own unixnu.lock are
      #                    compared with sources.lock.json, and a disagreement
      #                    fails the job.  A build that silently compiles
      #                    different bytes than the lock promised is the
      #                    failure this prevents.
      - name: Acquire and verify the pinned sources (vendor/ + unixnu fetch/tree + pin cross-check)
        id: sources
        env:
          LOCK_PATH: config/sources.lock.json
          VENDOR_DIR: vendor
          REPORT_DIR: build
          UNIXNU_DRIVER: vendor/UniXNU/unixnu
          DEVICE_REPO: vendor/UniXNU-qemu
          # ONE out root, shared with the build step below.  The driver keeps
          # its feed clones under <out>/feeds and assembles the tree under
          # <out>/<board>/tree (config.py:83-84, tree.py:41), and
          # scripts/macos/build-macos.sh derives its own UNIXNU_OUT as
          # "$OUT_DIR/unixnu-out" and then proves every feed clone is already
          # on disk at the locked commit by scanning "$FEEDS_DIR"/*.  If the
          # two halves name different roots, this step populates one directory
          # while prepare-sources scans another, finds nothing, and refuses
          # with artifact_missing -- the build never reaches a build stage at
          # all, which is the defect this step exists to remove.
          OUT_ROOT: build-output/unixnu-out
          GIT_FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Obtain the pinned sources and prove they are the locked ones (PRD 8.1).

          Every commit comes from config/sources.lock.json and from nowhere
          else.  A second place that knows a sha is the divergence class this
          project keeps hitting (call-chain 7.4: 18 helper names across 5
          scripts, 11 diverged; standards R-1: three port validators, three
          ranges), so nothing here is hardcoded and nothing is re-derived by
          parsing feeds.toml: `unixnu status` already prints every git source
          as `git pinned <sha12>` or `NOT LOCKED` (scripts/unixnu/cli.py
          cmd_status) and `unixnu fetch` writes the device repository's
          unixnu.lock, so both are the driver's own output rather than a
          second implementation of it.

          Only the two repositories the driver cannot clone are cloned here:
          scripts/unixnu/config.py Context.__init__ raises "no device
          repository" without -D, and cli.py has no subcommand that clones
          either the device repository or its own root.

          HONESTY: a real clone from github.com cannot be exercised on the
          Windows code-stage host (github.com over the git protocol is blocked;
          only api.github.com answers), and the driver's kernel step needs
          xcodebuild.  What is proven here is the pin resolution, the argument
          construction, the refusals and the manifest shape.  The network half
          is recorded as UNVERIFIED and can only be proven on a macOS runner.
          """
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          LOCK_PATH = os.environ.get("LOCK_PATH", "config/sources.lock.json")
          VENDOR_DIR = os.environ.get("VENDOR_DIR", "vendor")
          REPORT_DIR = os.environ.get("REPORT_DIR", "build")
          DRIVER = os.environ.get("UNIXNU_DRIVER", "vendor/UniXNU/unixnu")
          DEVICE_REPO = os.environ.get("DEVICE_REPO", "vendor/UniXNU-qemu")
          OUT_ROOT = os.environ.get("OUT_ROOT", "build-output/unixnu-out")
          REPO_ROOT = os.environ.get("REPO_ROOT", ".")
          PRIVATE_COMPONENT = "local-private"

          # (key in sources.lock.json, directory under vendor/)
          ACQUISITIONS = (("unixnu", "UniXNU"), ("device_repo", "UniXNU-qemu"))

          # The module kinds scripts/unixnu/config.py KINDS knows about; the
          # status header lines ("device", "output", "config") are not among
          # them, which is what keeps them from being read as modules.
          KINDS = ("driver", "kit", "patch", "script", "package", "refer")
          STATUS_LINE = re.compile(
              r"^(?P<kind>\S+)\s+(?P<name>\S+)\s+(?P<origin>\S+)(?:\s+(?P<extra>.*))?$"
          )
          SHA_RE = re.compile(r"^[0-9a-fA-F]{7,40}$")
          URL_RE = re.compile(r"^\s*url\s*=\s*(\S+)", re.MULTILINE)

          UNVERIFIED = (
              "a real clone from github.com cannot be exercised on the Windows code-stage host: "
              "github.com over the git protocol is blocked and only api.github.com answers, so the "
              "network half of the acquire phase -- and of the driver's own fetch -- is UNVERIFIED "
              "until a macOS runner performs it",
              "the upstream driver's kernel step builds with the Xcode iphoneos SDK, so no part of "
              "the build itself is claimed by this step",
          )


          class SourcePinError(Exception):
              """A refusal to obtain or trust the sources.

              The lock is unreadable, a pin is not a pin, what was fetched is
              not what the lock promised, or the fetched material is not
              ignorable.  Every one of them fails the job rather than
              defaulting to something plausible.
              """


          def _announce(problems, message):
              print(f"::error::{message}")
              problems.append(message)


          def _warn(warnings, message):
              print(f"::warning::{message}")
              warnings.append(message)


          def _refuse_private(path):
              """PRD 12: nothing under local-private/ is fetched, built or published."""
              resolved = Path(path).resolve()
              for part in resolved.parts:
                  if part.lower() == PRIVATE_COMPONENT:
                      raise SourcePinError(
                          f"{Path(path).as_posix()} is under {PRIVATE_COMPONENT}/ (PRD 12): "
                          "private material is never fetched or built here"
                      )


          def _write_report(name, payload):
              directory = Path(REPORT_DIR)
              directory.mkdir(parents=True, exist_ok=True)
              path = directory / name
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(f"report: {path.as_posix()}")


          def _publish_outputs(pins, lock_sha, frozen):
              """Publish the commits the LOCK pinned as this step's outputs.

              The dispatch inputs are what a human asked for; the lock is what
              this step fetched and what the driver assembled.  Downstream steps
              -- the manifest, the summary, the cache key -- must quote the
              second, or a manifest can attest to a commit that was never built
              while the build quietly used another one.  That is the same
              silent-divergence class the cross-check exists to catch, one layer
              further down.

              ``frozen`` is published for the same reason.  The lock's sha256
              lets a reader re-read the lock, but only if they still have this
              repository at this commit; the manifest should say outright
              whether the build ran against a frozen baseline rather than
              making every consumer derive it.  An unfrozen build is a
              legitimate one -- build-macos.sh treats the pins as the freeze
              candidates -- so this is a fact to record, not a failure to
              propagate.
              """
              path = os.environ.get("GITHUB_OUTPUT")
              if not path:
                  return
              lines = [
                  f"unixnu_commit={pins['unixnu']['commit']}",
                  f"device_commit={pins['device_repo']['commit']}",
                  f"unixnu_repo={pins['unixnu']['repo']}",
                  f"device_repo={pins['device_repo']['repo']}",
                  f"lock_sha256={lock_sha}",
                  f"lock_frozen={'true' if frozen else 'false'}",
              ]
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
              print(f"outputs: {path}")


          def load_pins(lock_path=None):
              """(pins, feeds, frozen, sha256) read from the source lock.

              A missing, empty or malformed pin is a refusal.  It is never
              coerced to an empty string: a checkout made from "" is a
              checkout of whatever HEAD happened to be, which is precisely the
              silent divergence this step exists to prevent.
              """
              path = Path(LOCK_PATH if lock_path is None else lock_path)
              try:
                  raw = path.read_bytes()
              except OSError as exc:
                  raise SourcePinError(
                      f"cannot read {path.as_posix()}: {exc.__class__.__name__}"
                  ) from None
              try:
                  lock = json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise SourcePinError(
                      f"{path.as_posix()} is not valid JSON: {exc.__class__.__name__}"
                  ) from None
              if not isinstance(lock, dict):
                  raise SourcePinError(f"{path.as_posix()}: the root is not an object")
              pins = {}
              for key, directory in ACQUISITIONS:
                  section = lock.get(key)
                  if not isinstance(section, dict):
                      raise SourcePinError(
                          f"{path.as_posix()}: '{key}' is missing or is not an object; it pins {directory}"
                      )
                  for field in ("repo", "commit"):
                      value = section.get(field)
                      if not isinstance(value, str) or not value.strip():
                          raise SourcePinError(
                              f"{path.as_posix()}: {key}.{field} is {value!r}; an empty pin is not a pin "
                              "(it would fetch whatever HEAD is)"
                          )
                  commit = section["commit"].strip()
                  if not SHA_RE.match(commit):
                      raise SourcePinError(f"{path.as_posix()}: {key}.commit {commit!r} is not a git sha")
                  pins[key] = {
                      "repo": section["repo"].strip(),
                      "commit": commit,
                      "directory": directory,
                  }
              feeds = lock.get("feeds")
              if feeds is None:
                  feeds = []
              if not isinstance(feeds, list):
                  raise SourcePinError(f"{path.as_posix()}: 'feeds' is not an array")
              return pins, feeds, bool(lock.get("frozen")), hashlib.sha256(raw).hexdigest()


          def _run_git(args, *, check=True):
              """Run git, echoing it the way scripts/unixnu/util.py run() does."""
              command = ["git", *[str(part) for part in args]]
              print("+ " + " ".join(command), flush=True)
              result = subprocess.run(command, capture_output=True, text=True)
              if check and result.returncode:
                  raise SourcePinError(
                      f"git failed ({result.returncode}): {' '.join(command)}\n{result.stderr.strip()}"
                  )
              return result


          def _head_of(directory):
              directory = Path(directory)
              if not directory.joinpath(".git").exists():
                  return None
              result = _run_git(["-C", directory, "rev-parse", "HEAD"], check=False)
              if result.returncode or not result.stdout.strip():
                  return None
              return result.stdout.strip()


          def acquire_one(url, commit, destination, *, depth=None):
              """Place one pinned checkout at destination and prove it is at that commit.

              The shape mirrors scripts/unixnu/feeds.py fetch(): init, point the
              remote, fetch the wanted commit BY SHA, detach onto FETCH_HEAD.
              Never a branch name -- a branch is a moving target and the lock
              pins a commit.
              """
              url, commit = str(url or "").strip(), str(commit or "").strip()
              if not url:
                  raise SourcePinError("no repository URL: refusing to fetch from an empty remote")
              if not SHA_RE.match(commit):
                  raise SourcePinError(
                      f"{commit!r} is not a git sha: refusing to fetch it (an empty ref is not a pin)"
                  )
              if depth is None:
                  depth = int(os.environ.get("GIT_FETCH_DEPTH", "1"))
              destination = Path(destination)
              head = _head_of(destination)
              if head is not None and head.lower() == commit.lower():
                  return {"status": "present", "head": head, "fetched": False}
              destination.mkdir(parents=True, exist_ok=True)
              _run_git(["-C", destination, "init", "-q"])
              probe = _run_git(["-C", destination, "remote", "get-url", "origin"], check=False)
              if probe.returncode == 0:
                  _run_git(["-C", destination, "remote", "set-url", "origin", url])
              else:
                  _run_git(["-C", destination, "remote", "add", "origin", url])
              _run_git(["-C", destination, "fetch", "-q", "--depth", str(depth), "origin", commit])
              _run_git(["-C", destination, "checkout", "-q", "--detach", "FETCH_HEAD"])
              head = _head_of(destination)
              if head is None:
                  raise SourcePinError(
                      f"{destination.as_posix()}: no HEAD after checkout; the acquisition produced no checkout"
                  )
              if head.lower() != commit.lower():
                  raise SourcePinError(
                      f"{destination.as_posix()}: the lock pins {commit} but the checkout is at {head}; "
                      "refusing to build bytes the lock did not promise"
                  )
              return {"status": "acquired", "head": head, "fetched": True}


          def ensure_vendor_ignored(repo_root=None, vendor=None, locked_urls=()):
              """vendor/ is fetched material: it must never be committable.

              The rule goes to .git/info/exclude, which is local to the
              checkout and never committed, so the ignore rule cannot itself
              become a second source of truth that diverges between clones.
              A tracked file under vendor/, or a .gitmodules entry pointing at
              a repository the lock already pins, is a refusal: either one
              makes the pin exist twice.
              """
              root = Path(REPO_ROOT if repo_root is None else repo_root)
              vendor = VENDOR_DIR if vendor is None else vendor
              tracked = _run_git(["-C", root, "ls-files", "--", vendor], check=False)
              if tracked.returncode == 0 and tracked.stdout.strip():
                  names = ", ".join(sorted(tracked.stdout.split())[:5])
                  raise SourcePinError(
                      f"{vendor}/ has tracked files ({names}...): fetched material must not be committed"
                  )
              modules = root / ".gitmodules"
              if modules.is_file():
                  try:
                      text = modules.read_text(encoding="utf-8", errors="replace")
                  except OSError:
                      text = ""
                  for url in URL_RE.findall(text):
                      if url in set(locked_urls):
                          raise SourcePinError(
                              f".gitmodules points at {url}, which the source lock already pins: the pin "
                              "would exist twice, once as a gitlink in the index and once in the lock. "
                              "vendor/ is the single place the pins live."
                          )
              # The rule is "/vendor" without a trailing slash on purpose: a
              # pattern ending in "/" only matches directories, and git answers
              # check-ignore 1 for a bare pathname that it has not been told is
              # a directory, so "/vendor/" would never satisfy the probe below.
              # Both the probe and the re-verification ask about the bare name.
              #
              # It is anchored, so it must be spelled *relative to the root*:
              # str() on a Windows absolute path keeps the backslashes and the
              # drive letter, which would write a rule matching nothing and then
              # fail the re-verification below on a caller that passes one.
              # relpath also normalises the separators, which str() does not.
              ignored = _run_git(["-C", root, "check-ignore", "-q", vendor], check=False)
              if ignored.returncode == 1:
                  exclude = root / ".git" / "info" / "exclude"
                  exclude.parent.mkdir(parents=True, exist_ok=True)
                  existing = exclude.read_text(encoding="utf-8", errors="replace") if exclude.is_file() else ""
                  try:
                      relative = Path(os.path.relpath(root / vendor, root)).as_posix()
                  except ValueError:  # a different drive: relpath cannot help
                      relative = Path(vendor).as_posix()
                  rule = "/" + relative.strip("/")
                  if rule not in existing.splitlines():
                      with exclude.open("a", encoding="utf-8") as handle:
                          if existing and not existing.endswith("\n"):
                              handle.write("\n")
                          handle.write(
                              "# Fetched upstream sources; never committed "
                              "(see .github/workflows/build-macos.yml).\n" + rule + "\n"
                          )
              elif ignored.returncode != 0:
                  raise SourcePinError(
                      f"cannot ask git whether {vendor}/ is ignored (exit {ignored.returncode})"
                  )
              again = _run_git(["-C", root, "check-ignore", "-q", vendor], check=False)
              if again.returncode != 0:
                  raise SourcePinError(
                      f"{vendor}/ is still not ignored; fetched material could be committed"
                  )
              return True


          def driver_argv(subcommand, *, driver=None, device=None, out_root=None, extra=()):
              """The upstream driver's command line.

              Common arguments such as -D come AFTER the subcommand: cli.py
              attaches the shared parser to every subparser (parents=[c]), so
              `unixnu -D DIR fetch` is not a command line argparse accepts.
              """
              argv = [
                  sys.executable,
                  str(DRIVER if driver is None else driver),
                  str(subcommand),
              ]
              argv += ["-D", str(DEVICE_REPO if device is None else device)]
              argv += ["--out", str(OUT_ROOT if out_root is None else out_root)]
              argv += [str(part) for part in extra]
              return argv


          def run_driver(subcommand, **kwargs):
              argv = driver_argv(subcommand, **kwargs)
              print("+ " + " ".join(argv), flush=True)
              result = subprocess.run(argv)
              if result.returncode:
                  raise SourcePinError(
                      f"unixnu {subcommand} failed ({result.returncode}); see the log above"
                  )


          def parse_status(text):
              """(git pins, unpinned, not_reproducible) from `unixnu status` output.

              cli.py cmd_status prints one line per module as
              f'{kind:8} {name:24} {origin}{extra}' where extra is
              ' pinned <sha12>' or ' NOT LOCKED'.  Only lines whose kind is a
              real module kind are read, so the header lines cannot be
              mistaken for a module.
              """
              pins, unpinned, not_reproducible = {}, [], False
              for line in text.splitlines():
                  match = STATUS_LINE.match(line.strip())
                  if not match:
                      continue
                  kind, name, origin, extra = match.group("kind", "name", "origin", "extra")
                  if origin != "git":
                      continue
                  extra = (extra or "").strip()
                  if extra.startswith("pinned "):
                      pins[name] = extra[len("pinned "):].strip()
                  else:
                      pins[name] = None
                      unpinned.append(f"{kind}:{name}")
              if "not reproducible:" in text:
                  not_reproducible = True
              return pins, unpinned, not_reproducible


          def parse_driver_lock(path):
              """{source name: commit} from the unixnu.lock the driver itself wrote."""
              path = Path(path)
              if not path.is_file():
                  return {}
              try:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError) as exc:
                  raise SourcePinError(
                      f"{path.as_posix()} is unreadable: {exc.__class__.__name__}"
                  ) from None
              resolved = {}
              for name, values in (data.get("source") or {}).items():
                  commit = values.get("commit") if isinstance(values, dict) else None
                  if isinstance(commit, str) and commit.strip():
                      resolved[name] = commit.strip()
              return resolved


          def cross_check(feeds, driver_lock, status_text, heads):
              """Compare what the driver resolved with what the lock promised."""
              problems, warnings = [], []
              pinned_feeds = {
                  entry["name"]: entry
                  for entry in feeds
                  if isinstance(entry, dict) and isinstance(entry.get("name"), str) and entry["name"]
              }
              # 1. the lock's feeds against the unixnu.lock the driver wrote
              #    (full 40-character commits, not the 12 the status prints).
              for name in sorted(set(pinned_feeds) - set(driver_lock)):
                  _announce(
                      problems,
                      f"{name}: the source lock pins it but the driver's unixnu.lock does not record it "
                      "(unixnu fetch did not resolve it)",
                  )
              for name in sorted(set(driver_lock) - set(pinned_feeds)):
                  _announce(
                      problems,
                      f"{name}: the driver's unixnu.lock records it but the source lock does not pin it; "
                      "the lock is missing a feed",
                  )
              for name in sorted(set(pinned_feeds) & set(driver_lock)):
                  want = str(pinned_feeds[name].get("commit") or "")
                  got = driver_lock[name]
                  if want.lower() != got.lower():
                      _announce(problems, f"{name}: the driver resolved {got} but the source lock pins {want}")
              # 2. the status report
              pins, unpinned, not_reproducible = parse_status(status_text)
              for name in sorted(unpinned):
                  _announce(problems, f"{name} is NOT LOCKED: the driver resolved no commit for it")
              for name, resolved in sorted(pins.items()):
                  entry = pinned_feeds.get(name)
                  if entry is None:
                      _announce(
                          problems,
                          f"{name}: the driver reports a git source the source lock does not pin",
                      )
                      continue
                  if not resolved:
                      continue
                  want = str(entry.get("commit") or "")
                  if want and not want.lower().startswith(resolved.lower()):
                      _announce(
                          problems,
                          f"{name}: the driver resolved {resolved} but the source lock pins {want}",
                      )
              for name in sorted(set(pinned_feeds) - set(pins)):
                  _announce(
                      problems,
                      f"{name}: the source lock pins it but `unixnu status` does not report it as a git source",
                  )
              if not_reproducible:
                  _announce(
                      problems,
                      "`unixnu status` reports 'not reproducible': at least one local source is not "
                      "pinned by unixnu.lock",
                  )
              if not pinned_feeds and (driver_lock or pins):
                  _announce(
                      problems,
                      "the source lock declares no feeds, so nothing the driver resolves can be "
                      "cross-checked against it",
                  )
              # 3. the two checkouts this step placed
              for label, pair in sorted(heads.items()):
                  want, got = pair.get("want"), pair.get("got")
                  if not want:
                      _announce(problems, f"{label}: no pin in the source lock to compare the checkout against")
                  elif not got:
                      _announce(problems, f"{label}: no HEAD in the checkout; the acquisition produced none")
                  elif want.lower() != got.lower():
                      _announce(problems, f"{label}: the checkout is at {got} but the source lock pins {want}")
              return problems, warnings


          def main():
              problems, warnings = [], []
              try:
                  pins, feeds, frozen, lock_sha = load_pins()
              except SourcePinError as error:
                  _announce(problems, str(error))
                  _write_report(
                      "source-acquisition.json",
                      {
                          "schema_version": 1,
                          "check": "source-acquisition",
                          "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": None},
                          "status": "fail",
                          "problems": problems,
                          "warnings": warnings,
                          "unverified": list(UNVERIFIED),
                      },
                  )
                  return 1
              print(f"== lock {Path(LOCK_PATH).as_posix()} sha256={lock_sha} frozen={frozen}")
              for key, pin in pins.items():
                  print(f"== pin  {pin['directory']:<12} {pin['repo']} {pin['commit']}")
              _publish_outputs(pins, lock_sha, frozen)

              # ---- phase 1: acquire -------------------------------------------
              print("== phase 1/3 acquire the pinned checkouts")
              heads, acquisitions = {}, []
              try:
                  _refuse_private(VENDOR_DIR)
                  _refuse_private(OUT_ROOT)
                  ensure_vendor_ignored(
                      REPO_ROOT, VENDOR_DIR, [pin["repo"] for pin in pins.values()]
                  )
                  for key, pin in pins.items():
                      destination = Path(VENDOR_DIR) / pin["directory"]
                      _refuse_private(destination)
                      outcome = acquire_one(pin["repo"], pin["commit"], destination)
                      heads[destination.as_posix()] = {"want": pin["commit"], "got": outcome["head"]}
                      acquisitions.append(
                          {
                              "lock_key": key,
                              "directory": pin["directory"],
                              "repo": pin["repo"],
                              "commit": pin["commit"],
                              **outcome,
                          }
                      )
                      print(f"== {pin['directory']} {outcome['status']} at {outcome['head']}")
              except SourcePinError as error:
                  _announce(problems, str(error))
                  _write_report(
                      "source-acquisition.json",
                      {
                          "schema_version": 1,
                          "check": "source-acquisition",
                          "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": lock_sha, "frozen": frozen},
                          "vendor_ignored": None,
                          "acquisitions": acquisitions,
                          "status": "fail",
                          "problems": problems,
                          "warnings": warnings,
                          "unverified": list(UNVERIFIED),
                      },
                  )
                  return 1
              _write_report(
                  "source-acquisition.json",
                  {
                      "schema_version": 1,
                      "check": "source-acquisition",
                      "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": lock_sha, "frozen": frozen},
                      "vendor_ignored": True,
                      "acquisitions": acquisitions,
                      "status": "pass",
                      "problems": [],
                      "warnings": [],
                      "unverified": list(UNVERIFIED),
                  },
              )

              # ---- phase 2: assemble with the driver --------------------------
              print("== phase 2/3 assemble with the upstream driver (fetch, tree)")
              try:
                  run_driver("fetch")
                  run_driver("tree")
              except SourcePinError as error:
                  _announce(problems, str(error))
                  _write_report(
                      "pin-crosscheck.json",
                      {
                          "schema_version": 1,
                          "check": "pin-crosscheck",
                          "status": "fail",
                          "problems": problems,
                          "warnings": warnings,
                          "unverified": list(UNVERIFIED),
                      },
                  )
                  return 1

              # ---- phase 3: cross-check ---------------------------------------
              print("== phase 3/3 cross-check the resolved pins against the source lock")
              status_text, status_error = "", ""
              try:
                  status = subprocess.run(driver_argv("status"), capture_output=True, text=True)
                  status_text = status.stdout
                  if status.returncode:
                      status_error = f"unixnu status failed ({status.returncode}): {status.stderr.strip()}"
                      _announce(problems, status_error)
              except OSError as error:
                  status_error = f"cannot run unixnu status: {error.__class__.__name__}"
                  _announce(problems, status_error)
              try:
                  driver_lock = parse_driver_lock(Path(DEVICE_REPO) / "unixnu.lock")
              except SourcePinError as error:
                  driver_lock = {}
                  _announce(problems, str(error))
              check_problems, check_warnings = cross_check(feeds, driver_lock, status_text, heads)
              problems += check_problems
              warnings += check_warnings
              if not check_problems:
                  print(f"== cross-check: {len(driver_lock)} feed pin(s) and 2 checkout(s) agree with the lock")
              _write_report(
                  "pin-crosscheck.json",
                  {
                      "schema_version": 1,
                      "check": "pin-crosscheck",
                      "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": lock_sha, "frozen": frozen},
                      "driver_lock_path": (Path(DEVICE_REPO) / "unixnu.lock").as_posix(),
                      "driver_lock": driver_lock,
                      "lock_feeds": {
                          entry["name"]: entry.get("commit")
                          for entry in feeds
                          if isinstance(entry, dict) and isinstance(entry.get("name"), str)
                      },
                      "status_error": status_error or None,
                      "heads": heads,
                      "problems": check_problems,
                      "warnings": check_warnings,
                      "unverified": list(UNVERIFIED),
                      "status": "fail" if check_problems else "pass",
                  },
              )
              for message in UNVERIFIED:
                  _warn(warnings, f"unverified: {message}")
              if problems:
                  print(f"== sources: FAIL ({len(problems)} problem(s))")
                  return 1
              print("== sources: PASS (acquired, assembled and cross-checked)")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      # PRD 8.1 / 8.3: the original kernelcache.  kernel.prelink() takes it from
      # --kernelcache, from board.toml [kernel.prelink] kernelcache, or out of
      # the IPSW (kernel.py:111-114); this board names no local file and its
      # [ipsw] url is https, so without this step build-kernel has no input and
      # records not_run -- which is why no macOS runner has ever produced a
      # kernel.macho.
      #
      # Two properties this step must have, and why:
      #
      # * It runs OUTSIDE build-output/ and staged/.  The kernelcache is Apple
      #   material extracted from a pinned firmware image (PRD 12): it may be
      #   used to build, but it must never be staged, hashed into
      #   artifact-manifest.json or uploaded.  The staging step below scans
      #   BUILD_OUTPUT_DIR only, so keeping the output elsewhere is what makes
      #   that true by construction rather than by an ignore rule that can
      #   drift.
      # * It is continue-on-error.  A blocked or truncated download must not
      #   take the whole job down: the remaining stages still have evidence to
      #   produce, and build-kernel then records not_run with its own reason
      #   instead of the run vanishing.  The step's own JSON records the refusal
      #   code, so a silent failure is still visible.
      - name: Acquire the pinned IPSW and publish the kernelcache
        id: ipsw
        continue-on-error: true
        env:
          LOCK_PATH: config/sources.lock.json
          DEVICE_REPO: vendor/UniXNU-qemu
          IPSW_WORK_DIR: ipsw-work
          KERNELCACHE_PATH: ipsw-work/kernelcache.macho
          # The device tree is extracted in the same pass, so build-devicetree
          # does not need the whole 6.8 GB image kept alive across the build.
          DEVICETREE_PATH: ipsw-work/devicetree
          SUMMARY_PATH: ipsw-work/ipsw-summary.json
          # The package lives in src/ and is installed as an editable shim on
          # the development host only -- a GitHub runner has no such shim, so
          # without this the step dies with
          # ModuleNotFoundError: No module named 'unipad'.  Measured on run
          # 40065266844.
          PYTHONPATH: src
        run: |
          # pipefail is load-bearing, not decoration.  Without it, `status=$?`
          # after `... | tee log` is tee's exit code, and a failing python
          # reads as a passing step -- which is exactly what happened on the
          # first real run: the module could not be imported, the step printed
          # "== ipsw: PASS", and the build then recorded not_run for a reason
          # that looked like a policy choice rather than an import error.
          set -uo pipefail
          # Not `set -e`: this step is allowed to fail, and a failing command
          # must not abort the shell before the summary is written.
          python3 -m unipad.host.ipsw \
            --lock "$LOCK_PATH" \
            --device "$DEVICE_REPO" \
            --work "$IPSW_WORK_DIR/work" \
            --kernelcache "$KERNELCACHE_PATH" \
            --devicetree "$DEVICETREE_PATH" \
            --summary "$SUMMARY_PATH" \
            | tee "$IPSW_WORK_DIR/ipsw.log"
          status=$?
          echo "ipsw_status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$KERNELCACHE_PATH" ]; then
            echo "kernelcache_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernelcache_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$DEVICETREE_PATH" ]; then
            echo "devicetree_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "devicetree_present=false" >> "$GITHUB_OUTPUT"
          fi
          # The image itself is deleted by the module the moment extraction
          # finishes; what is left here is the published Mach-O and the record.
          if [ "$status" -eq 0 ]; then
            echo "== ipsw: PASS (verified whole, kernelcache published)"
          else
            echo "::warning::the IPSW step failed (exit $status); build-kernel will record not_run. See $SUMMARY_PATH"
          fi
          exit 0

      # The XNU build's own prepare-xnu-source.py fetches three directory
      # listings from api.github.com with a bare urlopen -- unauthenticated, so
      # it shares GitHub's 60-requests-per-hour per-IP limit with every other
      # Actions runner on that address.  Measured on run 40066399042:
      # "HTTP Error 403: rate limit exceeded", which failed build-kernel before
      # a single translation unit was compiled.
      #
      # The script caches those listings by path and verifies every blob by its
      # git SHA-1, so seeding them with an authenticated request (5000/hour)
      # removes all three API calls without changing any content: the blobs are
      # still downloaded and still hash-checked by the upstream script.
      #
      # The tags are read from vendor/UniXNU/feeds.toml rather than written
      # here, so there is no second place that knows them.
      - name: Pre-seed the XNU header listings with an authenticated request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_ROOT: build-output/unixnu-out
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tomllib
          import urllib.request
          from pathlib import Path

          token = os.environ.get("GITHUB_TOKEN", "")
          feeds = tomllib.loads(
              Path("vendor/UniXNU/feeds.toml").read_text(encoding="utf-8")
          )
          xnu = feeds.get("xnu", {})
          driverkit = xnu.get("driverkit_tag", "xnu-10063.121.3")
          trustcache = xnu.get("trustcache_tag", "xnu-8796.101.5")
          repo = "https://api.github.com/repos/apple-oss-distributions/xnu/contents"
          wanted = [
              (f"{repo}/iokit/DriverKit?ref={driverkit}",
               f"xnu-driverkit-{driverkit.removeprefix('xnu-')}.json"),
              (f"{repo}/iokit/DriverKit/crypto?ref={driverkit}",
               f"xnu-driverkit-crypto-{driverkit.removeprefix('xnu-')}.json"),
              (f"{repo}/EXTERNAL_HEADERS/TrustCache?ref={trustcache}",
               f"xnu-trustcache-{trustcache.removeprefix('xnu-')}.json"),
          ]
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          root = Path(os.environ.get("OUT_ROOT", "build-output/unixnu-out"))
          trees = sorted(root.glob("*/tree"))
          if not trees:
              raise SystemExit(f"no assembled build tree under {root}")
          for url, name in wanted:
              request = urllib.request.Request(url, headers=headers)
              body = urllib.request.urlopen(request, timeout=60).read()
              # Refuse to seed a listing that is not the directory listing the
              # script expects: an error page would be cached as if it were data.
              entries = json.loads(body)
              if not isinstance(entries, list):
                  raise SystemExit(f"{url} did not return a directory listing")
              for tree in trees:
                  target = tree / ".cache" / "sources" / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(body)
              print(f"seeded {name}: {len(entries)} entries into {len(trees)} tree(s)")
          PY

      # The DarwinBoot EFI build links with lld-link, LLVM's MSVC-compatible
      # linker.  A GitHub macOS runner ships Xcode's ld and has no Homebrew LLVM,
      # so build-bootloader stops at "unixnu: lld-link not found on PATH (brew
      # install llvm lld)".  Measured on run 40076039682, where the kernel and all
      # ten archive builders had already succeeded.
      #
      # $GITHUB_PATH is used rather than an exported PATH so the keg is visible to
      # every later step, not just this one.
      - name: Install LLVM (lld-link for the bootloader link)
        run: |
          set -euo pipefail
          if ! command -v lld-link >/dev/null 2>&1; then
            echo "lld-link absent; installing llvm and lld"
            brew install llvm lld
          fi
          found=0
          for keg in /opt/homebrew/opt/llvm/bin /usr/local/opt/llvm/bin; do
            if [ -d "$keg" ]; then
              echo "$keg" >> "$GITHUB_PATH"
              echo "$keg added to PATH"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no llvm keg on disk after brew install llvm lld"
            exit 1
          fi
          lld-link --version

      - name: Run macOS build (scripts/macos/build-macos.sh)
        id: build
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          # The pins the lock resolved, for the record the build script keeps.
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          BUILD_OUTPUT_DIR: build-output
          STAGE_DIR: staged
          BUILD_LOG: macos-build.log
          TOOLCHAIN_CACHE_DIR: ~/.cache/unipad-macos-build
          DEVICETREE_PATH: ipsw-work/devicetree
          # The published kernelcache, when the IPSW step produced one.  Passed
          # only when it exists: an absent file must reach build-macos.sh as
          # "no --kernelcache", because then build-kernel records not_run with
          # its own reason rather than the script dying on a missing path.
          KERNELCACHE_PATH: ipsw-work/kernelcache.macho
        run: |
          set -euo pipefail
          if [ ! -f scripts/macos/build-macos.sh ]; then
            echo "::error::scripts/macos/build-macos.sh is missing: the macOS build entry point has not landed yet (code-stage blocker, PRD 9 scripts/macos/)"
            exit 3
          fi
          mkdir -p "$BUILD_OUTPUT_DIR"
          started=$(date -u +%s)
          echo "started_at=$started" >> "$GITHUB_OUTPUT"
          # --out must be passed, not defaulted: build-macos.sh defaults OUT_DIR
          # to scripts/macos/build-out/<run-id>, which would put its UNIXNU_OUT
          # -- and therefore the "$FEEDS_DIR"/* scan its prepare-sources step
          # uses to prove every feed clone is already on disk -- somewhere the
          # acquisition step never wrote.  Pointing it at the same directory the
          # staging step scans keeps one out root for the whole job.
          declare -a kernel_args=()
          if [ -f "$KERNELCACHE_PATH" ]; then
            kernel_args+=(--kernelcache "$KERNELCACHE_PATH")
            echo "build: using the extracted kernelcache ($KERNELCACHE_PATH)"
          else
            echo "::notice::no kernelcache was published; build-kernel will record not_run (see the ipsw step)"
          fi
          if [ -f "$DEVICETREE_PATH" ]; then
            kernel_args+=(--devicetree "$DEVICETREE_PATH")
            echo "build: using the extracted device tree ($DEVICETREE_PATH)"
          else
            echo "::notice::no device tree was published; build-devicetree will record not_run (see the ipsw step)"
          fi
          bash scripts/macos/build-macos.sh \
            --experiment "$EXPERIMENT_ID" \
            --stage "$STAGE" \
            --target "$PAYLOAD_TARGET" \
            --out "$BUILD_OUTPUT_DIR" \
            --unixnu vendor/UniXNU \
            --device vendor/UniXNU-qemu \
            ${kernel_args[@]+"${kernel_args[@]}"} \
            2>&1 | tee "$BUILD_LOG"
          finished=$(date -u +%s)
          echo "finished_at=$finished" >> "$GITHUB_OUTPUT"
          echo "build duration: $((finished - started))s"

      # The build log is evidence, and it is the evidence that matters most when
      # the build fails -- which is exactly when the staging step below is
      # skipped and nothing is uploaded.  Without this, a link failure is a
      # one-line "linker command failed with exit code 1" in the job log and the
      # actual linker diagnostic sits unread on a runner that is about to be
      # destroyed.  Measured on run 40066923763: the kernel reached its link
      # step for the first time and the reason was not recoverable.
      - name: Upload the build logs (always, success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-output/unixnu-out/*/logs/
            build-output/build.log
            macos-build.log
            ipsw-work/ipsw.log
          retention-days: 30
          if-no-files-found: warn

      # PRD 12: the published kernelcache is Apple material.  It is removed
      # unconditionally -- `always()`, so a failed or cancelled build leaves
      # nothing behind either -- because "temporary" that only applies on
      # success is a cache nobody audits.
      #
      # This step sits AFTER the build, and that ordering is the whole point:
      # an `if: always()` step still runs at its position in the sequence, so
      # placing it next to the acquisition would delete the kernelcache before
      # the build that needs it.  The first draft did exactly that.
      - name: Remove the extracted firmware material
        if: always()
        run: |
          set -euo pipefail
          if [ -d ipsw-work ]; then
            du -sh ipsw-work 2>/dev/null || true
            rm -rf ipsw-work
            echo "removed ipsw-work/ (Apple firmware material, PRD 12)"
          fi
          if [ -e ipsw-work ]; then
            echo "::error::ipsw-work/ could not be removed; Apple firmware material would survive the job"
            exit 1
          fi

      # PRD 8.2 step 4 / 8.3: stage ONLY allowlisted roles, hash everything, and
      # build the machine-readable artifact-manifest.json (PRD 8.1).  Default
      # deny: an unrecognised file is excluded and recorded, never uploaded.
      - name: Stage allowlisted artifacts and build artifact-manifest.json
        id: stage
        env:
          BUILD_OUTPUT_DIR: build-output
          STAGE_DIR: staged
          BUILD_LOG: macos-build.log
          REPORT_DIR: build
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          # The commits the LOCK pinned and the acquisition step fetched, not the
          # ones typed into the dispatch form: the manifest attests to what was
          # built (PRD 8.1).  The inputs stay the fallback for a run whose
          # acquisition step produced no outputs -- which is a failed run.
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          UNIXNU_REPO: ${{ steps.sources.outputs.unixnu_repo || '' }}
          DEVICE_REPO: ${{ steps.sources.outputs.device_repo || '' }}
          LOCK_SHA256: ${{ steps.sources.outputs.lock_sha256 || '' }}
          LOCK_FROZEN: ${{ steps.sources.outputs.lock_frozen || '' }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode_version }}
          CLANG_VERSION: ${{ steps.toolchain.outputs.clang_version }}
          PYTHON_VERSION: ${{ steps.toolchain.outputs.python_version }}
          BUILD_STARTED_AT: ${{ steps.build.outputs.started_at }}
          BUILD_FINISHED_AT: ${{ steps.build.outputs.finished_at }}
          MAX_FILE_BYTES: '2147483648'
        run: |
          python3 - <<'PY'
          """Hash build outputs, stage allowlisted roles, write artifact-manifest.json.

          PRD 8.1 (artifact contract) and 8.2 step 4 (never upload full system
          images or private data).  Roles come from build-output/artifact-roles.json
          when the build script emits it, otherwise from a conservative name table;
          anything unmatched is excluded (default deny) and recorded in the
          manifest's "excluded" list.
          """
          import fnmatch
          import hashlib
          import json
          import os
          import shutil
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          OUT = Path(os.environ.get("BUILD_OUTPUT_DIR", "build-output"))
          STAGE = Path(os.environ.get("STAGE_DIR", "staged"))
          BUILD_LOG = Path(os.environ.get("BUILD_LOG", "macos-build.log"))
          REPORT = Path(os.environ.get("REPORT_DIR", "build"))
          TARGET = (os.environ.get("PAYLOAD_TARGET", "tcg") or "tcg").strip().lower()
          MAX_FILE_BYTES = int(os.environ.get("MAX_FILE_BYTES", "2147483648"))

          ALLOWED_ROLES = ("firmware", "bootloader", "kernel", "devicetree", "auxiliary")
          DENIED_ROLES = ("system-image", "private-data")
          GENERATED = ("artifact-manifest.json", "build-report.json")
          PRIVATE_PATTERNS = (
              "*.ipsw", "*.dmg", "*.img", "*.qcow2", "*.qcow", "*.raw", "*.sparseimage",
              "*.vmdk", "*.vhd", "*.vdi", "*.iso", "*.p12", "*.pfx", "*.mobileprovision",
              "*.pem", "*.key", "*.cer", "*.mobileconfig", "*.trustcache", "*.seed",
          )
          METADATA_SUFFIXES = {".json", ".txt", ".log", ".md", ".cfg", ".toml", ".csv", ".plist"}
          ROLE_RULES = (
              ("kernel", ("kernelcache", "kernel-cache", "kernel_cache", "kernel")),
              ("devicetree", ("devicetree", "device-tree", "device_tree", ".dtb")),
              ("firmware", ("firmware", "uefi", "bootrom", "bios")),
              ("bootloader", ("bootloader", "boot-loader", "unixnu", "darwinboot", "boot")),
          )

          problems = []
          warnings = []

          def sha256_of(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          #: The one buffer size this step ever allocates for a copy.  The staging
          #: path can be handed a multi-GB kernel or disk image -- MAX_FILE_BYTES
          #: is 2 GiB -- so a staged copy is streamed in chunks and never held
          #: whole, whatever the file turns out to be.
          COPY_CHUNK_BYTES = 1024 * 1024

          class _HashingWriter:
              """A binary writer that digests what it is handed, as it is handed it.

              ``shutil.copyfileobj`` only ever calls ``write``, so this is the
              whole file interface a streaming copy needs.  It exists so the
              digest of a staged copy comes from the bytes that were written,
              rather than from opening the copy again and reading it back: the
              staged file is evidence, and reading it a second time to check it
              is the whole file twice on a path that can carry a kernel image.
              """

              def __init__(self, handle):
                  self._handle = handle
                  self.digest = hashlib.sha256()
                  self.written = 0

              def write(self, chunk):
                  self.digest.update(chunk)
                  self.written += len(chunk)
                  return self._handle.write(chunk)

              def __enter__(self):
                  return self

              def __exit__(self, *exc_info):
                  self._handle.close()
                  return False

          def copy_and_hash(src, dst):
              """Stream ``src`` into ``dst``; return ``(sha256, bytes written)``.

              The chunk length is passed positionally on purpose: the parameter
              has been renamed between Python versions, and a runner's python3
              is not this repository's to pin.
              """
              with src.open("rb") as reader, _HashingWriter(dst.open("wb")) as writer:
                  shutil.copyfileobj(reader, writer, COPY_CHUNK_BYTES)
              return writer.digest.hexdigest(), writer.written

          def role_from_table(rel):
              low = rel.lower()
              for role, tokens in ROLE_RULES:
                  if any(token in low for token in tokens):
                      return role
              if Path(rel).suffix.lower() in METADATA_SUFFIXES:
                  return "auxiliary"
              return None

          roles_map = {}
          roles_file = OUT / "artifact-roles.json"
          if roles_file.is_file():
              try:
                  loaded = json.loads(roles_file.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      for key, value in loaded.items():
                          if isinstance(value, str) and value in ALLOWED_ROLES + DENIED_ROLES:
                              roles_map[key.replace("\\", "/")] = value
                  warnings.append("using build-output/artifact-roles.json for role assignment")
              except (OSError, json.JSONDecodeError) as exc:
                  warnings.append(f"artifact-roles.json unreadable ({exc.__class__.__name__}); using the name table")

          if not OUT.is_dir():
              print(f"::error::build output directory '{OUT.as_posix()}' does not exist")
              sys.exit(1)

          entries = []
          excluded = []
          for path in sorted(OUT.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(OUT).as_posix()
              if rel in GENERATED or rel == "artifact-roles.json":
                  continue
              size = path.stat().st_size
              role = roles_map.get(rel) or role_from_table(rel)
              reason = None
              if role in DENIED_ROLES:
                  reason = f"role '{role}' is denied for upload (PRD 8.2 step 4)"
              elif role is None:
                  reason = "role is not on the allowlist (default deny)"
              elif role not in ALLOWED_ROLES:
                  reason = f"role '{role}' is not allowlisted"
              if reason is None and any(fnmatch.fnmatch(rel.lower(), pat) for pat in PRIVATE_PATTERNS):
                  reason = "filename matches a system-image/private-data pattern"
              if reason is None and "local-private" in rel.lower():
                  reason = "path is under local-private/ (PRD 12)"
              if reason is None and size == 0:
                  reason = "zero-size file"
              if reason is None and size > MAX_FILE_BYTES:
                  reason = f"file larger than {MAX_FILE_BYTES} bytes (PRD 8.4 prefers small artifacts)"
              if reason is not None:
                  excluded.append({"path": rel, "role": role, "size_bytes": size, "reason": reason})
                  continue
              entries.append({
                  "name": rel,
                  "path": rel,
                  "role": role,
                  "sha256": sha256_of(path),
                  "size_bytes": size,
                  "arch": None,
              })

          # The build log is evidence rather than a build product: include it
          # explicitly under a stable relative name so the manifest never carries
          # an absolute host path.
          log_name = BUILD_LOG.name or "macos-build.log"
          if log_name not in {entry["name"] for entry in entries} and BUILD_LOG.is_file() and BUILD_LOG.stat().st_size > 0:
              entries.append({
                  "name": log_name,
                  "path": log_name,
                  "role": "auxiliary",
                  "sha256": sha256_of(BUILD_LOG),
                  "size_bytes": BUILD_LOG.stat().st_size,
                  "arch": None,
              })
          elif BUILD_LOG.is_file() and BUILD_LOG.stat().st_size > 0:
              warnings.append(f"a build-output file is already named '{log_name}'; the build log was not staged twice")
          else:
              warnings.append("build log is missing or empty; the upload will not contain build evidence")

          # A build that produced no firmware/bootloader/kernel/devicetree is a
          # failed build even if it left logs: evidence alone must never pass
          # (PRD 7.4).
          if not any(entry["role"] != "auxiliary" for entry in entries):
              print("::error::no allowlisted payload artifact was produced, only evidence/log files: nothing to deliver (PRD 7.4, 8.2 step 4)")
              print(f"::error::excluded files: {[item['path'] for item in excluded]}")
              REPORT.mkdir(parents=True, exist_ok=True)
              (REPORT / "staging-report.json").write_text(
                  json.dumps({"status": "fail", "excluded": excluded, "problems": problems, "warnings": warnings}, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              sys.exit(1)

          STAGE.mkdir(parents=True, exist_ok=True)
          for entry in entries:
              src = BUILD_LOG if entry["name"] == log_name else OUT / entry["path"]
              dst = STAGE / entry["path"]
              dst.parent.mkdir(parents=True, exist_ok=True)
              # Copied in chunks and hashed from the bytes as they were written.
              # ``dst.write_bytes(src.read_bytes())`` held the whole file in
              # memory to move it and then re-read the copy to hash it, which is
              # the file three times over -- and this step runs on every build.
              staged_sha256, staged_bytes = copy_and_hash(src, dst)
              if staged_sha256 != entry["sha256"] or staged_bytes != entry["size_bytes"]:
                  problems.append(f"staged copy of {entry['path']} does not match its hash/size")
              if staged_bytes == 0:
                  problems.append(f"staged copy of {entry['path']} is zero bytes")

          started = os.environ.get("BUILD_STARTED_AT", "")
          finished = os.environ.get("BUILD_FINISHED_AT", "")
          duration = int(finished) - int(started) if started.isdigit() and finished.isdigit() else None

          def iso(epoch):
              return datetime.fromtimestamp(int(epoch), tz=timezone.utc).isoformat() if epoch.isdigit() else None

          toolchain = {
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "xcode": os.environ.get("XCODE_VERSION", ""),
              "clang": os.environ.get("CLANG_VERSION", ""),
              "python": os.environ.get("PYTHON_VERSION", ""),
          }
          manifest = {
              "schema_version": 1,
              "run_id": os.environ.get("RUN_ID", ""),
              "run_attempt": os.environ.get("RUN_ATTEMPT", ""),
              "experiment_id": os.environ.get("EXPERIMENT_ID", ""),
              "stage": os.environ.get("STAGE", ""),
              "target": TARGET,
              "accel": TARGET,
              "unixnu_commit": os.environ.get("UNIXNU_COMMIT", ""),
              "device_repo_commit": os.environ.get("DEVICE_COMMIT", ""),
              "unixnu_repo": os.environ.get("UNIXNU_REPO", "") or None,
              "device_repo": os.environ.get("DEVICE_REPO", "") or None,
              # The digest of the lock these commits were READ FROM, so a reader
              # can tell whether the lock moved after the run (PRD 8.1).
              "sources_lock_sha256": os.environ.get("LOCK_SHA256", "") or None,
              # Whether that lock declared itself frozen.  Recorded rather than
              # derived: an unfrozen build is legitimate (build-macos.sh treats
              # the pins as the freeze candidates) but a reader must be able to
              # tell the two apart without re-reading the lock at this commit.
              "sources_lock_frozen": os.environ.get("LOCK_FROZEN", "").strip().lower() == "true",
              "system_build": os.environ.get("SYSTEM_BUILD", "") or None,
              "repository": os.environ.get("REPO", ""),
              "ref": os.environ.get("REF", ""),
              "head_sha": os.environ.get("HEAD_SHA", ""),
              "toolchain": toolchain,
              "artifacts": entries,
              "excluded": excluded,
              "generated_by": "build-macos.yml",
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          (STAGE / "artifact-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report = {
              "schema_version": 1,
              "run_id": os.environ.get("RUN_ID", ""),
              "experiment_id": os.environ.get("EXPERIMENT_ID", ""),
              "stage": os.environ.get("STAGE", ""),
              "payload_target": TARGET,
              "started_at": iso(started),
              "finished_at": iso(finished),
              "duration_seconds": duration,
              "toolchain": toolchain,
              "artifact_count": len(entries),
              "artifact_bytes": sum(item["size_bytes"] for item in entries),
              "roles": {role: sum(1 for item in entries if item["role"] == role) for role in sorted({item["role"] for item in entries})},
              "excluded_count": len(excluded),
              "excluded": excluded,
              "problems": problems,
              "warnings": warnings,
              "status": "fail" if problems else "pass",
          }
          REPORT.mkdir(parents=True, exist_ok=True)
          (REPORT / "staging-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (STAGE / "build-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          print(f"staged {len(entries)} allowlisted file(s), {report['artifact_bytes']} bytes, roles={report['roles']}")
          print(f"excluded {len(excluded)} file(s) by default deny: {[item['path'] for item in excluded]}")
          print(f"manifest sha256: {hashlib.sha256((STAGE / 'artifact-manifest.json').read_bytes()).hexdigest()}")
          for warning in warnings:
              print(f"::warning::{warning}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Upload build artifact (allowlisted roles only, 30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.artifact_name }}
          path: staged/
          retention-days: 30
          if-no-files-found: error

      # The full staged artifact is ~356 MB, most of it EDK2 and XNU build
      # intermediates (the bootloader role alone is 32713 files).  Downloading it
      # from Azure measured at ~60 KB/s, which is over 90 minutes -- so the one
      # run that produced a real kernel was also the one whose output was
      # impractical to act on.
      #
      # This collects just the boot inputs: the linked kernel, the DarwinBoot
      # driver image, the device trees, the firmware volume, the per-part hash
      # record, and the three machine-readable manifests.  Everything here is
      # named by what record_artifact() in build-macos.sh records, so the set
      # cannot drift from what the build declares.
      - name: Collect the boot inputs into a small bundle
        env:
          STAGE_DIR: staged
          BUNDLE_DIR: boot-inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          stage = Path("staged")
          bundle = Path("boot-inputs")
          if not stage.is_dir():
              print("::error::no staged directory; the build produced nothing")
              sys.exit(1)
          # What a boot needs, as path fragments.  Ordered most-specific first.
          WANTED = (
              "kernel.macho",
              "darwinboot-efi/",
              "boot.json",
              ".dtb",
              "ipsw-work/devicetree",
              ".fd",
              "artifact-manifest.json",
              "build-report.json",
              "stage-result.json",
              "ipsw-summary.json",
          )
          kept, total = 0, 0
          for source in sorted(stage.rglob("*")):
              if not source.is_file():
                  continue
              relative = source.relative_to(stage).as_posix()
              if not any(fragment in relative for fragment in WANTED):
                  continue
              destination = bundle / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              kept += 1
              total += source.stat().st_size
          if not kept:
              print("::error::no boot inputs found in staged/")
              sys.exit(1)
          print(f"boot inputs: {kept} file(s), {total} bytes")
          for path in sorted(bundle.rglob("*")):
              if path.is_file():
                  print(f"  {path.relative_to(bundle).as_posix()} {path.stat().st_size}")
          PY

      - name: Upload the boot inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-inputs-${{ github.run_id }}
          path: boot-inputs/
          retention-days: 30
          if-no-files-found: error

      - name: Step summary
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.naming.outputs.artifact_name }}
          REPORT_DIR: build
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          STAGE: ${{ inputs.stage }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          # The pins the lock resolved, not the dispatch request: a summary that
          # quotes the request is evidence about a build that did not happen.
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          REQUESTED_UNIXNU_COMMIT: ${{ inputs.unixnu_commit }}
          REQUESTED_DEVICE_COMMIT: ${{ inputs.device_commit }}
        run: |
          python3 - <<'PY'
          """Write the GitHub step summary from build/staging-report.json (evidence, PRD 9.2)."""
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ.get("REPORT_DIR", "build")) / "staging-report.json"
          lines = [
              "### UniPad macOS build",
              "",
              f"- experiment: {os.environ.get('EXPERIMENT_ID', '')}",
              f"- stage: {os.environ.get('STAGE', '')} / payload target: {os.environ.get('PAYLOAD_TARGET', '')}",
              f"- unixnu: {os.environ.get('UNIXNU_COMMIT', '')}",
              f"- device repo: {os.environ.get('DEVICE_COMMIT', '')}",
              f"- artifact: `{os.environ.get('ARTIFACT_NAME', '')}` (retention 30 days)",
          ]
          # When the dispatch form asked for something other than the lock, say
          # so: the build used the lock, and a silent difference between the two
          # is the divergence this whole step exists to surface.
          requested = (
              os.environ.get("REQUESTED_UNIXNU_COMMIT", ""),
              os.environ.get("REQUESTED_DEVICE_COMMIT", ""),
          )
          used = (
              os.environ.get("UNIXNU_COMMIT", ""),
              os.environ.get("DEVICE_COMMIT", ""),
          )
          if any(a and a != b for a, b in zip(requested, used)):
              lines.append(
                  f"- WARNING: the dispatch inputs {requested[0]} / {requested[1]} differ from the "
                  f"pins {used[0]} / {used[1]} the lock resolved and this build used"
              )
          if report_path.is_file():
              data = json.loads(report_path.read_text(encoding="utf-8"))
              lines += [
                  f"- staged files: {data.get('artifact_count')} ({data.get('artifact_bytes')} bytes)",
                  f"- roles: {data.get('roles')}",
                  f"- build duration: {data.get('duration_seconds')}s",
                  f"- excluded by default deny: {data.get('excluded_count')}",
                  f"- status: {data.get('status')}",
              ]
          else:
              lines.append("- staging report unavailable: the build failed before staging, so no artifact was uploaded")

          # The source acquisition and the pin cross-check are evidence about
          # what was built, not products of it, so they are reported here
          # rather than staged.  What could NOT be proven on a Windows
          # code-stage host is listed verbatim: a reader of the summary must
          # not be able to mistake a Windows-side proof for a field proof.
          for name, label in (
              ("source-acquisition.json", "sources"),
              ("pin-crosscheck.json", "pin cross-check"),
          ):
              path = Path(os.environ.get("REPORT_DIR", "build")) / name
              if not path.is_file():
                  lines.append(f"- {label}: no report (the step did not run)")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              lines.append(f"- {label}: {data.get('status')}")
              for problem in data.get("problems") or []:
                  lines.append(f"  - problem: {problem}")
              for note in data.get("unverified") or []:
                  lines.append(f"  - unverified: {note}")
          text = "\n".join(lines) + "\n"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(text)
          print(text)
