# UniPad pipeline #2: build-macos -- PRD 8.2 step 2 ("build-macos: 按固定版本运行最小构建；只执行所需阶段")
# plus PRD 8.1 (macOS build input/output contract) and PRD 8.3 (pinned versions,
# TCG/HVF separation, concurrency dedupe, job timeout, artifact retention, cache keys).
#
# Inputs are validated against config/sources.lock.json BEFORE any paid macOS
# minute is spent: a mismatch fails the job (PRD 8.4 "fail fast").
#
# PRD 8.2 step 4 / PRD 12: this job uploads ONLY allowlisted roles
# (firmware / bootloader / kernel / devicetree / auxiliary).  Full system
# images, IPSW/DMG/raw disk payloads and private data are excluded by default
# deny; the manifest records every excluded file so the exclusion is auditable.
#
# PINNING NOTE (PRD 8.3): `macos-latest` is deliberately NOT assumed to keep a
# stable architecture or Xcode.  After M0 the runner image and Xcode/SDK must be
# pinned here (e.g. runs-on: macos-14 plus an explicit Xcode selection); the
# resolved versions are already recorded in artifact-manifest.json so a pinning
# change is visible in the artifact contract.  Even on an arm64 runner, HVF
# nesting is NOT assumed to exist: the build must stand alone.
#
# Cost note (PRD 8.4): the job timeout is also the per-run macOS budget ceiling.
# The source repository is public, so standard GitHub-hosted macOS minutes are
# free; the ceiling that actually binds is the 180 minutes set on the job below,
# and the chain that made 60 insufficient is the GPU addon's seven rings (two of
# them full Mesa cross-builds).  Each ring now logs its own elapsed seconds, so
# if the budget ever needs trimming again it is trimmed against a measurement.

name: build-macos

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Experiment/build identity, e.g. exp-2026-10-22-m2 (PRD 7.3). Also the concurrency dedupe key.'
        required: true
        type: string
      unixnu_commit:
        description: 'Pinned UniXNU commit (full or abbreviated sha) to build.'
        required: true
        type: string
      device_commit:
        description: 'Pinned device-repo (UniXNU-qemu) commit to build.'
        required: true
        type: string
      stage:
        description: 'Milestone/stage to build for, e.g. M2|M3|M4|M5... (PRD 6).'
        required: false
        default: 'M2'
        type: string
      system_build:
        description: 'System build identity, e.g. 21H161. Must be one of the pinned build_candidates when the lock is frozen.'
        required: false
        default: ''
        type: string
      payload_target:
        description: 'Payload target. tcg for the Intel Windows host; hvf only as a comparison experiment and never published as tcg.'
        required: false
        default: 'tcg'
        type: choice
        options:
          - tcg
          - hvf

# Least privilege: the build reads the repository and uploads an artifact.
# Release/issue permissions are not granted here (publish-artifacts owns that,
# narrowly, and only in its publish job).
permissions:
  contents: read

# PRD 8.3 "同一实验并发去重": one build per experiment id.  cancel-in-progress is
# false on purpose -- cancelling a paid macOS build would throw away minutes and
# evidence, so a duplicate run is queued instead.
concurrency:
  group: unipad-build-${{ inputs.experiment_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build-macos (${{ inputs.stage }}, target=${{ inputs.payload_target }})
    # TODO(M0, PRD 8.3): pin the runner image and Xcode/SDK after M0 verifies the
    # toolchain (e.g. runs-on: macos-14 with an explicit Xcode selection).  Do not
    # assume macos-latest keeps the same architecture; do not assume HVF nesting
    # exists on an arm64 runner.
    runs-on: macos-latest
    # 60 minutes held the kernel, the device tree, the payload and the Data
    # volume.  It does not hold the GPU addon chain, which the step below added:
    # seven rings, of which two are full Mesa cross-builds (host and iOS), one is
    # a cargo release build of the metal2vulkan bridge, and one compiles and
    # signs the plugin bundle.  Measured cost is not known yet -- every ring now
    # logs its own elapsed seconds into build-output/build-gpu-addon.log, so the
    # first run that reaches them replaces this estimate with a number.
    #
    # 180 is an estimate, not a measurement, and it is written as one.  A chain
    # that overruns the job budget fails at the job boundary, which names no
    # ring; a job that is sized generously and logs each ring can be corrected
    # from its own evidence.
    timeout-minutes: 180
    steps:
      # This repository declares NO submodules: there is no .gitmodules and
      # `git submodule status` is empty, so `submodules: recursive` fetches
      # nothing and reads as though the sources had been handled.  They have
      # not.  The pinned upstreams are placed under vendor/ by the
      # acquisition step below, at the commits recorded in
      # config/sources.lock.json.  They are deliberately NOT .gitmodules
      # entries: that would make every pin exist twice, once as a gitlink in
      # the index and once in the lock -- exactly the divergence this project
      # has already been bitten by (call-chain 7.4, standards R-1).
      #
      # Three of them, not two: UniXNU (the driver), UniXNU-qemu (the board)
      # and uefi-sheng (Mu-Silicium, the panic screen's font header).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record toolchain versions (feeds cache key and manifest)
        id: toolchain
        run: |
          set -euo pipefail
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          xcode="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
          clang="$(clang --version 2>/dev/null | head -n 1 || true)"
          py="$(python3 --version 2>&1 || true)"
          {
            echo "runner_os=$os"
            echo "runner_arch=$arch"
            echo "xcode_version=${xcode:-unknown}"
            echo "clang_version=${clang:-unknown}"
            echo "python_version=${py:-unknown}"
          } >> "$GITHUB_OUTPUT"
          echo "toolchain: os=$os arch=$arch xcode=${xcode:-unknown} clang=${clang:-unknown} python=${py:-unknown}"

      # PRD 8.1/8.3: validate the dispatch inputs against the pinned source lock
      # before spending macOS minutes.  A frozen lock that disagrees with the
      # requested commits is a hard failure; an unfrozen lock is reported loudly.
      - name: Validate inputs against sources.lock.json
        id: inputs
        env:
          LOCK_PATH: config/sources.lock.json
          REPORT_DIR: build
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          UNIXNU_COMMIT: ${{ inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ inputs.device_commit }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
        run: |
          mkdir -p build
          python3 - <<'PY'
          """Validate build inputs against config/sources.lock.json (PRD 8.1 inputs).

          Writes build/input-validation.json.  Exit 1 on any mismatch so the job
          fails before paid macOS minutes are consumed (PRD 8.4).
          """
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          LOCK = Path(os.environ.get("LOCK_PATH", "config/sources.lock.json"))
          OUT_DIR = Path(os.environ.get("REPORT_DIR", "build"))
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          MILESTONES = (
              "M0", "M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8", "M9",
              "M9a", "M9b", "M10", "M10a", "M11", "M12", "M13", "M14", "M15",
          )
          EXP_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")
          SHA_RE = re.compile(r"^[0-9a-fA-F]{7,40}$")
          BUILD_RE = re.compile(r"^[0-9A-Za-z][0-9A-Za-z.]{0,31}$")

          experiment_id = os.environ.get("EXPERIMENT_ID", "").strip()
          unixnu_commit = os.environ.get("UNIXNU_COMMIT", "").strip()
          device_commit = os.environ.get("DEVICE_COMMIT", "").strip()
          stage = os.environ.get("STAGE", "").strip()
          system_build = os.environ.get("SYSTEM_BUILD", "").strip()
          payload_target = os.environ.get("PAYLOAD_TARGET", "tcg").strip().lower()

          problems = []
          warnings = []
          if not EXP_RE.match(experiment_id):
              problems.append("experiment_id must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ (it is the concurrency key and artifact name)")
          if not SHA_RE.match(unixnu_commit):
              problems.append("unixnu_commit is not a git sha")
          if not SHA_RE.match(device_commit):
              problems.append("device_commit is not a git sha")
          if stage not in MILESTONES:
              problems.append(f"stage must be one of {','.join(MILESTONES)} (got '{stage}')")
          if payload_target not in ("tcg", "hvf"):
              problems.append("payload_target must be tcg or hvf")
          if payload_target == "hvf":
              warnings.append("payload_target=hvf: comparison build only. HVF payloads must never be fetched to the Intel Windows host or published as tcg (PRD 8.3).")

          lock = {}
          lock_sha = None
          frozen = False
          lock_loaded = False
          try:
              raw = LOCK.read_bytes()
              lock_sha = hashlib.sha256(raw).hexdigest()
              parsed = json.loads(raw.decode("utf-8"))
              if not isinstance(parsed, dict):
                  raise ValueError("lock root is not an object")
              lock = parsed
              lock_loaded = True
              frozen = bool(lock.get("frozen", False))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
              problems.append(f"cannot read config/sources.lock.json: {exc.__class__.__name__}")

          candidates = []
          if isinstance(lock.get("system_identity"), dict):
              candidates = lock["system_identity"].get("build_candidates") or []
          if system_build:
              if not BUILD_RE.match(system_build):
                  problems.append("system_build must match ^[0-9A-Za-z][0-9A-Za-z.]{0,31}$")
              if candidates and system_build not in candidates:
                  problems.append(f"system_build '{system_build}' is not one of the pinned build_candidates {candidates}")
          else:
              warnings.append("system_build is empty; the manifest records it as null (PRD 8.1 platform info)")

          if lock_loaded:
              if not isinstance(lock.get("unixnu"), dict) or not isinstance(lock.get("device_repo"), dict):
                  problems.append("sources.lock.json must contain 'unixnu' and 'device_repo' objects (PRD 8.1 inputs)")
              lock_unixnu = (lock.get("unixnu") or {}).get("commit") if isinstance(lock.get("unixnu"), dict) else None
              lock_device = (lock.get("device_repo") or {}).get("commit") if isinstance(lock.get("device_repo"), dict) else None
              if frozen:
                  if lock_unixnu and lock_unixnu.lower() != unixnu_commit.lower():
                      problems.append(f"unixnu_commit '{unixnu_commit}' != sources.lock.json unixnu.commit '{lock_unixnu}'")
                  if lock_device and lock_device.lower() != device_commit.lower():
                      problems.append(f"device_commit '{device_commit}' != sources.lock.json device_repo.commit '{lock_device}'")
                  if not lock_unixnu or not lock_device:
                      problems.append("sources.lock.json is frozen but a repository commit is null")
              else:
                  warnings.append("sources.lock.json is NOT FROZEN: the dispatch inputs are the freeze candidates and are recorded verbatim in artifact-manifest.json")
          elif not any("sources.lock.json" in problem for problem in problems):
              problems.append("sources.lock.json is empty or has no repository pins (PRD 8.1 inputs)")

          head = ""
          try:
              head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=False).stdout.strip()
          except OSError:
              head = ""

          report = {
              "schema_version": 1,
              "check": "build-inputs",
              "experiment_id": experiment_id,
              "stage": stage,
              "payload_target": payload_target,
              "unixnu_commit": unixnu_commit,
              "device_commit": device_commit,
              "system_build": system_build or None,
              "lock": {
                  "path": LOCK.as_posix(),
                  "sha256": lock_sha,
                  "frozen": frozen,
                  "build_candidates": candidates,
              },
              "checked_out_head": head or None,
              "problems": problems,
              "warnings": warnings,
              "status": "fail" if problems else "pass",
          }
          (OUT_DIR / "input-validation.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for warning in warnings:
              print(f"::warning::{warning}")
          for problem in problems:
              print(f"::error::{problem}")
          print(f"input validation status: {report['status']}")
          sys.exit(1 if problems else 0)
          PY

      # PRD 8.3: the cache key carries the source commits, the stage, the system
      # build, the lock hash, the build-script hash and the toolchain versions.
      # No restore-keys: a stale toolchain/bootstrap cache must never be able to
      # make an old input set "succeed" (PRD 11, 构建不可复现), and a signing
      # key/policy change is part of the lock hash.
      - name: 'Restore build toolchain cache (key: source + config + tool versions)'
        uses: actions/cache@v4
        with:
          path: ~/.cache/unipad-macos-build
          key: unipad-macos-build-${{ runner.os }}-${{ steps.toolchain.outputs.xcode_version }}-${{ inputs.unixnu_commit }}-${{ inputs.device_commit }}-${{ inputs.stage }}-${{ inputs.system_build }}-${{ hashFiles('config/sources.lock.json', 'scripts/macos/**') }}

      - name: Compute artifact name (sanitized experiment id)
        id: naming
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$EXPERIMENT_ID" | tr -c 'A-Za-z0-9._-' '_')"
          name="unipad-build-${safe}-${RUN_ID}"
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
          echo "artifact name: $name"

      # PRD 8.1 inputs: obtain the sources BEFORE the build, and prove they are
      # the ones the lock promised.  Three phases, all inside one step so that
      # "read the lock", "fetch" and "compare" cannot drift apart:
      #
      #   1. acquire    -- the three checkouts the upstream driver cannot fetch
      #                    for itself (UniXNU, UniXNU-qemu and the Mu-Silicium
      #                    uefi-sheng), at the commits in sources.lock.json.
      #   2. assemble   -- the driver fetches everything else: the module
      #                    submodules (DarwinBoot, the Native* drivers, the
      #                    kits) and the feeds.toml references (xnu,
      #                    libplatform, libdispatch, AvailabilityVersions,
      #                    edk2, libpthread, corecrypto-2023, IOStorageFamily,
      #                    dyld).  The workflow does not hand-roll this: a
      #                    second implementation of the fetcher is the exact
      #                    divergence class this project keeps hitting.
      #   3. cross-check-- `unixnu status` and the driver's own unixnu.lock are
      #                    compared with sources.lock.json, and a disagreement
      #                    fails the job.  A build that silently compiles
      #                    different bytes than the lock promised is the
      #                    failure this prevents.
      - name: Acquire and verify the pinned sources (vendor/ + unixnu fetch/tree + pin cross-check)
        id: sources
        env:
          LOCK_PATH: config/sources.lock.json
          VENDOR_DIR: vendor
          REPORT_DIR: build
          UNIXNU_DRIVER: vendor/UniXNU/unixnu
          DEVICE_REPO: vendor/UniXNU-qemu
          # ONE out root, shared with the build step below.  The driver keeps
          # its feed clones under <out>/feeds and assembles the tree under
          # <out>/<board>/tree (config.py:83-84, tree.py:41), and
          # scripts/macos/build-macos.sh derives its own UNIXNU_OUT as
          # "$OUT_DIR/unixnu-out" and then proves every feed clone is already
          # on disk at the locked commit by scanning "$FEEDS_DIR"/*.  If the
          # two halves name different roots, this step populates one directory
          # while prepare-sources scans another, finds nothing, and refuses
          # with artifact_missing -- the build never reaches a build stage at
          # all, which is the defect this step exists to remove.
          OUT_ROOT: build-output/unixnu-out
          GIT_FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Obtain the pinned sources and prove they are the locked ones (PRD 8.1).

          Every commit comes from config/sources.lock.json and from nowhere
          else.  A second place that knows a sha is the divergence class this
          project keeps hitting (call-chain 7.4: 18 helper names across 5
          scripts, 11 diverged; standards R-1: three port validators, three
          ranges), so nothing here is hardcoded and nothing is re-derived by
          parsing feeds.toml: `unixnu status` already prints every git source
          as `git pinned <sha12>` or `NOT LOCKED` (scripts/unixnu/cli.py
          cmd_status) and `unixnu fetch` writes the device repository's
          unixnu.lock, so both are the driver's own output rather than a
          second implementation of it.

          Only the repositories the driver cannot clone are cloned here:
          scripts/unixnu/config.py Context.__init__ raises "no device
          repository" without -D, and cli.py has no subcommand that clones the
          device repository, its own root, or the Mu-Silicium checkout -- the
          driver only ever *reads* --uefi (cli.py:24), it never fetches it.

          HONESTY: a real clone from github.com cannot be exercised on the
          Windows code-stage host (github.com over the git protocol is blocked;
          only api.github.com answers), and the driver's kernel step needs
          xcodebuild.  What is proven here is the pin resolution, the argument
          construction, the refusals and the manifest shape.  The network half
          is recorded as UNVERIFIED and can only be proven on a macOS runner.
          """
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          LOCK_PATH = os.environ.get("LOCK_PATH", "config/sources.lock.json")
          VENDOR_DIR = os.environ.get("VENDOR_DIR", "vendor")
          REPORT_DIR = os.environ.get("REPORT_DIR", "build")
          DRIVER = os.environ.get("UNIXNU_DRIVER", "vendor/UniXNU/unixnu")
          DEVICE_REPO = os.environ.get("DEVICE_REPO", "vendor/UniXNU-qemu")
          OUT_ROOT = os.environ.get("OUT_ROOT", "build-output/unixnu-out")
          REPO_ROOT = os.environ.get("REPO_ROOT", ".")
          PRIVATE_COMPONENT = "local-private"

          # (key in sources.lock.json, directory under vendor/)
          #
          # THREE, not two, and the third is not a feed.  uefi-sheng is the
          # Mu-Silicium checkout the payload step's panic screen takes exactly
          # one file from: patch-xnu-entry-probe.py:183 compiles
          # xnu-panic-screen.c with -I(UNIXNU_UEFI or <tree>/uefi-sheng)/Silicon/
          # Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib, and the
          # assembled tree never contains uefi-sheng/ (tree.py:assemble creates
          # only drivers/ kits/ patches/ refer/ build/ .cache/ package/
          # scripts/).  Measured on runs 40094234507 and 40096928333: without
          # this checkout the driver dies in clang with "fatal error: 'Font.h'
          # file not found" and build-payload records failed.  It is pinned
          # here as its own lock key rather than in `feeds` because the driver's
          # cross-check would then demand it in the device repository's
          # unixnu.lock, where no feeds.toml will ever name it.
          ACQUISITIONS = (
              ("unixnu", "UniXNU"),
              ("device_repo", "UniXNU-qemu"),
              ("uefi_sheng", "uefi-sheng"),
          )

          # The module kinds scripts/unixnu/config.py KINDS knows about; the
          # status header lines ("device", "output", "config") are not among
          # them, which is what keeps them from being read as modules.
          KINDS = ("driver", "kit", "patch", "script", "package", "refer")
          STATUS_LINE = re.compile(
              r"^(?P<kind>\S+)\s+(?P<name>\S+)\s+(?P<origin>\S+)(?:\s+(?P<extra>.*))?$"
          )
          SHA_RE = re.compile(r"^[0-9a-fA-F]{7,40}$")
          URL_RE = re.compile(r"^\s*url\s*=\s*(\S+)", re.MULTILINE)

          UNVERIFIED = (
              "a real clone from github.com cannot be exercised on the Windows code-stage host: "
              "github.com over the git protocol is blocked and only api.github.com answers, so the "
              "network half of the acquire phase -- and of the driver's own fetch -- is UNVERIFIED "
              "until a macOS runner performs it",
              "the upstream driver's kernel step builds with the Xcode iphoneos SDK, so no part of "
              "the build itself is claimed by this step",
          )


          class SourcePinError(Exception):
              """A refusal to obtain or trust the sources.

              The lock is unreadable, a pin is not a pin, what was fetched is
              not what the lock promised, or the fetched material is not
              ignorable.  Every one of them fails the job rather than
              defaulting to something plausible.
              """


          def _announce(problems, message):
              print(f"::error::{message}")
              problems.append(message)


          def _warn(warnings, message):
              print(f"::warning::{message}")
              warnings.append(message)


          def _refuse_private(path):
              """PRD 12: nothing under local-private/ is fetched, built or published."""
              resolved = Path(path).resolve()
              for part in resolved.parts:
                  if part.lower() == PRIVATE_COMPONENT:
                      raise SourcePinError(
                          f"{Path(path).as_posix()} is under {PRIVATE_COMPONENT}/ (PRD 12): "
                          "private material is never fetched or built here"
                      )


          def _write_report(name, payload):
              directory = Path(REPORT_DIR)
              directory.mkdir(parents=True, exist_ok=True)
              path = directory / name
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(f"report: {path.as_posix()}")


          def _publish_outputs(pins, lock_sha, frozen):
              """Publish the commits the LOCK pinned as this step's outputs.

              The dispatch inputs are what a human asked for; the lock is what
              this step fetched and what the driver assembled.  Downstream steps
              -- the manifest, the summary, the cache key -- must quote the
              second, or a manifest can attest to a commit that was never built
              while the build quietly used another one.  That is the same
              silent-divergence class the cross-check exists to catch, one layer
              further down.

              ``frozen`` is published for the same reason.  The lock's sha256
              lets a reader re-read the lock, but only if they still have this
              repository at this commit; the manifest should say outright
              whether the build ran against a frozen baseline rather than
              making every consumer derive it.  An unfrozen build is a
              legitimate one -- build-macos.sh treats the pins as the freeze
              candidates -- so this is a fact to record, not a failure to
              propagate.
              """
              path = os.environ.get("GITHUB_OUTPUT")
              if not path:
                  return
              lines = [
                  f"unixnu_commit={pins['unixnu']['commit']}",
                  f"device_commit={pins['device_repo']['commit']}",
                  f"unixnu_repo={pins['unixnu']['repo']}",
                  f"device_repo={pins['device_repo']['repo']}",
                  # The third checkout, for the same reason the other two are:
                  # the build step must hand the driver the pin the lock
                  # resolved, and a manifest that attests to a commit nobody
                  # fetched is the divergence this step exists to prevent.
                  f"uefi_sheng_commit={pins['uefi_sheng']['commit']}",
                  f"uefi_sheng_repo={pins['uefi_sheng']['repo']}",
                  f"lock_sha256={lock_sha}",
                  f"lock_frozen={'true' if frozen else 'false'}",
              ]
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
              print(f"outputs: {path}")


          def load_pins(lock_path=None):
              """(pins, feeds, frozen, sha256) read from the source lock.

              A missing, empty or malformed pin is a refusal.  It is never
              coerced to an empty string: a checkout made from "" is a
              checkout of whatever HEAD happened to be, which is precisely the
              silent divergence this step exists to prevent.
              """
              path = Path(LOCK_PATH if lock_path is None else lock_path)
              try:
                  raw = path.read_bytes()
              except OSError as exc:
                  raise SourcePinError(
                      f"cannot read {path.as_posix()}: {exc.__class__.__name__}"
                  ) from None
              try:
                  lock = json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise SourcePinError(
                      f"{path.as_posix()} is not valid JSON: {exc.__class__.__name__}"
                  ) from None
              if not isinstance(lock, dict):
                  raise SourcePinError(f"{path.as_posix()}: the root is not an object")
              pins = {}
              for key, directory in ACQUISITIONS:
                  section = lock.get(key)
                  if not isinstance(section, dict):
                      raise SourcePinError(
                          f"{path.as_posix()}: '{key}' is missing or is not an object; it pins {directory}"
                      )
                  for field in ("repo", "commit"):
                      value = section.get(field)
                      if not isinstance(value, str) or not value.strip():
                          raise SourcePinError(
                              f"{path.as_posix()}: {key}.{field} is {value!r}; an empty pin is not a pin "
                              "(it would fetch whatever HEAD is)"
                          )
                  commit = section["commit"].strip()
                  if not SHA_RE.match(commit):
                      raise SourcePinError(f"{path.as_posix()}: {key}.commit {commit!r} is not a git sha")
                  pins[key] = {
                      "repo": section["repo"].strip(),
                      "commit": commit,
                      "directory": directory,
                  }
              feeds = lock.get("feeds")
              if feeds is None:
                  feeds = []
              if not isinstance(feeds, list):
                  raise SourcePinError(f"{path.as_posix()}: 'feeds' is not an array")
              return pins, feeds, bool(lock.get("frozen")), hashlib.sha256(raw).hexdigest()


          def _run_git(args, *, check=True):
              """Run git, echoing it the way scripts/unixnu/util.py run() does."""
              command = ["git", *[str(part) for part in args]]
              print("+ " + " ".join(command), flush=True)
              result = subprocess.run(command, capture_output=True, text=True)
              if check and result.returncode:
                  raise SourcePinError(
                      f"git failed ({result.returncode}): {' '.join(command)}\n{result.stderr.strip()}"
                  )
              return result


          def _head_of(directory):
              directory = Path(directory)
              if not directory.joinpath(".git").exists():
                  return None
              result = _run_git(["-C", directory, "rev-parse", "HEAD"], check=False)
              if result.returncode or not result.stdout.strip():
                  return None
              return result.stdout.strip()


          def acquire_one(url, commit, destination, *, depth=None):
              """Place one pinned checkout at destination and prove it is at that commit.

              The shape mirrors scripts/unixnu/feeds.py fetch(): init, point the
              remote, fetch the wanted commit BY SHA, detach onto FETCH_HEAD.
              Never a branch name -- a branch is a moving target and the lock
              pins a commit.
              """
              url, commit = str(url or "").strip(), str(commit or "").strip()
              if not url:
                  raise SourcePinError("no repository URL: refusing to fetch from an empty remote")
              if not SHA_RE.match(commit):
                  raise SourcePinError(
                      f"{commit!r} is not a git sha: refusing to fetch it (an empty ref is not a pin)"
                  )
              if depth is None:
                  depth = int(os.environ.get("GIT_FETCH_DEPTH", "1"))
              destination = Path(destination)
              head = _head_of(destination)
              if head is not None and head.lower() == commit.lower():
                  return {"status": "present", "head": head, "fetched": False}
              destination.mkdir(parents=True, exist_ok=True)
              _run_git(["-C", destination, "init", "-q"])
              probe = _run_git(["-C", destination, "remote", "get-url", "origin"], check=False)
              if probe.returncode == 0:
                  _run_git(["-C", destination, "remote", "set-url", "origin", url])
              else:
                  _run_git(["-C", destination, "remote", "add", "origin", url])
              _run_git(["-C", destination, "fetch", "-q", "--depth", str(depth), "origin", commit])
              _run_git(["-C", destination, "checkout", "-q", "--detach", "FETCH_HEAD"])
              head = _head_of(destination)
              if head is None:
                  raise SourcePinError(
                      f"{destination.as_posix()}: no HEAD after checkout; the acquisition produced no checkout"
                  )
              if head.lower() != commit.lower():
                  raise SourcePinError(
                      f"{destination.as_posix()}: the lock pins {commit} but the checkout is at {head}; "
                      "refusing to build bytes the lock did not promise"
                  )
              return {"status": "acquired", "head": head, "fetched": True}


          def ensure_vendor_ignored(repo_root=None, vendor=None, locked_urls=()):
              """vendor/ is fetched material: it must never be committable.

              The rule goes to .git/info/exclude, which is local to the
              checkout and never committed, so the ignore rule cannot itself
              become a second source of truth that diverges between clones.
              A tracked file under vendor/, or a .gitmodules entry pointing at
              a repository the lock already pins, is a refusal: either one
              makes the pin exist twice.
              """
              root = Path(REPO_ROOT if repo_root is None else repo_root)
              vendor = VENDOR_DIR if vendor is None else vendor
              tracked = _run_git(["-C", root, "ls-files", "--", vendor], check=False)
              if tracked.returncode == 0 and tracked.stdout.strip():
                  names = ", ".join(sorted(tracked.stdout.split())[:5])
                  raise SourcePinError(
                      f"{vendor}/ has tracked files ({names}...): fetched material must not be committed"
                  )
              modules = root / ".gitmodules"
              if modules.is_file():
                  try:
                      text = modules.read_text(encoding="utf-8", errors="replace")
                  except OSError:
                      text = ""
                  for url in URL_RE.findall(text):
                      if url in set(locked_urls):
                          raise SourcePinError(
                              f".gitmodules points at {url}, which the source lock already pins: the pin "
                              "would exist twice, once as a gitlink in the index and once in the lock. "
                              "vendor/ is the single place the pins live."
                          )
              # The rule is "/vendor" without a trailing slash on purpose: a
              # pattern ending in "/" only matches directories, and git answers
              # check-ignore 1 for a bare pathname that it has not been told is
              # a directory, so "/vendor/" would never satisfy the probe below.
              # Both the probe and the re-verification ask about the bare name.
              #
              # It is anchored, so it must be spelled *relative to the root*:
              # str() on a Windows absolute path keeps the backslashes and the
              # drive letter, which would write a rule matching nothing and then
              # fail the re-verification below on a caller that passes one.
              # relpath also normalises the separators, which str() does not.
              ignored = _run_git(["-C", root, "check-ignore", "-q", vendor], check=False)
              if ignored.returncode == 1:
                  exclude = root / ".git" / "info" / "exclude"
                  exclude.parent.mkdir(parents=True, exist_ok=True)
                  existing = exclude.read_text(encoding="utf-8", errors="replace") if exclude.is_file() else ""
                  try:
                      relative = Path(os.path.relpath(root / vendor, root)).as_posix()
                  except ValueError:  # a different drive: relpath cannot help
                      relative = Path(vendor).as_posix()
                  rule = "/" + relative.strip("/")
                  if rule not in existing.splitlines():
                      with exclude.open("a", encoding="utf-8") as handle:
                          if existing and not existing.endswith("\n"):
                              handle.write("\n")
                          handle.write(
                              "# Fetched upstream sources; never committed "
                              "(see .github/workflows/build-macos.yml).\n" + rule + "\n"
                          )
              elif ignored.returncode != 0:
                  raise SourcePinError(
                      f"cannot ask git whether {vendor}/ is ignored (exit {ignored.returncode})"
                  )
              again = _run_git(["-C", root, "check-ignore", "-q", vendor], check=False)
              if again.returncode != 0:
                  raise SourcePinError(
                      f"{vendor}/ is still not ignored; fetched material could be committed"
                  )
              return True


          def driver_argv(subcommand, *, driver=None, device=None, out_root=None, extra=()):
              """The upstream driver's command line.

              Common arguments such as -D come AFTER the subcommand: cli.py
              attaches the shared parser to every subparser (parents=[c]), so
              `unixnu -D DIR fetch` is not a command line argparse accepts.
              """
              argv = [
                  sys.executable,
                  str(DRIVER if driver is None else driver),
                  str(subcommand),
              ]
              argv += ["-D", str(DEVICE_REPO if device is None else device)]
              argv += ["--out", str(OUT_ROOT if out_root is None else out_root)]
              argv += [str(part) for part in extra]
              return argv


          def run_driver(subcommand, **kwargs):
              argv = driver_argv(subcommand, **kwargs)
              print("+ " + " ".join(argv), flush=True)
              result = subprocess.run(argv)
              if result.returncode:
                  raise SourcePinError(
                      f"unixnu {subcommand} failed ({result.returncode}); see the log above"
                  )


          def parse_status(text):
              """(git pins, unpinned, not_reproducible) from `unixnu status` output.

              cli.py cmd_status prints one line per module as
              f'{kind:8} {name:24} {origin}{extra}' where extra is
              ' pinned <sha12>' or ' NOT LOCKED'.  Only lines whose kind is a
              real module kind are read, so the header lines cannot be
              mistaken for a module.
              """
              pins, unpinned, not_reproducible = {}, [], False
              for line in text.splitlines():
                  match = STATUS_LINE.match(line.strip())
                  if not match:
                      continue
                  kind, name, origin, extra = match.group("kind", "name", "origin", "extra")
                  if origin != "git":
                      continue
                  extra = (extra or "").strip()
                  if extra.startswith("pinned "):
                      pins[name] = extra[len("pinned "):].strip()
                  else:
                      pins[name] = None
                      unpinned.append(f"{kind}:{name}")
              if "not reproducible:" in text:
                  not_reproducible = True
              return pins, unpinned, not_reproducible


          def parse_driver_lock(path):
              """{source name: commit} from the unixnu.lock the driver itself wrote."""
              path = Path(path)
              if not path.is_file():
                  return {}
              try:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError) as exc:
                  raise SourcePinError(
                      f"{path.as_posix()} is unreadable: {exc.__class__.__name__}"
                  ) from None
              resolved = {}
              for name, values in (data.get("source") or {}).items():
                  commit = values.get("commit") if isinstance(values, dict) else None
                  if isinstance(commit, str) and commit.strip():
                      resolved[name] = commit.strip()
              return resolved


          def cross_check(feeds, driver_lock, status_text, heads):
              """Compare what the driver resolved with what the lock promised."""
              problems, warnings = [], []
              pinned_feeds = {
                  entry["name"]: entry
                  for entry in feeds
                  if isinstance(entry, dict) and isinstance(entry.get("name"), str) and entry["name"]
              }
              # 1. the lock's feeds against the unixnu.lock the driver wrote
              #    (full 40-character commits, not the 12 the status prints).
              for name in sorted(set(pinned_feeds) - set(driver_lock)):
                  _announce(
                      problems,
                      f"{name}: the source lock pins it but the driver's unixnu.lock does not record it "
                      "(unixnu fetch did not resolve it)",
                  )
              for name in sorted(set(driver_lock) - set(pinned_feeds)):
                  _announce(
                      problems,
                      f"{name}: the driver's unixnu.lock records it but the source lock does not pin it; "
                      "the lock is missing a feed",
                  )
              for name in sorted(set(pinned_feeds) & set(driver_lock)):
                  want = str(pinned_feeds[name].get("commit") or "")
                  got = driver_lock[name]
                  if want.lower() != got.lower():
                      _announce(problems, f"{name}: the driver resolved {got} but the source lock pins {want}")
              # 2. the status report
              pins, unpinned, not_reproducible = parse_status(status_text)
              for name in sorted(unpinned):
                  _announce(problems, f"{name} is NOT LOCKED: the driver resolved no commit for it")
              for name, resolved in sorted(pins.items()):
                  entry = pinned_feeds.get(name)
                  if entry is None:
                      _announce(
                          problems,
                          f"{name}: the driver reports a git source the source lock does not pin",
                      )
                      continue
                  if not resolved:
                      continue
                  want = str(entry.get("commit") or "")
                  if want and not want.lower().startswith(resolved.lower()):
                      _announce(
                          problems,
                          f"{name}: the driver resolved {resolved} but the source lock pins {want}",
                      )
              for name in sorted(set(pinned_feeds) - set(pins)):
                  _announce(
                      problems,
                      f"{name}: the source lock pins it but `unixnu status` does not report it as a git source",
                  )
              if not_reproducible:
                  _announce(
                      problems,
                      "`unixnu status` reports 'not reproducible': at least one local source is not "
                      "pinned by unixnu.lock",
                  )
              if not pinned_feeds and (driver_lock or pins):
                  _announce(
                      problems,
                      "the source lock declares no feeds, so nothing the driver resolves can be "
                      "cross-checked against it",
                  )
              # 3. the two checkouts this step placed
              for label, pair in sorted(heads.items()):
                  want, got = pair.get("want"), pair.get("got")
                  if not want:
                      _announce(problems, f"{label}: no pin in the source lock to compare the checkout against")
                  elif not got:
                      _announce(problems, f"{label}: no HEAD in the checkout; the acquisition produced none")
                  elif want.lower() != got.lower():
                      _announce(problems, f"{label}: the checkout is at {got} but the source lock pins {want}")
              return problems, warnings


          def apply_submodule_divergences(driver_root):
              """Put every module submodule at the commit the lock pins.

              `unixnu fetch` initialises the module submodules from the DRIVER
              repository's own gitlink table (feeds.py:159-165) -- a second
              place that knows a sha.  The lock is the authority (PRD 8.1), and
              build-macos.sh's prepare-sources proves every pinned submodule is
              on disk at the locked commit before it runs anything
              (offline_missing), so a lock that names a different commit than
              the gitlink has to be applied HERE, where the sources are laid
              down.  Applying it only before the chain is too late: the build
              refuses before the plan runs.

              MEASURED on run 40199915736.  Pinning drivers/NativeMobileDisplay
              back one commit (see its commit_note in the lock: the pinned
              device repository cannot compile the gitlink's version) made
              prepare-sources exit 1 with

                  pinned sources are missing and this script performs no
                  network access ... submodule:drivers/NativeMobileDisplay

              because the checkout on disk was still the gitlink's.  Nothing
              about the build had been exercised -- the divergence has to reach
              the place the sources are laid down, not only the place they are
              used.

              A submodule the driver never fetched is skipped: an absent
              directory is not a divergence, and inventing a checkout here would
              put material in vendor/ that no pin asked for.

              The implementation is unipad.host.source_pins, not this body,
              because build-macos.sh applies the SAME pins from its own
              run_driver, and two implementations of "which commit" is the
              second-place-that-knows-a-sha defect this project keeps hitting.
              `pin` is one call with two halves: it moves the checkout AND sets
              submodule.<path>.update=none so the driver's own
              `git submodule update --init --recursive` (feeds.py:159-165) stops
              moving it back.  Measured on run 40217489782: repairing it after
              the driver call is too late -- the re-pin moved c031d882 ->
              eb9c949 at 17:50:36.310, one second after the link script had
              already refused at 17:50:35.288.

              The path is put on sys.path HERE rather than inherited from
              PYTHONPATH, because this step's env does not set it and the first
              attempt at this delegation died with

                  ModuleNotFoundError: No module named 'unipad'

              (measured on run 40214067252, after `unixnu fetch` and
              `unixnu tree` had both succeeded -- so the whole acquisition was
              thrown away by an import).  That is the same class as run
              40065266844, where `python3 -m unipad.host.ipsw` died the same
              way until the workflow set PYTHONPATH=src.  A dependency that
              only resolves because some other step set an environment variable
              is a dependency declared in one place and broken in another.
              """
              sys.path.insert(0, str(Path(REPO_ROOT).resolve() / "src"))
              from unipad.errors import UniPadError
              from unipad.host.source_pins import pin, read_pins

              try:
                  pins = read_pins(Path(LOCK_PATH))
                  records = pin(Path(driver_root), pins).moved
              except UniPadError as error:
                  # Re-raised as THIS step's error type, because the step's
                  # contract with its caller is SourcePinError and a caller
                  # catching it must not have to know which module did the
                  # work.  The message is the module's, unchanged.
                  raise SourcePinError(str(error)) from error
              moved = []
              for record in records:
                  gitlink = record.get("gitlink_commit")
                  print(
                      f"== {record['path']}: "
                      f"{gitlink or 'the gitlink'} -> {record['commit']} "
                      "(the divergence the lock records)"
                  )
                  moved_record = {
                      "path": record["path"],
                      "gitlink_commit": gitlink,
                      "commit": record["commit"],
                  }
                  if record.get("from"):
                      moved_record["from"] = record["from"]
                  moved.append(moved_record)
              return moved


          def main():
              problems, warnings = [], []
              try:
                  pins, feeds, frozen, lock_sha = load_pins()
              except SourcePinError as error:
                  _announce(problems, str(error))
                  _write_report(
                      "source-acquisition.json",
                      {
                          "schema_version": 1,
                          "check": "source-acquisition",
                          "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": None},
                          "status": "fail",
                          "problems": problems,
                          "warnings": warnings,
                          "unverified": list(UNVERIFIED),
                      },
                  )
                  return 1
              print(f"== lock {Path(LOCK_PATH).as_posix()} sha256={lock_sha} frozen={frozen}")
              for key, pin in pins.items():
                  print(f"== pin  {pin['directory']:<12} {pin['repo']} {pin['commit']}")
              _publish_outputs(pins, lock_sha, frozen)

              # ---- phase 1: acquire -------------------------------------------
              print("== phase 1/3 acquire the pinned checkouts")
              heads, acquisitions = {}, []
              try:
                  _refuse_private(VENDOR_DIR)
                  _refuse_private(OUT_ROOT)
                  ensure_vendor_ignored(
                      REPO_ROOT, VENDOR_DIR, [pin["repo"] for pin in pins.values()]
                  )
                  for key, pin in pins.items():
                      destination = Path(VENDOR_DIR) / pin["directory"]
                      _refuse_private(destination)
                      outcome = acquire_one(pin["repo"], pin["commit"], destination)
                      heads[destination.as_posix()] = {"want": pin["commit"], "got": outcome["head"]}
                      acquisitions.append(
                          {
                              "lock_key": key,
                              "directory": pin["directory"],
                              "repo": pin["repo"],
                              "commit": pin["commit"],
                              **outcome,
                          }
                      )
                      print(f"== {pin['directory']} {outcome['status']} at {outcome['head']}")
              except SourcePinError as error:
                  _announce(problems, str(error))
                  _write_report(
                      "source-acquisition.json",
                      {
                          "schema_version": 1,
                          "check": "source-acquisition",
                          "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": lock_sha, "frozen": frozen},
                          "vendor_ignored": None,
                          "acquisitions": acquisitions,
                          "status": "fail",
                          "problems": problems,
                          "warnings": warnings,
                          "unverified": list(UNVERIFIED),
                      },
                  )
                  return 1
              _write_report(
                  "source-acquisition.json",
                  {
                      "schema_version": 1,
                      "check": "source-acquisition",
                      "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": lock_sha, "frozen": frozen},
                      "vendor_ignored": True,
                      "acquisitions": acquisitions,
                      "status": "pass",
                      "problems": [],
                      "warnings": [],
                      "unverified": list(UNVERIFIED),
                  },
              )

              # ---- phase 2: assemble with the driver --------------------------
              print("== phase 2/3 assemble with the upstream driver (fetch, tree)")
              divergences = []
              try:
                  run_driver("fetch")
                  run_driver("tree")
                  # The driver has now initialised every module submodule from
                  # its own gitlink table.  Anything the lock pins elsewhere is
                  # moved here, while the sources are still being laid down --
                  # see apply_submodule_divergences for the run that proved the
                  # later placement is too late.
                  divergences = apply_submodule_divergences(
                      Path(VENDOR_DIR) / pins["unixnu"]["directory"]
                  )
              except SourcePinError as error:
                  _announce(problems, str(error))
                  _write_report(
                      "pin-crosscheck.json",
                      {
                          "schema_version": 1,
                          "check": "pin-crosscheck",
                          "status": "fail",
                          "problems": problems,
                          "warnings": warnings,
                          "unverified": list(UNVERIFIED),
                      },
                  )
                  return 1
              if divergences:
                  for entry in divergences:
                      print(
                          f"== {entry['path']} moved to the locked {entry['commit']}"
                      )

              # ---- phase 3: cross-check ---------------------------------------
              print("== phase 3/3 cross-check the resolved pins against the source lock")
              status_text, status_error = "", ""
              try:
                  status = subprocess.run(driver_argv("status"), capture_output=True, text=True)
                  status_text = status.stdout
                  if status.returncode:
                      status_error = f"unixnu status failed ({status.returncode}): {status.stderr.strip()}"
                      _announce(problems, status_error)
              except OSError as error:
                  status_error = f"cannot run unixnu status: {error.__class__.__name__}"
                  _announce(problems, status_error)
              try:
                  driver_lock = parse_driver_lock(Path(DEVICE_REPO) / "unixnu.lock")
              except SourcePinError as error:
                  driver_lock = {}
                  _announce(problems, str(error))
              check_problems, check_warnings = cross_check(feeds, driver_lock, status_text, heads)
              problems += check_problems
              warnings += check_warnings
              if not check_problems:
                  print(f"== cross-check: {len(driver_lock)} feed pin(s) and 2 checkout(s) agree with the lock")
              _write_report(
                  "pin-crosscheck.json",
                  {
                      "schema_version": 1,
                      "check": "pin-crosscheck",
                      "lock": {"path": Path(LOCK_PATH).as_posix(), "sha256": lock_sha, "frozen": frozen},
                      "driver_lock_path": (Path(DEVICE_REPO) / "unixnu.lock").as_posix(),
                      "driver_lock": driver_lock,
                      "lock_feeds": {
                          entry["name"]: entry.get("commit")
                          for entry in feeds
                          if isinstance(entry, dict) and isinstance(entry.get("name"), str)
                      },
                      "status_error": status_error or None,
                      "heads": heads,
                      "submodule_divergences": divergences,
                      "problems": check_problems,
                      "warnings": check_warnings,
                      "unverified": list(UNVERIFIED),
                      "status": "fail" if check_problems else "pass",
                  },
              )
              for message in UNVERIFIED:
                  _warn(warnings, f"unverified: {message}")
              if problems:
                  print(f"== sources: FAIL ({len(problems)} problem(s))")
                  return 1
              print("== sources: PASS (acquired, assembled and cross-checked)")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      # PRD 8.1 / 8.3: the original kernelcache.  kernel.prelink() takes it from
      # --kernelcache, from board.toml [kernel.prelink] kernelcache, or out of
      # the IPSW (kernel.py:111-114); this board names no local file and its
      # [ipsw] url is https, so without this step build-kernel has no input and
      # records not_run -- which is why no macOS runner has ever produced a
      # kernel.macho.
      #
      # Two properties this step must have, and why:
      #
      # * It runs OUTSIDE build-output/ and staged/.  The kernelcache is Apple
      #   material extracted from a pinned firmware image (PRD 12): it may be
      #   used to build, but it must never be staged, hashed into
      #   artifact-manifest.json or uploaded.  The staging step below scans
      #   BUILD_OUTPUT_DIR only, so keeping the output elsewhere is what makes
      #   that true by construction rather than by an ignore rule that can
      #   drift.
      # * It is continue-on-error.  A blocked or truncated download must not
      #   take the whole job down: the remaining stages still have evidence to
      #   produce, and build-kernel then records not_run with its own reason
      #   instead of the run vanishing.  The step's own JSON records the refusal
      #   code, so a silent failure is still visible.
      - name: Acquire the pinned IPSW and publish the kernelcache
        id: ipsw
        continue-on-error: true
        env:
          LOCK_PATH: config/sources.lock.json
          DEVICE_REPO: vendor/UniXNU-qemu
          IPSW_WORK_DIR: ipsw-work
          KERNELCACHE_PATH: ipsw-work/kernelcache.macho
          # The device tree is extracted in the same pass, so build-devicetree
          # does not need the whole 6.8 GB image kept alive across the build.
          DEVICETREE_PATH: ipsw-work/devicetree
          SUMMARY_PATH: ipsw-work/ipsw-summary.json
          # The package lives in src/ and is installed as an editable shim on
          # the development host only -- a GitHub runner has no such shim, so
          # without this the step dies with
          # ModuleNotFoundError: No module named 'unipad'.  Measured on run
          # 40065266844.
          PYTHONPATH: src
        run: |
          # pipefail is load-bearing, not decoration.  Without it, `status=$?`
          # after `... | tee log` is tee's exit code, and a failing python
          # reads as a passing step -- which is exactly what happened on the
          # first real run: the module could not be imported, the step printed
          # "== ipsw: PASS", and the build then recorded not_run for a reason
          # that looked like a policy choice rather than an import error.
          set -uo pipefail
          # Not `set -e`: this step is allowed to fail, and a failing command
          # must not abort the shell before the summary is written.
          python3 -m unipad.host.ipsw \
            --lock "$LOCK_PATH" \
            --device "$DEVICE_REPO" \
            --work "$IPSW_WORK_DIR/work" \
            --kernelcache "$KERNELCACHE_PATH" \
            --devicetree "$DEVICETREE_PATH" \
            --summary "$SUMMARY_PATH" \
            | tee "$IPSW_WORK_DIR/ipsw.log"
          status=$?
          echo "ipsw_status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$KERNELCACHE_PATH" ]; then
            echo "kernelcache_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernelcache_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$DEVICETREE_PATH" ]; then
            echo "devicetree_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "devicetree_present=false" >> "$GITHUB_OUTPUT"
          fi
          # The image itself is deleted by the module the moment extraction
          # finishes; what is left here is the published Mach-O and the record.
          if [ "$status" -eq 0 ]; then
            echo "== ipsw: PASS (verified whole, kernelcache published)"
          else
            echo "::warning::the IPSW step failed (exit $status); build-kernel will record not_run. See $SUMMARY_PATH"
          fi
          exit 0

      # The XNU build's own prepare-xnu-source.py fetches three directory
      # listings from api.github.com with a bare urlopen -- unauthenticated, so
      # it shares GitHub's 60-requests-per-hour per-IP limit with every other
      # Actions runner on that address.  Measured on run 40066399042:
      # "HTTP Error 403: rate limit exceeded", which failed build-kernel before
      # a single translation unit was compiled.
      #
      # The script caches those listings by path and verifies every blob by its
      # git SHA-1, so seeding them with an authenticated request (5000/hour)
      # removes all three API calls without changing any content: the blobs are
      # still downloaded and still hash-checked by the upstream script.
      #
      # The tags are read from vendor/UniXNU/feeds.toml rather than written
      # here, so there is no second place that knows them.
      - name: Pre-seed the XNU header listings with an authenticated request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_ROOT: build-output/unixnu-out
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tomllib
          import urllib.request
          from pathlib import Path

          token = os.environ.get("GITHUB_TOKEN", "")
          feeds = tomllib.loads(
              Path("vendor/UniXNU/feeds.toml").read_text(encoding="utf-8")
          )
          xnu = feeds.get("xnu", {})
          driverkit = xnu.get("driverkit_tag", "xnu-10063.121.3")
          trustcache = xnu.get("trustcache_tag", "xnu-8796.101.5")
          repo = "https://api.github.com/repos/apple-oss-distributions/xnu/contents"
          wanted = [
              (f"{repo}/iokit/DriverKit?ref={driverkit}",
               f"xnu-driverkit-{driverkit.removeprefix('xnu-')}.json"),
              (f"{repo}/iokit/DriverKit/crypto?ref={driverkit}",
               f"xnu-driverkit-crypto-{driverkit.removeprefix('xnu-')}.json"),
              (f"{repo}/EXTERNAL_HEADERS/TrustCache?ref={trustcache}",
               f"xnu-trustcache-{trustcache.removeprefix('xnu-')}.json"),
          ]
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          root = Path(os.environ.get("OUT_ROOT", "build-output/unixnu-out"))
          trees = sorted(root.glob("*/tree"))
          if not trees:
              raise SystemExit(f"no assembled build tree under {root}")
          for url, name in wanted:
              request = urllib.request.Request(url, headers=headers)
              body = urllib.request.urlopen(request, timeout=60).read()
              # Refuse to seed a listing that is not the directory listing the
              # script expects: an error page would be cached as if it were data.
              entries = json.loads(body)
              if not isinstance(entries, list):
                  raise SystemExit(f"{url} did not return a directory listing")
              for tree in trees:
                  target = tree / ".cache" / "sources" / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(body)
              print(f"seeded {name}: {len(entries)} entries into {len(trees)} tree(s)")
          PY

      # The DarwinBoot EFI build links with lld-link, LLVM's MSVC-compatible
      # linker.  A GitHub macOS runner ships Xcode's ld and has no Homebrew LLVM,
      # so build-bootloader stops at "unixnu: lld-link not found on PATH (brew
      # install llvm lld)".  Measured on run 40076039682, where the kernel and all
      # ten archive builders had already succeeded.
      #
      # $GITHUB_PATH is used rather than an exported PATH so the keg is visible to
      # every later step, not just this one.
      - name: Install LLVM (lld-link for the bootloader link)
        run: |
          set -euo pipefail
          if ! command -v lld-link >/dev/null 2>&1; then
            echo "lld-link absent; installing llvm and lld"
            brew install llvm lld
          fi
          found=0
          for keg in /opt/homebrew/opt/llvm/bin /usr/local/opt/llvm/bin; do
            if [ -d "$keg" ]; then
              echo "$keg" >> "$GITHUB_PATH"
              echo "$keg added to PATH"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no llvm keg on disk after brew install llvm lld"
            exit 1
          fi
          lld-link --version

      # The Mesa source and the tools build-turnip-darwin.py needs.  Without it
      # the GPU-addon chain dies on its first line with a message about a
      # missing .cache directory rather than about the missing stage -- which is
      # the shape where the failure names the wrong cause.
      #
      # The position is the whole point.  The payload step that would consume
      # the addon runs INSIDE build-macos.sh, in the step immediately below, so
      # a chain that ran after it could never hand anything over: the blob has
      # to exist before the build starts, not after it.  An earlier revision of
      # this step sat after the build and its comment claimed it ran before it,
      # which was false on the very run that comment described.
      #
      # Failure here is NOT fatal to the build: it is recorded as a step output
      # and the payload step says, in its own words, that no addon was supplied.
      # A runner that cannot cross-compile Mesa still produces a kernel, a
      # device tree and a Data volume, and refusing all of that because the
      # plugin is missing would trade a known limitation for an unknown one.
      - name: Bootstrap the Mesa source and Turnip tools
        id: mesa
        if: always()
        env:
          BOOTSTRAP_LOG: build-output/bootstrap-mesa.log
        run: |
          set -uo pipefail
          mkdir -p build-output
          if bash scripts/macos/bootstrap-mesa-turnip.sh . ; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the Mesa bootstrap failed; the GPU addon will not be built and the payload step will say so"
          fi
          # The addon blob, if whatever built it left one.  Read here rather
          # than in the build step so the producer and the consumer never have
          # to agree on a path: the chain's later links write it, this step
          # forwards it, and build-macos.sh's --gpu-addon receives it.  The
          # chain now runs in the step below, so this line is the fallback for
          # a blob an earlier run left behind rather than the only source.
          if [ -f vendor/UniXNU/build/gpu-addon.ngpu ]; then
            echo "addon=vendor/UniXNU/build/gpu-addon.ngpu" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # The metal2vulkan translator source, and the toolchain that compiles it,
      # for the same reason the step above exists for Mesa: without it the
      # GPU-addon chain dies on its first line with a message about a missing
      # .cache directory rather than about the missing stage.  Four readers
      # resolve `vendor/UniXNU/.cache/gpu-reference/metal2vulkan` from
      # `Path(__file__).resolve().parents[1]` -- build-native-metal-bridge.py:17,
      # check-metal-vulkan-probe.py:23, probe-metal-vulkan-host.py:101 and
      # check-priming-cache-host.py:167 -- so a producer that put it anywhere
      # else would satisfy itself and starve all four.
      #
      # It is a SEPARATE step rather than two more lines in the Mesa one,
      # because the two bootstraps fail independently and the log has to say
      # which: a Mesa checkout that cannot be fetched and a Rust toolchain that
      # cannot be installed are different problems with different fixes, and one
      # `available=false` line covering both would name neither.
      #
      # Not fatal, for the same reason the Mesa bootstrap is not: a runner that
      # cannot install the toolchain still produces a kernel, a device tree and
      # a Data volume.  What changes is that the chain now has its ring-0 input:
      # build-gpu-addon.sh:116 dies with "no $TRANSLATOR; ring 0's
      # bootstrap-metal2vulkan.sh has not run" until this step has run, so every
      # previous run of the addon chain stopped there.
      #
      # Sits immediately after the Mesa bootstrap and immediately before the
      # addon chain, which is the only position that can hand anything over.
      - name: Bootstrap the metal2vulkan translator source and Rust toolchain
        id: metal2vulkan
        if: always()
        env:
          BOOTSTRAP_LOG: build-output/bootstrap-metal2vulkan.log
        run: |
          set -uo pipefail
          mkdir -p build-output
          if bash scripts/macos/bootstrap-metal2vulkan.sh . ; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the metal2vulkan bootstrap failed; the GPU addon chain will stop at its ring-0 preflight and say so"
          fi
          exit 0

      # Rings 1..7 of the addon chain.  Sits here, immediately after the
      # bootstraps and immediately before the build, for the reason the step
      # above gives: the blob has to exist before build-macos.sh runs, because
      # --gpu-addon is what puts it in the payload.
      #
      # Not fatal, for the same reason the bootstrap is not: a runner that
      # cannot finish the chain still produces a kernel, a device tree and a
      # Data volume, and the payload step names the missing addon in its own
      # words.  What changed is that the chain now RUNS: rings 1..7 were
      # unbuilt until this step, so `addon` above was structurally always
      # absent.  The one upstream gap on the path (the absent
      # check-quartzcore-turnip-cache-host.py) is skipped explicitly and
      # loudly by scripts/macos/run-upstream-check.py, whose tests pin that it
      # skips only that one call and still fails on everything else.
      - name: Build the GPU addon chain
        id: addon
        if: always() && steps.mesa.outputs.available == 'true'
        env:
          ADDON_LOG_DIR: build-output
        run: |
          set -uo pipefail
          mkdir -p build-output
          if bash scripts/macos/build-gpu-addon.sh . ; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "addon=vendor/UniXNU/build/gpu-addon.ngpu" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the GPU addon chain failed; its logs are in the build-logs artifact and the payload step will say no addon was supplied"
          fi
          exit 0

      # The chain's outcome in the run's verdict, for the same reason the owner
      # root chain has one below.
      #
      # MEASURED on run 40921780876, the first run that reached these rings: the
      # chain failed at ring 1 (the build virtualenv lacked Mesa's python
      # modules) and this step reported `success` anyway, because it ends in
      # `exit 0` -- which is deliberate, a runner that cannot cross-compile the
      # plugin still owes a kernel and a Data volume.  But `success` on a step
      # whose own log says `FAIL turnip-host` is a green light over a red one:
      # the failure was recorded in `built=false` and in an annotation, and
      # nothing read either.  A reader of the run summary saw the addon chain
      # pass, which is the one thing it did not do.
      #
      # So the step stays non-fatal and the verdict does not.  `built=false` is
      # now consumed by something, and the run's conclusion says the addon is
      # missing even though the kernel, the device tree and the Data volume were
      # all produced.  That is the honest split: the artifacts are real, the
      # addon is not, and a run that says so is worth more than a green one.
      - name: The GPU addon chain's outcome is part of the run's verdict
        if: always() && steps.addon.outputs.built == 'false'
        run: |
          set -uo pipefail
          echo "::error::the GPU addon chain did not produce a blob; the payload carries no --gpu-addon and the guest's addon mount will fail ENOENT"
          echo "The chain's own log and each ring's log are in the build-logs artifact:"
          echo "  build-output/build-gpu-addon.log   the ring sequence and each ring's elapsed seconds"
          echo "  build-output/addon-<ring>.log      the failing ring's own output"
          echo "Every ring reports how long it took, so this says which ring to look at, not just that one failed."
          exit 1

      - name: Run macOS build (scripts/macos/build-macos.sh)
        id: build
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          # The pins the lock resolved, for the record the build script keeps.
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          BUILD_OUTPUT_DIR: build-output
          STAGE_DIR: staged
          BUILD_LOG: macos-build.log
          TOOLCHAIN_CACHE_DIR: ~/.cache/unipad-macos-build
          DEVICETREE_PATH: ipsw-work/devicetree
          # The published kernelcache, when the IPSW step produced one.  Passed
          # only when it exists: an absent file must reach build-macos.sh as
          # "no --kernelcache", because then build-kernel records not_run with
          # its own reason rather than the script dying on a missing path.
          KERNELCACHE_PATH: ipsw-work/kernelcache.macho
          # The boot payload (the ESP volume).  BUILD_PAYLOAD is the environment
          # spelling of --payload; the script reads it when the flag is absent and
          # the flag wins when both are present.  It is on here because the boot
          # input set is the point of the run: a kernel with nothing to start it
          # is not a deliverable (PRD 8.1).
          BUILD_PAYLOAD: '1'
          # The GPU addon blob, when the chain above produced one.  The
          # environment spelling of --gpu-addon; build-macos.sh reads it when
          # the flag is absent and the flag wins when both are present, exactly
          # as BUILD_PAYLOAD does.  Empty today, and an empty value has to reach
          # the script as "no --gpu-addon" -- which is what makes its payload
          # step say so in its own words instead of dying on a missing path.
          UNIXNU_GPU_ADDON: ${{ steps.addon.outputs.addon || steps.mesa.outputs.addon || '' }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/macos/build-macos.sh ]; then
            echo "::error::scripts/macos/build-macos.sh is missing: the macOS build entry point has not landed yet (code-stage blocker, PRD 9 scripts/macos/)"
            exit 3
          fi
          mkdir -p "$BUILD_OUTPUT_DIR"
          started=$(date -u +%s)
          echo "started_at=$started" >> "$GITHUB_OUTPUT"
          # --out must be passed, not defaulted: build-macos.sh defaults OUT_DIR
          # to scripts/macos/build-out/<run-id>, which would put its UNIXNU_OUT
          # -- and therefore the "$FEEDS_DIR"/* scan its prepare-sources step
          # uses to prove every feed clone is already on disk -- somewhere the
          # acquisition step never wrote.  Pointing it at the same directory the
          # staging step scans keeps one out root for the whole job.
          declare -a kernel_args=()
          if [ -f "$KERNELCACHE_PATH" ]; then
            kernel_args+=(--kernelcache "$KERNELCACHE_PATH")
            echo "build: using the extracted kernelcache ($KERNELCACHE_PATH)"
          else
            echo "::notice::no kernelcache was published; build-kernel will record not_run (see the ipsw step)"
          fi
          if [ -f "$DEVICETREE_PATH" ]; then
            kernel_args+=(--devicetree "$DEVICETREE_PATH")
            echo "build: using the extracted device tree ($DEVICETREE_PATH)"
          else
            echo "::notice::no device tree was published; build-devicetree will record not_run (see the ipsw step)"
          fi
          # The boot payload.  It is opt-in inside build-macos.sh (--payload) and
          # asked for here, because it is what turns "a kernel was built" into "a
          # machine can be started": 'unixnu build payload' writes payload.img,
          # the FAT ESP volume carrying the kernel, the Apple-format device tree
          # this machine boots (make-qemu-adt.py dumps it by running
          # qemu-system-aarch64, which the step installs with brew) and
          # EFI/UniXNU/unixnu.toml naming Payloads/DarwinBoot.efi as a driver.
          declare -a payload_args=()
          if [ "${BUILD_PAYLOAD:-0}" = '1' ]; then
            payload_args+=(--payload)
            echo "build: building the boot payload (build-payload: payload.img + kernel.macho.adt + unixnu.toml)"
          else
            echo "::notice::BUILD_PAYLOAD is off; no payload.img will be produced and the boot input set stays incomplete"
          fi
          # The Mu-Silicium checkout, forwarded as --uefi.  Either spelling
          # reaches the patcher -- cli.py:136 sets ctx.uefi from --uefi or from
          # UNIXNU_UEFI (config.py:110-117) and payload.py:142 forwards it as
          # UNIXNU_UEFI -- but the flag is what this workflow passes, because it
          # lands in the driver's argv.log and so names the checkout the font
          # came from, and because need_uefi() (cli.py:67-73) reads the same
          # option for the firmware and boot-image stages.
          # Measured on runs 40094234507 and 40096928333: with neither spelling
          # and no vendor/uefi-sheng, board.toml [payload] panic_screen = true
          # (UniXNU-qemu/board.toml:94) makes the patcher compile
          # xnu-panic-screen.c, whose one include is "Font.h"
          # (xnu-panic-screen.c:294) out of this checkout, and the step died in
          # clang with "fatal error: 'Font.h' file not found".  The acquisition
          # step above places the pinned commit at vendor/uefi-sheng;
          # build-macos.sh verifies the font header's sha256 against
          # sources.lock.json before it runs the driver.
          declare -a uefi_args=()
          if [ -d vendor/uefi-sheng ]; then
            uefi_args+=(--uefi vendor/uefi-sheng)
            echo "build: using the Mu-Silicium checkout for the panic screen font (vendor/uefi-sheng)"
          else
            echo "::warning::vendor/uefi-sheng is absent; build-payload's panic screen has no font header and will record failed"
          fi
          bash scripts/macos/build-macos.sh \
            --experiment "$EXPERIMENT_ID" \
            --stage "$STAGE" \
            --target "$PAYLOAD_TARGET" \
            --out "$BUILD_OUTPUT_DIR" \
            --unixnu vendor/UniXNU \
            --device vendor/UniXNU-qemu \
            ${uefi_args[@]+"${uefi_args[@]}"} \
            ${kernel_args[@]+"${kernel_args[@]}"} \
            ${payload_args[@]+"${payload_args[@]}"} \
            2>&1 | tee "$BUILD_LOG"
          finished=$(date -u +%s)
          echo "finished_at=$finished" >> "$GITHUB_OUTPUT"
          echo "build duration: $((finished - started))s"
          # Whether the ESP exists, so the boot-inputs step below can say so
          # instead of inferring it from an artifact that may not have been
          # produced.  Globbed rather than naming the board: the board name is
          # board.toml's ([board] name), and a workflow that knew it would be a
          # second place that carries it.
          payload_image="$(ls build-output/unixnu-out/*/payload/payload.img 2>/dev/null | head -n 1 || true)"
          if [ -n "$payload_image" ]; then
            echo "payload_present=true" >> "$GITHUB_OUTPUT"
            echo "payload_image=$payload_image" >> "$GITHUB_OUTPUT"
            echo "build: payload image $payload_image ($(wc -c <"$payload_image" | tr -d ' ') bytes)"
          else
            echo "payload_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no payload.img was produced; see the build-payload entry in build-report.json"
          fi

      # ---------------------------------------------------------------------
      # The owner root chain, between the two build passes.
      # ---------------------------------------------------------------------
      # WHY THERE ARE TWO PASSES AT ALL.  build-os-root.py's FIRST sub-step boots
      # the kernel step's kernel.macho in QEMU to qualify the storage ABI
      # (build-storage-abi.py:18,31), and the storage-ABI observation boots the
      # candidate from the payload volume (qemu_esp.py:27) -- so the chain cannot
      # start until build-kernel and build-payload have produced theirs, and
      # build-macos.sh's plan puts build-os-root BEFORE both of them.  That is
      # not a bug in the plan: the vendor chain itself documents the sequence
      # (README:96-98), and step_build_os_root's own comment spells it out -- on a
      # fresh workspace the stage records not_run, build-kernel builds the board's
      # qemu_defconfig, and a SECOND invocation of the script then runs the chain
      # and builds qemu_root_defconfig.  The workflow used to make exactly one
      # invocation, so the chain could never run and every kernel the runner ever
      # produced was a qemu_defconfig kernel without CONFIG_XNU_NATIVE_VIRTIO_BLOCK
      # -- measured on this host: such a kernel reaches mountroot, matches the
      # board's UUID and has APFS loaded, and enumerates nothing, because no
      # kernel.macho built here carries NativeVirtioBlock.
      #
      # WHY THE CHAIN RUNS OUTSIDE build-macos.sh.  The chain's inputs are the OS
      # and SystemOS volumes -- 4.80 GiB and 3.08 GiB, the zip entries' file_size
      # values in the pinned image -- and DEFAULT_MIN_FREE_GB=8 is checked at
      # build-macos.sh's own preflight, before any stage runs.  On a ~14 GiB macOS
      # runner those two facts are incompatible: the volumes plus the build tree
      # leave less than the floor, so a build-macos.sh invocation that had the
      # volumes on disk would die at preflight having done nothing.  Running
      # build-os-root.py directly -- which is what README:96 does, and what its
      # own header documents -- keeps the floor where it is and lets the chain run
      # on the space that is actually there.  The second invocation below then
      # finds the chain's outputs on disk, spends no volumes, and records the
      # stage as 'skipped' rather than 'ran', because that invocation did not run
      # it.
      #
      # WHAT IT COSTS (PRD 8.4).  One more 6.37 GiB download of the pinned image,
      # ~8.5 GiB of extraction and hashing, the chain itself (it boots QEMU once
      # under the lock's accelerator and signs every 4 KiB block of both volumes),
      # and a second kernel build -- the dominant cost, because qemu_root_defconfig
      # is a different config and therefore a full XNU rebuild rather than an
      # incremental one.  macOS minutes are billed at 10x, so this is the
      # expensive half of the job and it is spent on purpose: without it there is
      # no kernel that can mount a root volume at all.

      # The chain's host verifier links against OpenSSL 3 (build-os-root.py:44-45,63-65
      # takes it as --openssl-prefix).  A GitHub macOS runner ships Xcode's ld and
      # has no Homebrew OpenSSL, so without this keg step_build_os_root's own gate
      # would record not_run naming it -- and so would this step's chain run.
      - name: Install OpenSSL 3 (the root chain's host verifier)
        run: |
          set -euo pipefail
          keg=''
          for candidate in /opt/homebrew/opt/openssl@3 /usr/local/opt/openssl@3; do
            if [ -d "$candidate" ]; then keg="$candidate"; break; fi
          done
          if [ -z "$keg" ]; then
            echo "openssl@3 absent; installing it"
            brew install openssl@3
          fi
          for candidate in /opt/homebrew/opt/openssl@3 /usr/local/opt/openssl@3; do
            if [ -d "$candidate" ]; then keg="$candidate"; break; fi
          done
          if [ -z "$keg" ]; then
            echo "::error::no openssl@3 keg on disk after brew install openssl@3"
            exit 1
          fi
          echo "OPENSSL_PREFIX=$keg" >> "$GITHUB_ENV"
          # On PATH as well as in the environment.  macOS's /usr/bin/openssl is
          # LibreSSL, whose `enc` has no GCM, so `openssl enc -aes-256-gcm` fails
          # there -- measured on run 40392771419, whose material delivery
          # encryption died for exactly that reason.  The LLVM step above already
          # puts its keg on PATH for the same reason; this is the same asymmetry
          # closed.  build-macos.sh resolves the keg itself too, so this is the
          # belt over those braces: it protects any future caller that reaches
          # for a bare `openssl`.
          echo "$keg/bin" >> "$GITHUB_PATH"
          echo "root chain verifier: $keg (and $keg/bin is on PATH)"

      # The four members build-os-root.py reads out of the image, published from
      # a fresh acquisition.  continue-on-error for the same reason the first
      # acquisition is: a blocked chain must not take the rest of the job down,
      # and the reason has to survive into the log rather than into a failed
      # step nobody reads.
      #
      # The image is downloaded a SECOND time, and that is deliberate rather than
      # wasteful: the first acquisition deletes it the moment extraction finishes
      # (unipad.host.ipsw.acquire), and 6.37 GiB cannot be kept across the first
      # build pass anyway -- the runner has ~14 GiB free and the build tree is
      # already most of the rest of it.  What survives this step is the members,
      # not the image.
      - name: Publish the owner root chain's IPSW members
        id: chain_ipsw
        continue-on-error: true
        env:
          LOCK_PATH: config/sources.lock.json
          DEVICE_REPO: vendor/UniXNU-qemu
          IPSW_WORK_DIR: ipsw-work
          VOLUMES_DIR: ipsw-work/volumes
          TRUSTCACHE_DIR: build-output/unixnu-out/ipsw
          # The driver's own IPSW cache, which is the same directory: unixnu's
          # cache is out/ipsw/<build> (unixnu/ipsw.py:116) and so is where the
          # StaticTrustCache IM4P is published.  The kernelcache is a different
          # reader, not a different place.
          KERNELCACHE_CACHE_DIR: build-output/unixnu-out/ipsw
          REFER_DIR: ipsw-work/refer
          SUMMARY_PATH: ipsw-work/chain-summary.json
          PYTHONPATH: src
        run: |
          set -uo pipefail
          mkdir -p "$VOLUMES_DIR" "$REFER_DIR" "$TRUSTCACHE_DIR"
          # The one number that decides whether this step can finish at all.  The
          # chain's own inputs are 7.88 GiB of volumes and the image is 6.37 GiB,
          # against a runner with ~14 GiB free and a build tree already on disk,
          # so an ENOSPC here is a live possibility rather than a hypothetical
          # one -- and a bare "No space left on device" six minutes into a paid
          # macOS job does not say how much was missing.  Print it before, and
          # again after, so the log carries the delta the step actually spent.
          df -k . | sed 's/^/chain ipsw: /'
          # --kernelcache is required by the module's contract (the Mach-O has to
          # outlive the workspace), so it is pointed at the file the first
          # acquisition already published: the copy is re-hashed against the same
          # digest, so this is a verified no-op rather than a second decode.
          python3 -m unipad.host.ipsw \
            --lock "$LOCK_PATH" \
            --device "$DEVICE_REPO" \
            --work "$IPSW_WORK_DIR/chain-work" \
            --kernelcache "$IPSW_WORK_DIR/kernelcache.macho" \
            --os-volume "$VOLUMES_DIR" \
            --systemos-volume "$VOLUMES_DIR" \
            --static-trustcache "$TRUSTCACHE_DIR" \
            --kernelcache-cache "$KERNELCACHE_CACHE_DIR" \
            --refer-ipsw "$REFER_DIR" \
            --summary "$SUMMARY_PATH" \
            | tee "$IPSW_WORK_DIR/chain.log"
          status=$?
          echo "chain_ipsw_status=$status" >> "$GITHUB_OUTPUT"
          # The image is deleted by the module the moment extraction finishes.
          # What is left is the two volumes, the StaticTrustCache IM4P at the
          # path build-os-root.py:150 reads it from, and the reconstructed refer
          # image -- which is why the next step can be skipped on this status
          # rather than on a guess about what was published.
          volumes=0
          for volume in "$VOLUMES_DIR"/*.dmg; do
            [ -f "$volume" ] && volumes=$((volumes + 1))
          done
          echo "chain_volumes=$volumes" >> "$GITHUB_OUTPUT"
          # ...and the same number again, so the log carries what the step cost
          # rather than only what it started with.  A reader comparing the two
          # lines can tell an extraction that died early from one that ran out of
          # room at the last volume, which are different failures with the same
          # exit status.
          df -k . | sed 's/^/chain ipsw (after): /'
          du -sh "$VOLUMES_DIR" 2>/dev/null | sed 's/^/chain ipsw volumes: /' || true
          if [ "$status" -eq 0 ] && [ "$volumes" -eq 2 ]; then
            echo "== chain ipsw: PASS (both volumes published, image discarded)"
          elif [ "$status" -eq 0 ]; then
            echo "::error::the chain acquisition exited 0 but published $volumes volume(s), not 2"
            exit 1
          else
            echo "::warning::the chain acquisition failed (exit $status); the owner root chain will not run. See $SUMMARY_PATH"
          fi
          exit 0

      # The chain itself, the way README:96-98 runs it: from the build tree, with
      # --ipsw naming the reconstructed refer image.  Skipped -- loudly, with the
      # reason -- unless the previous step actually published both volumes, so a
      # missing input is a notice rather than a chain that dies halfway through
      # signing the OS volume.
      - name: Build the owner root chain (build-os-root.py)
        id: os_root
        if: steps.chain_ipsw.outputs.chain_volumes == '2'
        env:
          DEVICE_REPO: vendor/UniXNU-qemu
          IPSW_WORK_DIR: ipsw-work
          VOLUMES_DIR: ipsw-work/volumes
          REFER_DIR: ipsw-work/refer
          OPENSSL_PREFIX: ${{ env.OPENSSL_PREFIX }}
          OUT_ROOT: build-output/unixnu-out
          # This workflow declares NO workflow-level and NO job-level `env:`
          # block -- LOCK_PATH is set per step, by the steps that need it.  It
          # was missing here and `set -euo pipefail` turned that into
          # "LOCK_PATH: unbound variable" at the display-driver divergence, on
          # run 40201825941, after the volumes had been moved and the kernel and
          # payload had been proved present.  Same spelling as the two
          # build-macos.sh invocations above.
          LOCK_PATH: config/sources.lock.json
        run: |
          set -euo pipefail
          # And again before the chain signs them, because this is the step that
          # would otherwise fail with an ENOSPC that says nothing about how much
          # was missing.  The volumes have been moved (not copied) by this point,
          # so what is printed here is the filesystem the chain is about to work
          # on, with its own build tree and the image already gone.
          df -k . | sed 's/^/os root: /'
          # (1) where the chain reads the two volumes.  .cache/firmware of the
          #     DEVICE repository, not of the tree: tree.py:assemble symlinks
          #     <tree>/.cache/firmware at it precisely so the seed and its UUID
          #     are shared by every tree and survive in the device repository.
          #     The vendor repository's own .gitignore covers /.cache/, so these
          #     are not tracked and cannot be committed by accident.
          volumes="$DEVICE_REPO/.cache/firmware/target-volumes"
          mkdir -p "$volumes"
          # Moved, not copied: 7.88 GiB renamed within one filesystem is free,
          # and a copy would need 7.88 GiB that is not there.
          for volume in "$VOLUMES_DIR"/*.dmg; do
            [ -f "$volume" ] || continue
            mv "$volume" "$volumes/"
            echo "chain: placed $(basename "$volume") ($(wc -c <"$volumes/$(basename "$volume")" | tr -d ' ') bytes) at $volumes"
          done
          # (2) the refer image.  build-os-root.py symlinks <tree>/refer/<name>
          #     at --ipsw and build-original-system-trust.py opens that path, so
          #     the name has to be the one the chain hard-codes -- which is why
          #     the module names the reconstruction after the lock's ipsw.name
          #     rather than after anything this step would have to spell out.
          refer="$(ls "$REFER_DIR"/*.ipsw 2>/dev/null | head -n 1 || true)"
          if [ -z "$refer" ]; then
            echo "::error::no reconstructed refer image under $REFER_DIR; the System trust cache cannot be bundled"
            exit 1
          fi
          # Absolute, because build-os-root.py resolves --ipsw against its OWN
          # cwd -- and it runs from the build tree, not from the workspace.
          #
          # MEASURED on run 40203832707, which is the run that got nine of the
          # chain's ten steps to pass for the first time (storage-abi, both
          # policies -- 1483785 OS blocks and 806400 SystemOS blocks verified by
          # real C/RSA -- the verified-root probe, both block drivers in verified
          # mode, the 1 GiB owner data, and the whole display/GOP/HID audit) and
          # then died on the tenth with
          #
          #   FileNotFoundError: [Errno 2] No such file or directory:
          #     '.../build-output/unixnu-out/qemu/tree/refer/iPad_Pro_HFR_...ipsw'
          #
          # The step passed `--ipsw ipsw-work/refer/...` -- workspace-relative --
          # and the module did `ipsw.symlink_to(Path(args.ipsw).resolve())` from
          # inside the tree, so the symlink it created pointed at
          # `<tree>/ipsw-work/refer/...`, a path that does not exist.  The
          # message names the symlink, not the target, so it reads as a missing
          # refer image when the image was there the whole time.
          #
          # The same relative path is handed to extract-target-volume.py, so
          # this also fixes the two volumes' extraction on a run that starts
          # with an empty .cache.  `cd ... && pwd` rather than realpath, which
          # is not in every macOS image the runner may use.
          refer="$(cd "$(dirname "$refer")" && pwd)/$(basename "$refer")"
          if [ ! -f "$refer" ]; then
            echo "::error::$refer is not a file; the System trust cache cannot be bundled"
            exit 1
          fi
          # (3) the tree, the QEMU the storage-ABI observation boots once, and the
          #     two files that observation needs.  Measured on run 40186682998: the
          #     chain reached build-storage-abi.py and died with
          #     "build-output/unixnu-out/qemu/payload/payload.img missing (unixnu
          #     build payload)" -- a message that names the file and not the cause,
          #     which is that the job was triggered on the workflow's default
          #     stage=M2 and plan_steps gates build-bootloader at n>=3, so
          #     build-payload had nothing to load and recorded not_run.  Checking
          #     here costs one stat and names the cause before the volumes have
          #     been moved and the chain has been started.
          tree="$(ls -d "$OUT_ROOT"/*/tree 2>/dev/null | head -n 1 || true)"
          if [ -z "$tree" ]; then
            echo "::error::no assembled build tree under $OUT_ROOT; build-kernel must have run first"
            exit 1
          fi
          work="$(dirname "$tree")"
          for wanted in "$work/kernel/kernel.macho" "$work/payload/payload.img"; do
            if [ ! -f "$wanted" ]; then
              # not_run and exit 0, not exit 1: the chain did not break, it was
              #  refused for a missing input, and a failed step would read as the
              #  former.  The step is continue-on-error either way and the second
              #  pass keys on os_root_status, so nothing downstream is misled.
              echo "os_root_status=not_run" >> "$GITHUB_OUTPUT"
              echo "::error::the chain's first sub-step needs $wanted, which the first build pass did not produce."
              echo "::error::build-storage-abi.py:18,31 boots that kernel from the payload volume, so the chain cannot start without it."
              case "$(basename "$wanted")" in
                kernel.macho)
                  echo "::error::build-kernel recorded not_run -- see the build-kernel entry in first-pass-build-report.json for its reason." ;;
                payload.img)
                  echo "::error::build-payload loads DarwinBoot.efi as a driver, and plan_steps gates build-bootloader at n>=3: a stage below M3 plans a payload stage with no bootloader to load. Trigger this workflow with stage=M3 or later." ;;
              esac
              exit 0
            fi
            echo "chain: $(basename "$wanted") present ($(wc -c <"$wanted" | tr -d ' ') bytes)"
          done
          # (3b) the display driver's checkout, forced to the commit the lock pins.
          #
          #      MEASURED, on run 40187668943 (stage M4), which is the run that got
          #      further into the owner root chain than any before it: storage-abi,
          #      both signed policies (806400 SystemOS blocks verified by real
          #      C/RSA), the verified-root probe, NativeVirtioBlock and NativeRamBlock
          #      in verified mode, the 1 GiB OwnerData container
          #      (675761EF-5622-4F5B-89DF-4CAD5BA456F6) and the packed ramdisk all
          #      passed -- and then the chain died at its step 9 with
          #
          #        NativeLegacyDisplay.cpp:206:59: error: only virtual member
          #          functions can be marked 'override'
          #        NativeLegacyDisplay.cpp:207:13: error: no member named
          #          'getRefreshAttributes' in 'IOMobileFramebufferLegacy'
          #
          #      `unixnu fetch` initialises drivers/NativeMobileDisplay at the commit
          #      UniXNU's own gitlink names (c031d882, "feat(display): report the
          #      panel refresh rate"), but the pinned device repository's
          #      build-native-legacy-display.py generates
          #      OriginalLegacyFramebufferABI.h from a fixed slot table with no
          #      entry for slot 301 -- and then refuses the override anyway:
          #      "Only qualified own methods and guarded leaves override".  The
          #      device repository is at its only branch's tip (97b75b1), so there
          #      is no newer commit to move to; the display submodule has to move
          #      back.  The lock's `commit` is that commit and `gitlink_commit`
          #      records what UniXNU actually pins, so the divergence is in one
          #      auditable place instead of being a silent local edit.
          #
          #      Forcing it HERE rather than editing vendor/ is the same reasoning
          #      as step_build_kernel's CONFIG_XNU_BUILD_ARCHIVES divergence: the
          #      runner clones vendor/ fresh at the locked commit every run, so a
          #      local edit would not survive and committing one would make the pin
          #      exist twice.
          display_commit="$(python3 -c '
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          entry = next((e for e in lock.get("submodules") or []
                        if e.get("path") == "drivers/NativeMobileDisplay"), None)
          print((entry or {}).get("commit") or "")
          ' "$LOCK_PATH")"
          display_gitlink="$(python3 -c '
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          entry = next((e for e in lock.get("submodules") or []
                        if e.get("path") == "drivers/NativeMobileDisplay"), None)
          print((entry or {}).get("gitlink_commit") or "")
          ' "$LOCK_PATH")"
          if [ -z "$display_commit" ]; then
            echo "::error::$LOCK_PATH pins no commit for drivers/NativeMobileDisplay, so the display driver the chain compiles is not reproducible."
            exit 1
          fi
          display="$tree/drivers/NativeMobileDisplay"
          display_head="$(git -C "$display" rev-parse HEAD 2>/dev/null || true)"
          if [ "$display_head" != "$display_commit" ]; then
            echo "chain: moving drivers/NativeMobileDisplay from ${display_head:-<absent>} to $display_commit"
            if [ -n "$display_gitlink" ]; then
              echo "chain:   $LOCK_PATH records UniXNU's gitlink as $display_gitlink; this is the recorded divergence, not an accident"
            fi
            if ! git -C "$display" fetch --depth=1 origin "$display_commit"; then
              echo "::error::could not fetch drivers/NativeMobileDisplay at $display_commit"
              exit 1
            fi
            git -C "$display" checkout --detach FETCH_HEAD
          else
            echo "chain: drivers/NativeMobileDisplay already at $display_commit"
          fi
          display_head="$(git -C "$display" rev-parse HEAD)"
          if [ "$display_head" != "$display_commit" ]; then
            echo "::error::drivers/NativeMobileDisplay is at $display_head, not the locked $display_commit"
            exit 1
          fi
          if [ ! -f "$display/NativeLegacyDisplay.cpp" ]; then
            echo "::error::$display_commit carries no NativeLegacyDisplay.cpp"
            exit 1
          fi
          echo "chain: drivers/NativeMobileDisplay $display_commit ($(git -C "$display" log -1 --format=%s))"
          if ! command -v qemu-system-aarch64 >/dev/null 2>&1; then
            echo "qemu-system-aarch64 absent; installing it (build-storage-abi.py:18 boots the candidate once)"
            brew install qemu
          fi
          # (4) run it.  From the tree, not from the device repository:
          #     build-os-root.py derives ROOT from __file__ and qemu_esp.py
          #     derives WORK from ROOT.parent, so running the device repository's
          #     copy would look for the kernel at vendor/kernel/ and write its
          #     outputs into the checkout.
          log="$IPSW_WORK_DIR/os-root.log"
          echo "chain: running build-os-root.py --ipsw $refer --openssl-prefix $OPENSSL_PREFIX (cwd $tree)"
          # Retried, because the chain RESUMES rather than restarts.  Every one of
          # its steps is guarded by "is my output already on disk", so a second
          # invocation skips both RSA block-verification policies (1,483,785 OS
          # blocks and 806,400 SystemOS blocks), the verified-root probe and both
          # block drivers and goes straight back to the step that failed.  That
          # makes a retry seconds rather than minutes, which is what makes it the
          # right response to the failure this step actually hit.
          #
          # MEASURED on run 40362810790, the first run after the tree/ path fix.
          # The chain reached build-os-root.py:109 and died on a bare
          # StopIteration --
          #
          #   container = next(entry['ContainerReference'] for entry in listing['Containers']
          #                    if any(s['DeviceIdentifier'] == store
          #                           for s in entry.get('PhysicalStores', [])))
          #
          # -- that is, `diskutil apfs list -plist` named no APFS container whose
          # physical store was the device `hdiutil attach` had just returned.  The
          # same pinned script, the same inputs and the same runner image produced
          # a real 1 GiB seed on run 40339678974, and THAT run's log shows the
          # container it found was a different device from the store it matched:
          # "Resizing APFS Container designated by APFS Container Reference disk34"
          # followed by "The specific APFS Physical Store being resized is disk33".
          # So the lookup depends on how macOS lays the raw image out, and the
          # script takes `system-entities[0]` without checking which of the two it
          # got.  The device repository is a third-party pin and cannot be edited
          # here -- the display-driver divergence above is worked around the same
          # way, in this step rather than in vendor/ -- so the response is to
          # retry, and to leave behind the listings the failing line reads if the
          # retries run out.  This run could not say which half of that went
          # wrong, because the script dumps neither query.
          : > "$log"
          attempt=1
          max_attempts=3
          until ( cd "$tree" && python3 scripts/build-os-root.py \
                  --ipsw "$refer" --openssl-prefix "$OPENSSL_PREFIX" ) 2>&1 | tee -a "$log"; do
            {
              echo "== chain attempt $attempt of $max_attempts failed. The two queries the failing line reads:"
              echo "-- diskutil apfs list -plist"
              diskutil apfs list -plist 2>&1 || true
              echo "-- diskutil list"
              diskutil list 2>&1 || true
              echo "-- hdiutil info"
              hdiutil info 2>&1 | head -n 40 || true
            } >> "$log"
            if (( attempt >= max_attempts )); then
              echo "::error::build-os-root.py failed $max_attempts times; see $log"
              exit 1
            fi
            echo "chain: attempt $attempt failed; the chain resumes from its own outputs, retrying ($(( attempt + 1 ))/$max_attempts)"
            attempt=$(( attempt + 1 ))
            sleep 5
          done
          # (5) the three inputs the kernel stage switches on, and the two the
          #     payload stage needs.  Named here so a chain that "succeeded" but
          #     left nothing is a failure rather than a silent one.
          seed="$DEVICE_REPO/.cache/firmware/owner-data/seed.json"
          for wanted in \
            "$seed" \
            "$tree/build/native-virtio-block-verified-bundle/libNativeVirtioBlock.a" \
            "$tree/build/verified-root-os-xnu-bundle/libVerifiedRootProbe.a" \
            "$tree/build/original-static-system-trust/original-static-system.bundle" \
            "$DEVICE_REPO/.cache/firmware/owner-data/owner-data-1g.dbr"; do
            if [ ! -f "$wanted" ]; then
              echo "::error::the chain ran but did not produce $wanted"
              exit 1
            fi
            echo "chain: produced $(basename "$wanted")"
          done
          echo "os_root_status=pass" >> "$GITHUB_OUTPUT"
          echo "== os root: PASS (the owner root chain is on disk; build-kernel below builds qemu_root_defconfig)"
        continue-on-error: true

      # The container skeleton, which the chain does not create and the OS image
      # does not ship.
      #
      # MEASURED on 2026-10-27 against this build's own inputs: the OS root
      # volume (044-76040-038.raw, APFS at file offset 0x4400) has NO catalog
      # entry named `containers` anywhere -- not one, across 303,965 inodes and
      # 349,284 directory records -- and its /private/var holds 29 entries.  The
      # seed the chain produced from it holds the same 29, plus `.fseventsd` and
      # `keybags`, minus `staged_system_apps`, which is exactly the two
      # deviations prepare-owner-data-fixture.py documents.  So the seed is a
      # FAITHFUL copy and `/private/var/containers` is missing from BOTH, because
      # on a device it is created at first boot and an offline seed never gets
      # one.
      #
      # The cost of leaving it out is measured in the guest: the kernel cached
      # 24 container paths (15 UUID-shaped, under
      # /private/var/containers/Data/System/<UUID> and
      # /private/var/containers/Shared/SystemGroup/<UUID>), and the log carries
      # 65 `Sandbox: no system container path found` / `no system group container
      # path found` / `no application group container found` denials across 35
      # distinct messages.  SpringBoard then crash-looped through 16 instances
      # and never emitted a line of its own.
      #
      # `containermanagerd` is not the fix here: it was ALIVE in the guest (pids
      # 64 and 92, state `run`) and the Data volume was mounted READ-WRITE (two
      # tx_flush transactions on disk5, xid 28 and xid 48) -- and the volume's
      # own spaceman reported 1,442 of 262,144 blocks used, against the seed's
      # own extents ending at block 1,444.  It created nothing.  The directory
      # has to be in the seed.
      #
      # This is upstream's own answer to the same problem, reused rather than
      # reinvented: prepare-offline-data.py creates the skeleton with the safety
      # property that no original file or symlink may change, and
      # seed-data-skip-setup.py does the unpack/attach/repack cycle on a packed
      # seed.  This step is that cycle for OUR seed, with both directory lists.
      #
      # The volume UUID is the one thing that must not move.  material_manifest
      # --verify re-derives it from the seed's own resident volume superblock and
      # requires it to equal the UUID the kernel was built with
      # (implementation-plan fact 88 measured the failure of a mismatch: the
      # guest's native_owner_data_stage stayed 0).  The script reads it before
      # and after with diskutil and refuses a change; the verify then checks it
      # again from the seed's bytes.  Two independent checks, because a
      # provisioning step that moved the UUID would produce a seed that mounts
      # and then binds to nothing.
      - name: Provision the Data seed's runtime directories
        id: provision
        if: always() && steps.os_root.outputs.os_root_status == 'pass'
        env:
          DEVICE_REPO: vendor/UniXNU-qemu
        # continue-on-error for the same reason os_root carries it: the evidence
        # and the delivery matter most on a run that did not succeed, and a
        # provisioning failure leaves the ORIGINAL seed on disk (the step only
        # replaces it after the script has succeeded), so what still ships is a
        # valid matched build that simply still lacks the container skeleton.
        # The verdict step below is what stops that being read as success.
        continue-on-error: true
        run: |
          set -euo pipefail
          owner="$DEVICE_REPO/.cache/firmware/owner-data"
          seed="$owner/owner-data-1g.dbr"
          seed_json="$owner/seed.json"
          if [ ! -f "$seed" ]; then
            echo "::error::the chain reported PASS but $seed is not on disk"
            exit 1
          fi
          # The original is kept, under a name that says what it is.  It is
          # Apple-derived like the seed is, and the "Remove the extracted
          # firmware material" step removes this whole directory, so keeping it
          # costs nothing on the runner's disk -- and it is what makes this step
          # reversible and its effect measurable rather than asserted.
          cp "$seed" "$owner/owner-data-1g.dbr.unprovisioned"
          echo "provision: original seed $(wc -c <"$seed" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$seed" | cut -d' ' -f1)"

          # Written to a fresh name and moved over, never written in place: the
          # script refuses to overwrite its --out, and bypassing that guard to
          # save an mv is how a half-written seed ends up under the real role's
          # name.
          staged="$owner/owner-data-1g.dbr.provisioned"
          rm -f "$staged"
          python3 scripts/macos/provision-data-seed.py \
            --seed "$owner/owner-data-1g.dbr.unprovisioned" \
            --out "$staged" \
            --report "$owner/provision-report.json"
          mv "$staged" "$seed"
          # The signal the verdict step reads, and the only record of the swap
          # that survives: the "Remove the extracted firmware material" step
          # deletes this whole directory, including provision-report.json,
          # before any verdict runs.  An output rather than a file for exactly
          # that reason.
          echo "provision_swapped=yes" >> "$GITHUB_OUTPUT"

          # An independent check, in the shell, against the chain's own record.
          # The script already refused a UUID change; this is the second reader,
          # and it compares against seed.json rather than against the script's
          # opinion of itself.
          before_uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["volume_uuid"])' "$owner/provision-report.json")"
          chain_uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("volume_uuid",""))' "$seed_json" 2>/dev/null || true)"
          if [ -n "$chain_uuid" ] && [ "$before_uuid" != "$chain_uuid" ]; then
            echo "::error::provisioning moved the volume UUID: $chain_uuid -> $before_uuid. The kernel was built for $chain_uuid, so this seed must not be booted"
            exit 1
          fi
          if [ -n "$chain_uuid" ]; then
            echo "provision: volume UUID still $before_uuid (the chain's own seed.json agrees)"
          else
            echo "provision: volume UUID still $before_uuid (seed.json records no UUID, so only the script's own before/after check applies)"
          fi
          echo "provision: provisioned seed $(wc -c <"$seed" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$seed" | cut -d' ' -f1)"
          echo "provision_status=pass" >> "$GITHUB_OUTPUT"

      # The volumes are the chain's inputs and nothing else's, and they are 7.88
      # GiB.  Deleting them here -- before the second build pass, whose preflight
      # checks the same filesystem -- is what makes that pass possible at all,
      # and it is also the last moment they are needed: the chain has signed both
      # of them and detached them, and the kernel stage consumes the archives and
      # the seed, never the DMGs.
      - name: Remove the root chain's disk volumes
        if: always() && steps.os_root.outputs.os_root_status == 'pass'
        run: |
          set -euo pipefail
          volumes="vendor/UniXNU-qemu/.cache/firmware/target-volumes"
          if [ -d "$volumes" ]; then
            du -sh "$volumes" 2>/dev/null || true
            rm -f "$volumes"/*.dmg
            echo "removed the OS and SystemOS volumes from $volumes (Apple firmware material, PRD 12)"
          fi
          left=0
          for volume in "$volumes"/*.dmg; do
            [ -f "$volume" ] && left=$((left + 1))
          done
          if [ "$left" -ne 0 ]; then
            echo "::error::$left disk volume(s) survived removal; Apple firmware material would stay on the runner"
            exit 1
          fi

      # The second invocation the chain's own comment asks for.  Same command,
      # same inputs, same stage: the plan is a pure function of the stage, so the
      # only thing that has changed is what is on disk -- and that is exactly what
      # step_build_kernel's defconfig switch keys on.  build-os-root records
      # 'skipped' here (its outputs are already on disk and re-running it would
      # spend the volumes' disk again), build-kernel builds qemu_root_defconfig,
      # and build-payload rebuilds the ESP around the kernel that can mount a root
      # volume.
      - name: Run macOS build again (qemu_root_defconfig, PRD 8.1 root chain)
        id: build_root
        if: steps.os_root.outputs.os_root_status == 'pass'
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          BUILD_OUTPUT_DIR: build-output
          STAGE_DIR: staged
          BUILD_LOG: macos-build-root.log
          TOOLCHAIN_CACHE_DIR: ~/.cache/unipad-macos-build
          DEVICETREE_PATH: ipsw-work/devicetree
          KERNELCACHE_PATH: ipsw-work/kernelcache.macho
          BUILD_PAYLOAD: '1'
          # The GPU addon blob, when the chain above produced one.  The
          # environment spelling of --gpu-addon; build-macos.sh reads it when
          # the flag is absent and the flag wins when both are present, exactly
          # as BUILD_PAYLOAD does.  Empty today, and an empty value has to reach
          # the script as "no --gpu-addon" -- which is what makes its payload
          # step say so in its own words instead of dying on a missing path.
          UNIXNU_GPU_ADDON: ${{ steps.addon.outputs.addon || steps.mesa.outputs.addon || '' }}
          # The passphrase the material-manifest stage encrypts the Data seed
          # with (`openssl enc -aes-256-gcm -pbkdf2 -salt -pass env:`).  It is a
          # secret, so it is never echoed and never written to disk by this
          # script: openssl reads it from the environment and the ciphertext is
          # the only thing that leaves the runner.  Unset (a fork, a PR from a
          # branch with no access to the secret) means the stage records that
          # the seed was NOT encrypted, and the seed has to be collected from
          # the runner directly -- the manifest still verifies, because the
          # binding it checks is between the seed and the kernel, not between
          # the seed and a key.
          MATERIAL_DELIVERY_KEY: ${{ secrets.MATERIAL_DELIVERY_KEY }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          echo "started_at=$started" >> "$GITHUB_OUTPUT"
          # The first pass's own ledger, kept before this one overwrites it.
          #
          # Both passes write the same paths -- build-report.json,
          # stage-result.json, build.log -- because they share one --out and one
          # build tree, which is the whole point.  What that costs is the first
          # pass's record, and the first pass's record is the one that says
          # build-os-root was not_run and build-kernel built qemu_defconfig.
          # Losing it would leave the run able to show only its final state, so
          # the fact that the chain was ever absent would stop being visible.
          #
          # They are copied to the repository root rather than beside the
          # originals for two reasons: the staging step scans BUILD_OUTPUT_DIR
          # only, and these are evidence rather than deliverables; and a second
          # build-report.json inside that directory would be a name the staging
          # step's GENERATED list already claims.
          for record in build-report.json stage-result.json; do
            if [ -f "$BUILD_OUTPUT_DIR/$record" ]; then
              cp "$BUILD_OUTPUT_DIR/$record" "first-pass-$record"
              echo "kept the first pass's $record at first-pass-$record"
            fi
          done
          declare -a kernel_args=()
          if [ -f "$KERNELCACHE_PATH" ]; then
            kernel_args+=(--kernelcache "$KERNELCACHE_PATH")
          fi
          if [ -f "$DEVICETREE_PATH" ]; then
            kernel_args+=(--devicetree "$DEVICETREE_PATH")
          fi
          declare -a payload_args=()
          if [ "${BUILD_PAYLOAD:-0}" = '1' ]; then payload_args+=(--payload); fi
          declare -a uefi_args=()
          if [ -d vendor/uefi-sheng ]; then uefi_args+=(--uefi vendor/uefi-sheng); fi
          # The owner root chain's two outputs, which only THIS pass can have.
          #
          # build-os-root.py:174 is the chain's own last line, and it is the
          # command it says to run next:
          #
          #   unixnu build payload ... --trust-cache {trust} --data-ramdisk {seed}
          #
          # where trust is <tree>/build/original-static-system-trust/
          # original-static-system.bundle (build-os-root.py:139) and seed is
          # <tree>/.cache/firmware/owner-data/owner-data-1g.dbr
          # (build-os-root.py:48,96).  The chain's own header says what the
          # trust cache is for, in the device repository's words
          # (build-os-root.py:26-27): "Without it AMFI refuses to run launchd
          # (exit reason namespace 9, EXEC, code 8, SECURITY_POLICY)."
          #
          # Neither was passed anywhere, so this pass rebuilt the ESP around a
          # kernel that can finally mount a root volume and still could not
          # start a userland.  That is the worst shape this bug could take: it
          # looks like progress.
          #
          # Only when the chain actually produced them.  This step is gated on
          # os_root_status == 'pass', so they should be there -- but a glob that
          # silently expands to nothing and a flag that is silently omitted are
          # the same failure, so the absence is said out loud.
          declare -a root_args=()
          root_tree="$(ls -d build-output/unixnu-out/*/tree 2>/dev/null | head -n 1 || true)"
          trust_cache="$root_tree/build/original-static-system-trust/original-static-system.bundle"
          data_ramdisk="vendor/UniXNU-qemu/.cache/firmware/owner-data/owner-data-1g.dbr"
          if [ -f "$trust_cache" ]; then
            root_args+=(--trust-cache "$trust_cache")
            echo "build: the owner root chain's trust cache is at $trust_cache ($(wc -c <"$trust_cache" | tr -d ' ') bytes)"
          else
            echo "::warning::the owner root chain produced no trust cache at $trust_cache; this payload's kernel cannot exec launchd (build-os-root.py:26-27)"
          fi
          if [ -f "$data_ramdisk" ]; then
            root_args+=(--data-ramdisk "$data_ramdisk")
            echo "build: the owner root chain's Data ramdisk is at $data_ramdisk ($(wc -c <"$data_ramdisk" | tr -d ' ') bytes)"
          else
            echo "::warning::the owner root chain produced no Data ramdisk at $data_ramdisk"
          fi
          bash scripts/macos/build-macos.sh \
            --experiment "$EXPERIMENT_ID" \
            --stage "$STAGE" \
            --target "$PAYLOAD_TARGET" \
            --out "$BUILD_OUTPUT_DIR" \
            --unixnu vendor/UniXNU \
            --device vendor/UniXNU-qemu \
            ${uefi_args[@]+"${uefi_args[@]}"} \
            ${kernel_args[@]+"${kernel_args[@]}"} \
            ${payload_args[@]+"${payload_args[@]}"} \
            ${root_args[@]+"${root_args[@]}"} \
            2>&1 | tee "$BUILD_LOG"
          finished=$(date -u +%s)
          echo "finished_at=$finished" >> "$GITHUB_OUTPUT"
          echo "root-chain build duration: $((finished - started))s"
          # The defconfig the kernel was actually built with, read back out of
          # the run's own log rather than asserted: a reader of the job summary
          # should not have to trust this step's opinion of what happened.
          if grep -q 'building qemu_root_defconfig' "$BUILD_LOG"; then
            echo "root_kernel=true" >> "$GITHUB_OUTPUT"
            echo "build: the kernel was built from qemu_root_defconfig (the owner root chain is on disk)"
          else
            echo "root_kernel=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no qemu_root_defconfig line in $BUILD_LOG; see the build-os-root and build-kernel entries in build-report.json"
          fi

      # The build log is evidence, and it is the evidence that matters most when
      # the build fails -- which is exactly when the staging step below is
      # skipped and nothing is uploaded.  Without this, a link failure is a
      # one-line "linker command failed with exit code 1" in the job log and the
      # actual linker diagnostic sits unread on a runner that is about to be
      # destroyed.  Measured on run 40066923763: the kernel reached its link
      # step for the first time and the reason was not recoverable.
      - name: Upload the build logs (always, success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-output/unixnu-out/*/logs/
            build-output/build.log
            macos-build.log
            macos-build-root.log
            first-pass-build-report.json
            first-pass-stage-result.json
            ipsw-work/ipsw.log
            ipsw-work/chain.log
            ipsw-work/os-root.log
            build-output/bootstrap-mesa.log
            build-output/bootstrap-metal2vulkan.log
            build-output/build-gpu-addon.log
            build-output/addon-*.log
          retention-days: 30
          if-no-files-found: warn

      # PRD 12: the published kernelcache is Apple material.  It is removed
      # unconditionally -- `always()`, so a failed or cancelled build leaves
      # nothing behind either -- because "temporary" that only applies on
      # success is a cache nobody audits.
      #
      # This step sits AFTER the build, and that ordering is the whole point:
      # an `if: always()` step still runs at its position in the sequence, so
      # placing it next to the acquisition would delete the kernelcache before
      # the build that needs it.  The first draft did exactly that.
      #
      # What else leaves with it, and why each is here rather than trusted to a
      # pattern:
      #
      # * ``build-output/unixnu-out/ipsw/`` -- the StaticTrustCache IM4P the chain
      #   reads from beside the driver's own cache, and the decompressed original
      #   kernelcache published there for ``build-platform-power.py``.  It is
      #   inside BUILD_OUTPUT_DIR, so the staging step would see it; both are
      #   excluded there by name (``*.trustcache``, ``*.decompressed``), but an
      #   exclusion is a record of a file that existed, and the file should not
      #   exist at all.
      # * ``vendor/UniXNU-qemu/.cache/firmware/target-volumes/*.dmg`` -- the OS and
      #   SystemOS volumes.  The step above removes them when the chain succeeded;
      #   this is the unconditional version, for the run where it did not.
      # * ``vendor/UniXNU-qemu/.cache/firmware/owner-data/`` -- the Data seed and
      #   its report, both derived from the OS volume's initial /private/var.
      #   Outside BUILD_OUTPUT_DIR so the staging step never sees it, which makes
      #   this the only thing standing between it and the runner's disk.
      - name: Remove the extracted firmware material
        if: always()
        run: |
          set -euo pipefail
          if [ -d ipsw-work ]; then
            du -sh ipsw-work 2>/dev/null || true
            rm -rf ipsw-work
            echo "removed ipsw-work/ (Apple firmware material, PRD 12)"
          fi
          if [ -e ipsw-work ]; then
            echo "::error::ipsw-work/ could not be removed; Apple firmware material would survive the job"
            exit 1
          fi
          if [ -d build-output/unixnu-out/ipsw ]; then
            rm -rf build-output/unixnu-out/ipsw
            echo "removed build-output/unixnu-out/ipsw/ (the StaticTrustCache IM4P, PRD 12)"
          fi
          volumes="vendor/UniXNU-qemu/.cache/firmware/target-volumes"
          if [ -d "$volumes" ]; then
            rm -f "$volumes"/*.dmg
            echo "removed the OS and SystemOS volumes from $volumes (Apple firmware material, PRD 12)"
          fi
          left=0
          for volume in "$volumes"/*.dmg; do
            [ -f "$volume" ] && left=$((left + 1))
          done
          if [ "$left" -ne 0 ]; then
            echo "::error::$left disk volume(s) survived removal; Apple firmware material would survive the job"
            exit 1
          fi
          owner="vendor/UniXNU-qemu/.cache/firmware/owner-data"
          if [ -d "$owner" ]; then
            du -sh "$owner" 2>/dev/null || true
            rm -rf "$owner"
            echo "removed $owner/ (the owner Data seed, derived from the OS volume, PRD 12)"
          fi

      # PRD 8.2 step 4 / 8.3: stage ONLY allowlisted roles, hash everything, and
      # build the machine-readable artifact-manifest.json (PRD 8.1).  Default
      # deny: an unrecognised file is excluded and recorded, never uploaded.
      # `if: always()` because a FAILED build is when its evidence matters most,
      # and the default `success()` threw all of it away: run 40094234507 failed
      # in build-payload, and because this step was skipped the UniXNU.efi that
      # build-bootloader had already produced and recorded was never staged,
      # never uploaded, and never collected.  The stage's own default deny still
      # refuses a build that produced nothing but logs (PRD 7.4), so "always"
      # publishes evidence, not a green light.
      - name: Stage allowlisted artifacts and build artifact-manifest.json
        if: always()
        id: stage
        env:
          BUILD_OUTPUT_DIR: build-output
          STAGE_DIR: staged
          BUILD_LOG: macos-build.log
          REPORT_DIR: build
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          # The commits the LOCK pinned and the acquisition step fetched, not the
          # ones typed into the dispatch form: the manifest attests to what was
          # built (PRD 8.1).  The inputs stay the fallback for a run whose
          # acquisition step produced no outputs -- which is a failed run.
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          UNIXNU_REPO: ${{ steps.sources.outputs.unixnu_repo || '' }}
          DEVICE_REPO: ${{ steps.sources.outputs.device_repo || '' }}
          LOCK_SHA256: ${{ steps.sources.outputs.lock_sha256 || '' }}
          LOCK_FROZEN: ${{ steps.sources.outputs.lock_frozen || '' }}
          STAGE: ${{ inputs.stage }}
          SYSTEM_BUILD: ${{ inputs.system_build }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode_version }}
          CLANG_VERSION: ${{ steps.toolchain.outputs.clang_version }}
          PYTHON_VERSION: ${{ steps.toolchain.outputs.python_version }}
          BUILD_STARTED_AT: ${{ steps.build.outputs.started_at }}
          BUILD_FINISHED_AT: ${{ steps.build.outputs.finished_at }}
          MAX_FILE_BYTES: '2147483648'
        run: |
          python3 - <<'PY'
          """Hash build outputs, stage allowlisted roles, write artifact-manifest.json.

          PRD 8.1 (artifact contract) and 8.2 step 4 (never upload full system
          images or private data).  Roles come from build-output/artifact-roles.json
          when the build script emits it, otherwise from a conservative name table;
          anything unmatched is excluded (default deny) and recorded in the
          manifest's "excluded" list.
          """
          import fnmatch
          import hashlib
          import json
          import os
          import shutil
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          OUT = Path(os.environ.get("BUILD_OUTPUT_DIR", "build-output"))
          STAGE = Path(os.environ.get("STAGE_DIR", "staged"))
          BUILD_LOG = Path(os.environ.get("BUILD_LOG", "macos-build.log"))
          REPORT = Path(os.environ.get("REPORT_DIR", "build"))
          TARGET = (os.environ.get("PAYLOAD_TARGET", "tcg") or "tcg").strip().lower()
          MAX_FILE_BYTES = int(os.environ.get("MAX_FILE_BYTES", "2147483648"))

          ALLOWED_ROLES = ("firmware", "bootloader", "kernel", "devicetree", "auxiliary")
          DENIED_ROLES = ("system-image", "private-data")
          GENERATED = ("artifact-manifest.json", "build-report.json")
          PRIVATE_PATTERNS = (
              "*.ipsw", "*.dmg", "*.img", "*.qcow2", "*.qcow", "*.raw", "*.sparseimage",
              "*.vmdk", "*.vhd", "*.vdi", "*.iso", "*.p12", "*.pfx", "*.mobileprovision",
              "*.pem", "*.key", "*.cer", "*.mobileconfig", "*.trustcache", "*.seed",
              # The decompressed original kernelcache, which the chain's
              # acquisition publishes into out/ipsw/<build>/ so that
              # build-platform-power.py can audit the AMFI/PMGR contract on any
              # pass that already has a reference kernel.  It is an Apple
              # binary, and ROLE_RULES maps "kernelcache" to the allowlisted
              # role "kernel" -- so without this line the default-deny below
              # would let it through on name alone, and the only thing standing
              # between it and the artifact upload would be the ordering of the
              # step that removes out/ipsw/.  PRD 12 does not get to rest on a
              # step order.
              "*.decompressed",
              # build-output/private/ is the material delivery directory that
              # build-macos.sh's material-manifest stage stages into: the packed
              # Data seed, which is the OS volume's own /private/var (PRD 12),
              # and material-manifest.json, which binds that seed to the kernel
              # built with its volume UUID.  The manifest is not itself Apple
              # material, but it is the index of Apple material -- it names the
              # seed, its measured size and its digest -- so it travels the same
              # channel as the seed rather than the public artifact path, and a
              # reader must never be able to fetch the index and assume the
              # material it points at was fetched too.  *.enc is the encrypted
              # form of the same delivery, uploaded separately by the
              # "Deliver the encrypted material" step below.
              "private/*", "*.enc",
          )
          METADATA_SUFFIXES = {".json", ".txt", ".log", ".md", ".cfg", ".toml", ".csv", ".plist"}
          ROLE_RULES = (
              ("kernel", ("kernelcache", "kernel-cache", "kernel_cache", "kernel")),
              ("devicetree", ("devicetree", "device-tree", "device_tree", ".dtb")),
              ("firmware", ("firmware", "uefi", "bootrom", "bios")),
              ("bootloader", ("bootloader", "boot-loader", "unixnu", "darwinboot", "boot")),
          )

          problems = []
          warnings = []

          def sha256_of(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          #: The one buffer size this step ever allocates for a copy.  The staging
          #: path can be handed a multi-GB kernel or disk image -- MAX_FILE_BYTES
          #: is 2 GiB -- so a staged copy is streamed in chunks and never held
          #: whole, whatever the file turns out to be.
          COPY_CHUNK_BYTES = 1024 * 1024

          class _HashingWriter:
              """A binary writer that digests what it is handed, as it is handed it.

              ``shutil.copyfileobj`` only ever calls ``write``, so this is the
              whole file interface a streaming copy needs.  It exists so the
              digest of a staged copy comes from the bytes that were written,
              rather than from opening the copy again and reading it back: the
              staged file is evidence, and reading it a second time to check it
              is the whole file twice on a path that can carry a kernel image.
              """

              def __init__(self, handle):
                  self._handle = handle
                  self.digest = hashlib.sha256()
                  self.written = 0

              def write(self, chunk):
                  self.digest.update(chunk)
                  self.written += len(chunk)
                  return self._handle.write(chunk)

              def __enter__(self):
                  return self

              def __exit__(self, *exc_info):
                  self._handle.close()
                  return False

          def copy_and_hash(src, dst):
              """Stream ``src`` into ``dst``; return ``(sha256, bytes written)``.

              The chunk length is passed positionally on purpose: the parameter
              has been renamed between Python versions, and a runner's python3
              is not this repository's to pin.
              """
              with src.open("rb") as reader, _HashingWriter(dst.open("wb")) as writer:
                  shutil.copyfileobj(reader, writer, COPY_CHUNK_BYTES)
              return writer.digest.hexdigest(), writer.written

          def role_from_table(rel):
              low = rel.lower()
              for role, tokens in ROLE_RULES:
                  if any(token in low for token in tokens):
                      return role
              if Path(rel).suffix.lower() in METADATA_SUFFIXES:
                  return "auxiliary"
              return None

          roles_map = {}
          roles_file = OUT / "artifact-roles.json"
          if roles_file.is_file():
              try:
                  loaded = json.loads(roles_file.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      for key, value in loaded.items():
                          if isinstance(value, str) and value in ALLOWED_ROLES + DENIED_ROLES:
                              roles_map[key.replace("\\", "/")] = value
                  warnings.append("using build-output/artifact-roles.json for role assignment")
              except (OSError, json.JSONDecodeError) as exc:
                  warnings.append(f"artifact-roles.json unreadable ({exc.__class__.__name__}); using the name table")

          if not OUT.is_dir():
              print(f"::error::build output directory '{OUT.as_posix()}' does not exist")
              sys.exit(1)

          entries = []
          excluded = []
          for path in sorted(OUT.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(OUT).as_posix()
              if rel in GENERATED or rel == "artifact-roles.json":
                  continue
              size = path.stat().st_size
              role = roles_map.get(rel) or role_from_table(rel)
              reason = None
              if role in DENIED_ROLES:
                  reason = f"role '{role}' is denied for upload (PRD 8.2 step 4)"
              elif role is None:
                  reason = "role is not on the allowlist (default deny)"
              elif role not in ALLOWED_ROLES:
                  reason = f"role '{role}' is not allowlisted"
              if reason is None and any(fnmatch.fnmatch(rel.lower(), pat) for pat in PRIVATE_PATTERNS):
                  reason = "filename matches a system-image/private-data pattern"
              if reason is None and "local-private" in rel.lower():
                  reason = "path is under local-private/ (PRD 12)"
              if reason is None and size == 0:
                  reason = "zero-size file"
              if reason is None and size > MAX_FILE_BYTES:
                  reason = f"file larger than {MAX_FILE_BYTES} bytes (PRD 8.4 prefers small artifacts)"
              if reason is not None:
                  excluded.append({"path": rel, "role": role, "size_bytes": size, "reason": reason})
                  continue
              entries.append({
                  "name": rel,
                  "path": rel,
                  "role": role,
                  "sha256": sha256_of(path),
                  "size_bytes": size,
                  "arch": None,
              })

          # The build log is evidence rather than a build product: include it
          # explicitly under a stable relative name so the manifest never carries
          # an absolute host path.
          log_name = BUILD_LOG.name or "macos-build.log"
          if log_name not in {entry["name"] for entry in entries} and BUILD_LOG.is_file() and BUILD_LOG.stat().st_size > 0:
              entries.append({
                  "name": log_name,
                  "path": log_name,
                  "role": "auxiliary",
                  "sha256": sha256_of(BUILD_LOG),
                  "size_bytes": BUILD_LOG.stat().st_size,
                  "arch": None,
              })
          elif BUILD_LOG.is_file() and BUILD_LOG.stat().st_size > 0:
              warnings.append(f"a build-output file is already named '{log_name}'; the build log was not staged twice")
          else:
              warnings.append("build log is missing or empty; the upload will not contain build evidence")

          # A build that produced no firmware/bootloader/kernel/devicetree is a
          # failed build even if it left logs: evidence alone must never pass
          # (PRD 7.4).
          if not any(entry["role"] != "auxiliary" for entry in entries):
              print("::error::no allowlisted payload artifact was produced, only evidence/log files: nothing to deliver (PRD 7.4, 8.2 step 4)")
              print(f"::error::excluded files: {[item['path'] for item in excluded]}")
              REPORT.mkdir(parents=True, exist_ok=True)
              (REPORT / "staging-report.json").write_text(
                  json.dumps({"status": "fail", "excluded": excluded, "problems": problems, "warnings": warnings}, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              sys.exit(1)

          STAGE.mkdir(parents=True, exist_ok=True)
          for entry in entries:
              src = BUILD_LOG if entry["name"] == log_name else OUT / entry["path"]
              dst = STAGE / entry["path"]
              dst.parent.mkdir(parents=True, exist_ok=True)
              # Copied in chunks and hashed from the bytes as they were written.
              # ``dst.write_bytes(src.read_bytes())`` held the whole file in
              # memory to move it and then re-read the copy to hash it, which is
              # the file three times over -- and this step runs on every build.
              staged_sha256, staged_bytes = copy_and_hash(src, dst)
              if staged_sha256 != entry["sha256"] or staged_bytes != entry["size_bytes"]:
                  problems.append(f"staged copy of {entry['path']} does not match its hash/size")
              if staged_bytes == 0:
                  problems.append(f"staged copy of {entry['path']} is zero bytes")

          started = os.environ.get("BUILD_STARTED_AT", "")
          finished = os.environ.get("BUILD_FINISHED_AT", "")
          duration = int(finished) - int(started) if started.isdigit() and finished.isdigit() else None

          def iso(epoch):
              return datetime.fromtimestamp(int(epoch), tz=timezone.utc).isoformat() if epoch.isdigit() else None

          toolchain = {
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "xcode": os.environ.get("XCODE_VERSION", ""),
              "clang": os.environ.get("CLANG_VERSION", ""),
              "python": os.environ.get("PYTHON_VERSION", ""),
          }
          manifest = {
              "schema_version": 1,
              "run_id": os.environ.get("RUN_ID", ""),
              "run_attempt": os.environ.get("RUN_ATTEMPT", ""),
              "experiment_id": os.environ.get("EXPERIMENT_ID", ""),
              "stage": os.environ.get("STAGE", ""),
              "target": TARGET,
              "accel": TARGET,
              "unixnu_commit": os.environ.get("UNIXNU_COMMIT", ""),
              "device_repo_commit": os.environ.get("DEVICE_COMMIT", ""),
              "unixnu_repo": os.environ.get("UNIXNU_REPO", "") or None,
              "device_repo": os.environ.get("DEVICE_REPO", "") or None,
              # The digest of the lock these commits were READ FROM, so a reader
              # can tell whether the lock moved after the run (PRD 8.1).
              "sources_lock_sha256": os.environ.get("LOCK_SHA256", "") or None,
              # Whether that lock declared itself frozen.  Recorded rather than
              # derived: an unfrozen build is legitimate (build-macos.sh treats
              # the pins as the freeze candidates) but a reader must be able to
              # tell the two apart without re-reading the lock at this commit.
              "sources_lock_frozen": os.environ.get("LOCK_FROZEN", "").strip().lower() == "true",
              "system_build": os.environ.get("SYSTEM_BUILD", "") or None,
              "repository": os.environ.get("REPO", ""),
              "ref": os.environ.get("REF", ""),
              "head_sha": os.environ.get("HEAD_SHA", ""),
              "toolchain": toolchain,
              "artifacts": entries,
              "excluded": excluded,
              "generated_by": "build-macos.yml",
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          (STAGE / "artifact-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report = {
              "schema_version": 1,
              "run_id": os.environ.get("RUN_ID", ""),
              "experiment_id": os.environ.get("EXPERIMENT_ID", ""),
              "stage": os.environ.get("STAGE", ""),
              "payload_target": TARGET,
              "started_at": iso(started),
              "finished_at": iso(finished),
              "duration_seconds": duration,
              "toolchain": toolchain,
              "artifact_count": len(entries),
              "artifact_bytes": sum(item["size_bytes"] for item in entries),
              "roles": {role: sum(1 for item in entries if item["role"] == role) for role in sorted({item["role"] for item in entries})},
              "excluded_count": len(excluded),
              "excluded": excluded,
              "problems": problems,
              "warnings": warnings,
              "status": "fail" if problems else "pass",
          }
          REPORT.mkdir(parents=True, exist_ok=True)
          (REPORT / "staging-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (STAGE / "build-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          print(f"staged {len(entries)} allowlisted file(s), {report['artifact_bytes']} bytes, roles={report['roles']}")
          print(f"excluded {len(excluded)} file(s) by default deny: {[item['path'] for item in excluded]}")
          print(f"manifest sha256: {hashlib.sha256((STAGE / 'artifact-manifest.json').read_bytes()).hexdigest()}")
          for warning in warnings:
              print(f"::warning::{warning}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Upload build artifact (allowlisted roles only, 30-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.artifact_name }}
          path: staged/
          retention-days: 30
          if-no-files-found: error

      # The full staged artifact is ~356 MB, most of it EDK2 and XNU build
      # intermediates (the bootloader role alone is 32713 files).  Downloading it
      # from Azure measured at ~60 KB/s, which is over 90 minutes -- so the one
      # run that produced a real kernel was also the one whose output was
      # impractical to act on.
      #
      # This collects just the boot inputs: the linked kernel, the DarwinBoot
      # driver image, the device trees, the firmware volume, the per-part hash
      # record, and the three machine-readable manifests.  Everything here is
      # named by what record_artifact() in build-macos.sh records, so the set
      # cannot drift from what the build declares.
      #
      # WHY THIS BUNDLE IS NOT A TREE GLOB, since that has already cost us once:
      # the earlier `unipad-build-*` upload carried the entire build tree -- about
      # 350-370 MB of EDK II and XNU intermediates, object files and feed clones
      # (run 40081850615 staged 37161 files, 1507736437 bytes) -- on a PUBLIC
      # repository, and it had to be deleted afterwards.  It was also unusable: at
      # the measured ~60 KB/s that download takes over 90 minutes.  So the set
      # below is enumerated file by file, nothing is globbed out of the tree, and
      # the payload's ESP image is named explicitly rather than by a directory.
      # PRD 8.2 step 4 keeps the same line: the allowlisted artifact uploads roles,
      # never a tree.
      #
      # READ THIS BEFORE TRUSTING THE PARAGRAPH ABOVE AS A DESCRIPTION OF THE
      # WORKFLOW.  It describes this step only.  The `Upload build artifact` step
      # directly above still does `path: staged/`, so `unipad-build-*` is still
      # ~370 MB of the same tree, on every run.  That is a known, unfixed defect,
      # measured again on run 40091901777 (368,499,519 bytes) after this bundle
      # existed.  It has not been changed because verify-artifacts.yml and
      # publish-artifacts.yml both resolve `unipad-build-*` and re-hash its
      # contents against artifact-manifest.json; narrowing the upload is a
      # contract change to those two workflows, not a one-line edit here.  Until
      # it is made, treat every `unipad-build-*` artifact as a tree, and use
      # `boot-inputs-*` for anything a human is expected to act on.
      - name: Collect the boot inputs into a small bundle
        if: always()
        env:
          STAGE_DIR: staged
          BUNDLE_DIR: boot-inputs
          BUILD_OUTPUT_DIR: build-output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          stage = Path(os.environ.get("STAGE_DIR", "staged"))
          bundle = Path(os.environ.get("BUNDLE_DIR", "boot-inputs"))
          out = Path(os.environ.get("BUILD_OUTPUT_DIR", "build-output"))
          # Recreated, never appended to, and removed on EVERY exit path below --
          # including the early ones.  A leftover from an earlier run would
          # otherwise be hashed into the manifest as if it were evidence about
          # this build, and the manifest's whole job is to say which bytes
          # produced a boot log.  The early refusals matter most: the upload step
          # is `if: always()`, so a partial directory would be published, and
          # `if-no-files-found: error` would not catch it because the directory
          # is not empty.  Measured: with no staged/ and a pre-existing
          # boot-inputs/leftover.efi, the refusal used to leave that file behind
          # with no manifest to say it is not from this build.
          shutil.rmtree(bundle, ignore_errors=True)
          if not stage.is_dir():
              print("::error::no staged directory; the build produced nothing")
              sys.exit(1)
          # What a boot needs, as path fragments.  Ordered most-specific first.
          WANTED = (
              "kernel.macho",
              "darwinboot-efi/",
              "boot.json",
              ".dtb",
              "ipsw-work/devicetree",
              ".fd",
              "artifact-manifest.json",
              "build-report.json",
              "stage-result.json",
              "ipsw-summary.json",
          )
          kept, total = 0, 0
          for source in sorted(stage.rglob("*")):
              if not source.is_file():
                  continue
              relative = source.relative_to(stage).as_posix()
              if not any(fragment in relative for fragment in WANTED):
                  continue
              destination = bundle / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              kept += 1
              total += source.stat().st_size

          # The payload set, taken from the build tree rather than from staged/:
          # the staging step's default deny excludes *.img (PRD 8.2 step 4: no raw
          # disk payloads in the allowlisted artifact), so payload.img is
          # deliberately absent from the big upload and is named here instead.
          # The device tree and the boot config were already lifted out of the ESP
          # and verified by build-macos.sh (mcopy, exactly how run-qemu.py:76
          # reads the volume), so this copies files that were checked -- a FAT
          # image is not something a downloader can open.
          PAYLOAD_SET = (
              # (glob under the build output, where it lands in the bundle)
              # UniXNU.efi is first because without it there is no
              # EFI/BOOT/BOOTAA64.EFI at all: the firmware starts a UEFI
              # *application* (PE subsystem 10, UniXNU.inf:13) and refuses a
              # driver (subsystem 11) with "The image is not an application.".
              # 'unixnu build package' builds it into package/Build/Out
              # (package.py:21-31); the payload volume deliberately does not
              # carry it, because run-qemu.py:93-95 is what puts it there.
              ("unixnu-out/*/package/Build/Out/AARCH64-*/UniXNU.efi", "UniXNU.efi"),
              ("unixnu-out/*/payload/payload.img", "payload.img"),
              ("payload-esp/EFI/UniXNU/Payloads/kernel.macho.adt", "kernel.macho.adt"),
              ("payload-esp/EFI/UniXNU/unixnu.toml", "unixnu.toml"),
              ("unixnu-out/*/payload/payload.json", "payload.json"),
              ("build-payload.driver.log", "logs/build-payload.driver.log"),
              ("build-payload.verify.log", "logs/build-payload.verify.log"),
              ("unixnu-out/*/logs/payload-adt.log", "logs/payload-adt.log"),
              ("unixnu-out/*/logs/payload-patch.log", "logs/payload-patch.log"),
              ("build-bootloader.subsystem.log", "logs/build-bootloader.subsystem.log"),
          )
          for pattern, name in PAYLOAD_SET:
              matches = sorted(out.glob(pattern))
              if not matches:
                  print(f"::warning::no {pattern} under {out.as_posix()}; the boot input set is incomplete")
                  continue
              if len(matches) > 1:
                  # Two payloads and no way to say which one booted.  The
                  # bundle is removed rather than left half-written: the upload
                  # step below is `if: always()`, so a partial directory would
                  # be published as a boot-inputs set, and
                  # `if-no-files-found: error` would not catch it because the
                  # directory is not empty.  Removing it makes the upload's own
                  # guard the thing that fires, one step later, with a message
                  # about the upload -- which is worse than this one but is at
                  # least not a silently incomplete bundle.
                  print(f"::error::{len(matches)} files match {pattern}: {[m.as_posix() for m in matches]}")
                  shutil.rmtree(bundle, ignore_errors=True)
                  sys.exit(1)
              source = matches[0]
              destination = bundle / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              kept += 1
              total += source.stat().st_size
          if not kept:
              print("::error::no boot inputs found in staged/")
              shutil.rmtree(bundle, ignore_errors=True)
              sys.exit(1)
          # A boot log is only evidence about the bytes that produced it, so the
          # bundle says which bytes it is.  Measured need: the three earlier
          # kernel.macho builds are not byte-identical (sha256 9fc119604838856d
          # on M2 versus 1f32f09bc7668de0 on M4), and a log that does not name
          # its kernel is a log nobody can reproduce.
          #
          # Absent entries are recorded as absent.  A missing payload file is a
          # warning and the step still exits 0 -- the build may legitimately not
          # have produced one -- so without this a bundle that LOST payload.img
          # would be indistinguishable, from the manifest alone, from a build
          # that never made it.  The manifest is the only thing a downloader
          # reads before booting, so it has to be able to say "not here".
          manifest = {
              path.relative_to(bundle).as_posix(): {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in sorted(bundle.rglob("*"))
              if path.is_file() and path.name != "manifest.json"
          }
          for pattern, name in PAYLOAD_SET:
              if name not in manifest:
                  manifest[name] = {"bytes": None, "sha256": None, "absent": True}
          (bundle / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          missing = sorted(name for name, entry in manifest.items() if entry.get("absent"))
          print(f"boot inputs: {kept} file(s), {total} bytes; manifest.json names {len(manifest)}"
                + (f" ({len(missing)} absent: {missing})" if missing else ""))
          for path in sorted(bundle.rglob("*")):
              if path.is_file():
                  print(f"  {path.relative_to(bundle).as_posix()} {path.stat().st_size}")
          PY

      - name: Upload the boot inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-inputs-${{ github.run_id }}
          path: boot-inputs/
          retention-days: 30
          if-no-files-found: error

      # The Data seed is the one piece of a boot that cannot be produced on the
      # Windows host: it is the OS volume's own /private/var, and making one
      # means running the upstream chain on macOS.  So it has to leave this
      # runner, and it may not leave by the public artifact path (PRD 12).
      #
      # It leaves ENCRYPTED, and the two halves travel by different routes on
      # purpose: the passphrase is the MATERIAL_DELIVERY_KEY secret and never
      # touches the runner's disk in a file, and the ciphertext is this
      # artifact.  The material-manifest stage deleted the plaintext as soon as
      # it had a ciphertext, so there is no window in which the plaintext is
      # both on disk and staged.
      #
      # Size, measured rather than assumed: the packed seed is 1,245,328 bytes
      # (~1.2 MiB), four orders of magnitude below this workflow's own 2 GiB
      # MAX_FILE_BYTES and below GitHub's artifact limits, so the encrypted form
      # travels as an artifact and needs no external store.  What must never go
      # into a secret is the multi-GB IPSW material -- and this is not that; a
      # secret carries a passphrase, not a payload.
      #
      # `if: always()` with an existence check rather than a bare upload: a run
      # whose owner root chain did not build has no material to deliver, and
      # that is a recorded outcome, not a failed job.  The step also decides
      # whether anything is uploaded at all: with MATERIAL_DELIVERY_KEY unset
      # the delivery is a PLAINTEXT Apple-derived seed, and an unencrypted seed
      # is not deliverable by any channel this workflow controls -- so it is
      # reported, never uploaded, and removed from the runner below.
      - name: Report the material delivery
        id: material
        if: always()
        run: |
          set -uo pipefail
          if [ -d build-output/private ]; then
            echo "the material delivery directory:"
            for f in build-output/private/*; do
              [ -f "$f" ] || continue
              echo "  ${f#build-output/} $(wc -c <"$f" | tr -d ' ') bytes"
            done
            if [ -f build-output/private/owner-data-1g.dbr.enc ]; then
              echo "encrypted=yes" >> "$GITHUB_OUTPUT"
              echo "the Data seed is encrypted; decrypt with MATERIAL_DELIVERY_KEY"
            else
              echo "encrypted=no" >> "$GITHUB_OUTPUT"
              echo "::warning::the Data seed is NOT encrypted (MATERIAL_DELIVERY_KEY is unset); collect it from this runner directly and never from any artifact"
            fi
          else
            echo "encrypted=no" >> "$GITHUB_OUTPUT"
            echo "no material delivery this run: the owner root chain did not build, so there is no Data seed"
          fi

      - name: Deliver the encrypted material (private channel)
        if: always() && steps.material.outputs.encrypted == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: owner-data-material-${{ github.run_id }}
          # The whole directory, and NOT a list of names.  The manifest is the
          # authority on what belongs to a matched build, and the material
          # manifest stage already staged every role it names into this
          # directory -- the kernel, the device tree, the trust bundle, the boot
          # config, the donor kernelcache and the seed's ciphertext, beside the
          # manifest that binds them.  Naming two of them here (which is what
          # this step used to do) produced a delivery that could not be
          # verified: `material_manifest --verify` refuses a root missing any
          # role other than the two board-pinned IPSW members, so the host would
          # download the seed and its index and then be told the kernel was
          # absent.  The delivery is the one place a matched build is whole, so
          # it ships whole -- and a role added later travels because the
          # directory is shipped, not because someone remembered a second list.
          #
          # The public staging step excludes this same directory by pattern
          # (`private/*`, above), so nothing here reaches the public artifact.
          path: build-output/private/
          retention-days: 30
          if-no-files-found: error

      # The counterpart of the encrypted path.  The material-manifest stage
      # deletes the plaintext itself as soon as it has a ciphertext, so this
      # only ever fires on a run that had no key -- and on such a run the
      # plaintext has been verified, logged and left for collection from the
      # runner, and must not then sit on a persistent runner's disk forever.
      # PRD 12 is about where the material ends up, not about how long it took
      # to get there.
      - name: Remove the unencrypted material from the runner
        if: always()
        run: |
          set -euo pipefail
          # Every Apple-derived member, not only the seed.  The donor kernelcache
          # is the original Apple binary board.toml [kernel.prelink] pins and the
          # trust bundle is the static and System trust caches out of the same
          # IPSW; this repository is PUBLIC, so anything that survives the job on
          # a persistent runner is a second copy of Apple material nobody
          # accounted for.  On a run WITH the key the stage deleted each of these
          # the moment it had a ciphertext, so this is a belt over that braces:
          # it fires on a run with no key, and reports "nothing to remove" on a
          # run that did its job.
          removed=0
          for member in owner-data-1g.dbr kernelcache.decompressed original-static-system.bundle; do
            path="build-output/private/$member"
            if [ -f "$path" ]; then
              rm -f "$path"
              echo "removed $path: MATERIAL_DELIVERY_KEY was unset, so an unencrypted Apple-derived member must not survive the job (PRD 12)"
              removed=$(( removed + 1 ))
            fi
          done
          if [ "$removed" -eq 0 ]; then
            echo "no unencrypted Apple-derived material on this runner: either the key was set and each member was deleted as it was encrypted, or the material-manifest stage never produced any"
          fi

      # A chain that was ATTEMPTED and failed is a failed run, and it must not be
      # able to end green.  This is implementation-plan fact 88's shape a third
      # time: the step is continue-on-error so the logs and the artifacts still
      # upload, which is right, but the consequence was that run 40362810790 --
      # whose chain died at build-os-root.py:109 -- reported
      # `conclusion: success` with no Data seed, no manifest and no delivery,
      # while every step that ran reported success beside it.
      #
      # `outcome` and not `conclusion`: continue-on-error rewrites the conclusion
      # to success and leaves the outcome as what actually happened, so this
      # condition is exactly "the step ran and failed".  The two ways the chain
      # legitimately does not run are both excluded -- `not_run` is set (and the
      # step exits 0) when it was refused for a missing input, and a step skipped
      # because the volumes were never published has outcome 'skipped'.
      #
      # Placed here, after every upload and after the unencrypted seed is gone,
      # so the failure costs nothing but the verdict.
      #
      # MEASURED on run 40447173615, dispatched with stage=M2: the chain printed
      # THREE `::error::` lines -- naming payload.img, build-storage-abi.py:18,31,
      # and "Trigger this workflow with stage=M3 or later" -- recorded
      # `os_root_status=not_run`, exited 0, and the RUN concluded `success` with
      # no seed, no manifest and no delivery.  Every step reported success beside
      # it.  The `not_run` exit 0 is right for the step (the chain did not break,
      # it was refused, and a failed step would read as the former) -- but
      # nothing turned it into a run-level verdict, so "attempted and refused"
      # and "never attempted" produced the same green run.
      #
      # `not_run` is now a verdict too, and it is distinguishable from the
      # skipped case: a step SKIPPED because the volumes were never published has
      # outcome 'skipped' and leaves os_root_status empty, so this condition
      # cannot fire on it.  What it fires on is a run whose volumes WERE
      # published and whose first build pass still did not produce the kernel or
      # the payload -- which is an operator error, not an outcome.
      - name: The owner root chain's outcome is part of the run's verdict
        if: always() && (steps.os_root.outcome == 'failure' || steps.os_root.outputs.os_root_status == 'not_run')
        run: |
          if [ "${{ steps.os_root.outputs.os_root_status }}" = 'not_run' ]; then
            echo "::error::the owner root chain was REFUSED for a missing input (os_root_status=not_run), so this run produced no matched-build material."
            echo "::error::The step exited 0 on purpose -- the chain did not break, it was refused -- but a refused chain is still a run with no seed, no manifest and no delivery, and it must not read as success."
            echo "::error::The three ::error:: lines the chain step printed name the missing file and the fix. For the payload case: build-payload loads DarwinBoot.efi as a driver and plan_steps gates build-bootloader at n>=3, so a stage below M3 plans a payload stage with no bootloader to load. Trigger this workflow with stage=M3 or later."
          else
            echo "::error::the owner root chain was attempted and FAILED, so this run produced no matched-build material."
            echo "::error::See ipsw-work/os-root.log (uploaded with the build logs) for the failure and, if the retries ran out, for the diskutil listings the failing line reads."
          fi
          echo "::error::No Data seed, no material manifest and no encrypted delivery exist for this run. Treat every artifact it uploaded as unmatched: a kernel built for a Data volume UUID nobody delivered."
          exit 1

      # The same rule for the provisioning step, and the distinction between its
      # two failure modes is the whole reason it is a separate step.
      #
      # The script fails BEFORE it writes anything -- it unpacks, attaches,
      # provisions, checks the volume UUID, detaches, and only then packs -- so a
      # script failure leaves the ORIGINAL seed on disk and the delivery that
      # ships is a valid matched build that merely still lacks
      # /private/var/containers.  That is a recorded outcome, not a failed run:
      # the seed still binds to the kernel it was built with, and the guest still
      # mounts it.  It is reported as a warning so nobody reads "provisioned"
      # into a run that did not provision.
      #
      # The shell's own UUID check runs AFTER the swap, so it is the one failure
      # that can leave an unidentified seed under the real role's name.  That one
      # is a hard failure: a seed whose volume UUID moved no longer binds to the
      # kernel, it would still mount, and every downstream check would pass on a
      # machine nobody identified.
      #
      # `provision_swapped` is the discriminator, and it is an OUTPUT rather than
      # a file on disk because the "Remove the extracted firmware material" step
      # deletes the whole owner-data directory -- provision-report.json included
      # -- before any verdict runs.  A file-based check here would find nothing
      # on every run and take the warning branch unconditionally, which is the
      # shape of a guard that looks like it works.
      - name: The Data seed's provisioning outcome is part of the run's verdict
        if: always() && steps.provision.outcome == 'failure'
        run: |
          if [ "${{ steps.provision.outputs.provision_swapped }}" = 'yes' ]; then
            echo "::error::Data seed provisioning failed AFTER the seed was swapped in. The seed on disk may not be the one the kernel was built for; do not boot it."
            exit 1
          fi
          echo "::warning::Data seed provisioning failed before it wrote anything, so the delivered seed is the chain's original: a valid matched build WITHOUT /private/var/containers. Expect the guest's sandbox to fail container resolution and SpringBoard to crash-loop (implementation-plan fact 99)."

      - name: Step summary
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.naming.outputs.artifact_name }}
          REPORT_DIR: build
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          STAGE: ${{ inputs.stage }}
          PAYLOAD_TARGET: ${{ inputs.payload_target }}
          # The pins the lock resolved, not the dispatch request: a summary that
          # quotes the request is evidence about a build that did not happen.
          UNIXNU_COMMIT: ${{ steps.sources.outputs.unixnu_commit || inputs.unixnu_commit }}
          DEVICE_COMMIT: ${{ steps.sources.outputs.device_commit || inputs.device_commit }}
          REQUESTED_UNIXNU_COMMIT: ${{ inputs.unixnu_commit }}
          REQUESTED_DEVICE_COMMIT: ${{ inputs.device_commit }}
        run: |
          python3 - <<'PY'
          """Write the GitHub step summary from build/staging-report.json (evidence, PRD 9.2)."""
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ.get("REPORT_DIR", "build")) / "staging-report.json"
          lines = [
              "### UniPad macOS build",
              "",
              f"- experiment: {os.environ.get('EXPERIMENT_ID', '')}",
              f"- stage: {os.environ.get('STAGE', '')} / payload target: {os.environ.get('PAYLOAD_TARGET', '')}",
              f"- unixnu: {os.environ.get('UNIXNU_COMMIT', '')}",
              f"- device repo: {os.environ.get('DEVICE_COMMIT', '')}",
              f"- artifact: `{os.environ.get('ARTIFACT_NAME', '')}` (retention 30 days)",
          ]
          # When the dispatch form asked for something other than the lock, say
          # so: the build used the lock, and a silent difference between the two
          # is the divergence this whole step exists to surface.
          requested = (
              os.environ.get("REQUESTED_UNIXNU_COMMIT", ""),
              os.environ.get("REQUESTED_DEVICE_COMMIT", ""),
          )
          used = (
              os.environ.get("UNIXNU_COMMIT", ""),
              os.environ.get("DEVICE_COMMIT", ""),
          )
          if any(a and a != b for a, b in zip(requested, used)):
              lines.append(
                  f"- WARNING: the dispatch inputs {requested[0]} / {requested[1]} differ from the "
                  f"pins {used[0]} / {used[1]} the lock resolved and this build used"
              )
          if report_path.is_file():
              data = json.loads(report_path.read_text(encoding="utf-8"))
              lines += [
                  f"- staged files: {data.get('artifact_count')} ({data.get('artifact_bytes')} bytes)",
                  f"- roles: {data.get('roles')}",
                  f"- build duration: {data.get('duration_seconds')}s",
                  f"- excluded by default deny: {data.get('excluded_count')}",
                  f"- status: {data.get('status')}",
              ]
          else:
              lines.append("- staging report unavailable: the build failed before staging, so no artifact was uploaded")

          # The source acquisition and the pin cross-check are evidence about
          # what was built, not products of it, so they are reported here
          # rather than staged.  What could NOT be proven on a Windows
          # code-stage host is listed verbatim: a reader of the summary must
          # not be able to mistake a Windows-side proof for a field proof.
          for name, label in (
              ("source-acquisition.json", "sources"),
              ("pin-crosscheck.json", "pin cross-check"),
          ):
              path = Path(os.environ.get("REPORT_DIR", "build")) / name
              if not path.is_file():
                  lines.append(f"- {label}: no report (the step did not run)")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              lines.append(f"- {label}: {data.get('status')}")
              for problem in data.get("problems") or []:
                  lines.append(f"  - problem: {problem}")
              for note in data.get("unverified") or []:
                  lines.append(f"  - unverified: {note}")
          text = "\n".join(lines) + "\n"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(text)
          print(text)
          PY
