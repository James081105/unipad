name: build-acceptance-apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect the two UIKit Device IPAs
        run: python3 scripts/macos/build-acceptance-apps.py --out build/acceptance-apps
      - name: Preserve build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-apps-${{ github.run_id }}
          path: build/acceptance-apps/
          if-no-files-found: error
          retention-days: 30
